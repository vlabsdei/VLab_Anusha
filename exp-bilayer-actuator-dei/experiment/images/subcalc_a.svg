<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axes { stroke: #334155; stroke-width: 1.5; }
      .grid { stroke: #E2E8F0; stroke-width: 0.8; }
      .curve { stroke: #1E40AF; stroke-width: 2.5; fill: none; }
      .active { fill: #E2570F; opacity: 0.3; }
      .passive { fill: #9CA3AF; opacity: 0.3; }
      .text-label { font: 13px sans-serif; fill: #334155; }
      .highlight { stroke: #E2570F; stroke-width: 2; }
      .neutral { stroke: #E2570F; stroke-width: 1.5; stroke-dasharray: 3,3; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Left side: Bilayer cantilever structure -->
  <g>
    <!-- Title -->
    <text x="100" y="25" class="text-label" font-weight="bold" font-size="14">Bilayer Cantilever Bending</text>

    <!-- Cantilever beam (active layer, top) -->
    <rect x="30" y="100" width="140" height="35" class="active" stroke="#334155" stroke-width="1"/>
    <text x="55" y="125" class="text-label" font-size="11">Active layer</text>

    <!-- Cantilever beam (passive layer, bottom) -->
    <rect x="30" y="135" width="140" height="50" class="passive" stroke="#334155" stroke-width="1"/>
    <text x="50" y="168" class="text-label" font-size="11">Passive layer</text>

    <!-- Fixed support -->
    <rect x="20" y="95" width="10" height="95" fill="#334155" stroke="#000" stroke-width="1"/>
    <line x1="15" y1="95" x2="25" y2="105" class="axes"/>
    <line x1="15" y1="105" x2="25" y2="115" class="axes"/>
    <line x1="15" y1="115" x2="25" y2="125" class="axes"/>
    <line x1="15" y1="125" x2="25" y2="135" class="axes"/>

    <!-- Neutral axis -->
    <line x1="30" y1="128" x2="170" y2="128" class="neutral"/>
    <text x="105" y="145" class="text-label" font-size="11" fill="#E2570F">y<tspan baseline-shift="sub">na</tspan></text>

    <!-- Stimulus arrow -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#E2570F" />
      </marker>
    </defs>
    <line x1="175" y1="115" x2="205" y2="115" stroke="#E2570F" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="185" y="105" class="text-label" font-size="11" fill="#E2570F">ΔT</text>
  </g>

  <!-- Right side: Stress profile across thickness -->
  <g>
    <text x="300" y="25" class="text-label" font-weight="bold" font-size="14">Bending Stress σ(y)</text>

    <!-- Axes for stress plot -->
    <line x1="280" y1="50" x2="280" y2="240" class="axes"/>
    <line x1="280" y1="240" x2="420" y2="240" class="axes"/>

    <!-- Grid lines (faint) -->
    <line x1="280" y1="145" x2="420" y2="145" class="grid"/>

    <!-- Axis labels -->
    <text x="410" y="260" class="text-label" font-size="11">σ</text>
    <text x="260" y="55" class="text-label" font-size="11">y</text>

    <!-- Tick marks and scale -->
    <line x1="275" y1="240" x2="280" y2="240" class="axes"/>
    <line x1="275" y1="145" x2="280" y2="145" class="axes"/>
    <line x1="275" y1="50" x2="280" y2="50" class="axes"/>
    <text x="245" y="245" class="text-label" font-size="10">-σ_max</text>
    <text x="255" y="150" class="text-label" font-size="10">0</text>
    <text x="245" y="55" class="text-label" font-size="10">+σ_max</text>

    <!-- Stress distribution curve (parabolic profile) -->
    <path d="M 280 240 Q 330 185 380 145 Q 330 105 280 50" class="curve"/>

    <!-- Vertical line at neutral axis -->
    <line x1="380" y1="50" x2="380" y2="240" class="neutral" stroke-width="1.5"/>

    <!-- Layer boundaries -->
    <line x1="290" y1="107" x2="370" y2="107" class="axes" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="375" y="107" class="text-label" font-size="10">Interface</text>

    <!-- Annotations -->
    <text x="330" y="75" class="text-label" font-size="10" fill="#E2570F">Tension</text>
    <text x="310" y="210" class="text-label" font-size="10" fill="#E2570F">Compression</text>
  </g>

  <!-- Bottom: Key formula -->
  <g>
    <rect x="30" y="290" width="560" height="55" fill="#F1F5F9" stroke="#334155" stroke-width="1" rx="3"/>
    <text x="50" y="315" class="text-label" font-weight="bold" font-size="12">Timoshenko Formula:</text>
    <text x="50" y="335" class="text-label" font-size="11">κ = 6·Δε·(1+m)² / (h·φ),  where φ = 3(1+m)² + (1+mn)(m²+1/(mn))</text>
  </g>
</svg>