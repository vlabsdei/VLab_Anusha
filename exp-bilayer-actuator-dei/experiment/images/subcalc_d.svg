<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axes { stroke: #334155; stroke-width: 1.5; }
      .grid { stroke: #E2E8F0; stroke-width: 0.8; }
      .curve { stroke: #1E40AF; stroke-width: 2.5; fill: none; }
      .text-label { font: 13px sans-serif; fill: #334155; }
      .highlight { stroke: #E2570F; stroke-width: 2; }
      .annotation-box { fill: #FFF5E6; stroke: #E2570F; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#334155" />
    </marker>
    <marker id="arrowhead-small" markerWidth="8" markerHeight="8" refX="7" refY="2" orient="auto">
      <polygon points="0 0, 8 2, 0 4" fill="#E2570F" />
    </marker>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="30" y="25" class="text-label" font-weight="bold" font-size="14">Fickian Moisture Diffusion &amp; Uptake</text>

  <!-- Main axes -->
  <line x1="80" y1="240" x2="470" y2="240" class="axes"/>
  <line x1="80" y1="50" x2="80" y2="240" class="axes"/>

  <!-- Grid lines -->
  <line x1="80" y1="145" x2="470" y2="145" class="grid"/>
  <line x1="150" y1="50" x2="150" y2="240" class="grid"/>
  <line x1="220" y1="50" x2="220" y2="240" class="grid"/>
  <line x1="290" y1="50" x2="290" y2="240" class="grid"/>
  <line x1="360" y1="50" x2="360" y2="240" class="grid"/>
  <line x1="430" y1="50" x2="430" y2="240" class="grid"/>

  <!-- Axis labels -->
  <text x="440" y="260" class="text-label" font-size="12" font-weight="bold">τ = Dt/L² (Fourier number)</text>
  <text x="15" y="55" class="text-label" font-size="12" font-weight="bold">C̄(τ)</text>

  <!-- Y-axis tick marks and labels -->
  <line x1="75" y1="240" x2="80" y2="240" class="axes"/>
  <text x="50" y="245" class="text-label" font-size="10">0</text>

  <line x1="75" y1="145" x2="80" y2="145" class="axes"/>
  <text x="40" y="150" class="text-label" font-size="10">0.5</text>

  <line x1="75" y1="50" x2="80" y2="50" class="axes"/>
  <text x="45" y="55" class="text-label" font-size="10">1.0</text>

  <!-- X-axis tick marks and labels -->
  <line x1="80" y1="240" x2="80" y2="245" class="axes"/>
  <text x="70" y="265" class="text-label" font-size="10">0</text>

  <line x1="150" y1="240" x2="150" y2="245" class="axes"/>
  <text x="138" y="265" class="text-label" font-size="9">0.1</text>

  <line x1="220" y1="240" x2="220" y2="245" class="axes"/>
  <text x="208" y="265" class="text-label" font-size="9">0.2</text>

  <line x1="290" y1="240" x2="290" y2="245" class="axes"/>
  <text x="278" y="265" class="text-label" font-size="9">0.3</text>

  <line x1="360" y1="240" x2="360" y2="245" class="axes"/>
  <text x="348" y="265" class="text-label" font-size="9">0.4</text>

  <line x1="430" y1="240" x2="430" y2="245" class="axes"/>
  <text x="418" y="265" class="text-label" font-size="9">0.5</text>

  <!-- Fickian uptake curve: S-shaped -->
  <path d="M 80 235 Q 120 225 150 200 Q 180 170 220 120 Q 250 85 290 65 Q 320 55 360 52 Q 400 50 470 50" class="curve"/>

  <!-- t_diff marker (first decay time, approximately at τ = 0.1) -->
  <circle cx="150" cy="200" r="3" fill="#E2570F"/>
  <line x1="150" y1="200" x2="150" y2="240" class="highlight" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="150" y1="240" x2="150" y2="255" class="highlight" stroke-width="1" marker-end="url(#arrowhead-small)"/>
  <text x="140" y="280" class="text-label" font-size="10" fill="#E2570F" font-weight="bold">t<tspan baseline-shift="sub">diff</tspan></text>

  <!-- t_90 marker (90% uptake, approximately at τ = 0.26) -->
  <circle cx="290" cy="65" r="3" fill="#E2570F"/>
  <line x1="290" y1="65" x2="290" y2="240" class="highlight" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="290" y1="240" x2="290" y2="255" class="highlight" stroke-width="1" marker-end="url(#arrowhead-small)"/>
  <text x="268" y="280" class="text-label" font-size="10" fill="#E2570F" font-weight="bold">t<tspan baseline-shift="sub">90</tspan></text>

  <!-- Horizontal reference at 90% -->
  <line x1="80" y1="65" x2="470" y2="65" class="grid" stroke-dasharray="2,2" stroke-width="0.8"/>
  <text x="50" y="70" class="text-label" font-size="9" fill="#666">90%</text>

  <!-- Inset: L² scaling -->
  <g>
    <rect x="485" y="90" width="120" height="95" class="annotation-box" rx="2"/>
    <text x="495" y="110" class="text-label" font-size="11" font-weight="bold">Response Time</text>
    <text x="495" y="130" class="text-label" font-size="10">t<tspan baseline-shift="sub">90</tspan> ∝ L²/D</text>
    <text x="495" y="150" class="text-label" font-size="9" fill="#E2570F">Halve thickness:</text>
    <text x="495" y="165" class="text-label" font-size="9" fill="#E2570F">Quarter time</text>
    <text x="495" y="180" class="text-label" font-size="9">(powerful design knob)</text>
  </g>
</svg>