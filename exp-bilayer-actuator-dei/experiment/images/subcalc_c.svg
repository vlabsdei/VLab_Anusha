<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axes { stroke: #334155; stroke-width: 1.5; }
      .grid { stroke: #E2E8F0; stroke-width: 0.8; }
      .curve { stroke: #1E40AF; stroke-width: 2.5; fill: none; }
      .text-label { font: 13px sans-serif; fill: #334155; }
      .highlight { stroke: #E2570F; stroke-width: 2.5; }
      .region-bend { fill: #E0F0FF; opacity: 0.3; }
      .region-twist { fill: #FFE6D6; opacity: 0.3; }
      .region-mixed { fill: #F0E6FF; opacity: 0.3; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#334155" />
    </marker>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="30" y="25" class="text-label" font-weight="bold" font-size="14">Print-Path Raster Angle Mapping (m = 1)</text>

  <!-- Main axes -->
  <line x1="80" y1="300" x2="500" y2="300" class="axes"/>
  <line x1="80" y1="60" x2="80" y2="300" class="axes"/>

  <!-- Grid -->
  <line x1="80" y1="180" x2="500" y2="180" class="grid"/>
  <line x1="80" y1="240" x2="500" y2="240" class="grid"/>
  <line x1="80" y1="120" x2="500" y2="120" class="grid"/>
  <line x1="200" y1="60" x2="200" y2="300" class="grid"/>
  <line x1="290" y1="60" x2="290" y2="300" class="grid"/>
  <line x1="380" y1="60" x2="380" y2="300" class="grid"/>

  <!-- Axis labels -->
  <text x="490" y="320" class="text-label" font-size="12" font-weight="bold">Raster Angle θ (°)</text>
  <text x="30" y="65" class="text-label" font-size="11" font-weight="bold">Mode</text>

  <!-- Tick marks and labels on x-axis -->
  <line x1="80" y1="300" x2="80" y2="305" class="axes"/>
  <text x="70" y="320" class="text-label" font-size="11">0°</text>

  <line x1="200" y1="300" x2="200" y2="305" class="axes"/>
  <text x="190" y="320" class="text-label" font-size="11">22.5°</text>

  <line x1="290" y1="300" x2="290" y2="305" class="axes"/>
  <text x="280" y="320" class="text-label" font-size="11">45°</text>

  <line x1="380" y1="300" x2="380" y2="305" class="axes"/>
  <text x="370" y="320" class="text-label" font-size="11">67.5°</text>

  <line x1="500" y1="300" x2="500" y2="305" class="axes"/>
  <text x="490" y="320" class="text-label" font-size="11">90°</text>

  <!-- Y-axis labels -->
  <text x="50" y="70" class="text-label" font-size="10">Bend</text>
  <text x="45" y="125" class="text-label" font-size="10">Mixed</text>
  <text x="45" y="185" class="text-label" font-size="10">Twist</text>
  <text x="45" y="245" class="text-label" font-size="10">Mixed</text>
  <text x="50" y="305" class="text-label" font-size="10">Bend</text>

  <!-- Bending mode curve: α_eff difference (proportional to cos²θ - sin²θ) -->
  <path d="M 80 70 Q 140 80 200 120 Q 240 160 290 180 Q 340 160 380 120 Q 440 80 500 70" class="highlight" stroke-width="3"/>

  <!-- Twist mode curve: α_xy difference (proportional to sin(2θ)) -->
  <path d="M 80 240 Q 140 200 200 140 Q 240 100 290 60 Q 340 100 380 140 Q 440 200 500 240" class="highlight" stroke-width="3"/>

  <!-- Region fills -->
  <rect x="80" y="60" width="120" height="60" class="region-bend"/>
  <rect x="200" y="100" width="90" height="80" class="region-mixed"/>
  <rect x="270" y="140" width="40" height="80" class="region-twist" opacity="0.6"/>
  <rect x="310" y="100" width="90" height="80" class="region-mixed"/>
  <rect x="420" y="60" width="80" height="60" class="region-bend"/>

  <!-- Annotations -->
  <!-- 0°/90° pair (bending) -->
  <g>
    <rect x="40" y="40" width="80" height="40" fill="white" stroke="#334155" stroke-width="1" rx="2"/>
    <text x="50" y="55" class="text-label" font-size="10" font-weight="bold">0°/90° pair:</text>
    <text x="50" y="70" class="text-label" font-size="9">Pure cylindrical</text>
    <text x="50" y="82" class="text-label" font-size="9">bending</text>
  </g>

  <!-- 45°/-45° pair (twisting) -->
  <g>
    <rect x="250" y="200" width="90" height="40" fill="white" stroke="#E2570F" stroke-width="1.5" rx="2"/>
    <text x="260" y="215" class="text-label" font-size="10" font-weight="bold" fill="#E2570F">45°/-45° pair:</text>
    <text x="260" y="230" class="text-label" font-size="9" fill="#E2570F">Pure twist</text>
  </g>

  <!-- Mixed pairs (helix) -->
  <g>
    <rect x="430" y="200" width="90" height="40" fill="white" stroke="#9333EA" stroke-width="1.5" rx="2"/>
    <text x="440" y="215" class="text-label" font-size="10" font-weight="bold" fill="#9333EA">Mixed pairs:</text>
    <text x="440" y="230" class="text-label" font-size="9" fill="#9333EA">Helical coil</text>
  </g>
</svg>