<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#334155">Korsmeyer&#8211;Peppas release: log-log power law</text>

  <!-- ===== Main plot: log(M_t/M_∞) vs log(t) ===== -->
  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="50" x2="70" y2="290"/>
    <line x1="130" y1="50" x2="130" y2="290"/>
    <line x1="190" y1="50" x2="190" y2="290"/>
    <line x1="250" y1="50" x2="250" y2="290"/>
    <line x1="310" y1="50" x2="310" y2="290"/>
    <line x1="70" y1="80" x2="370" y2="80"/>
    <line x1="70" y1="140" x2="370" y2="140"/>
    <line x1="70" y1="200" x2="370" y2="200"/>
    <line x1="70" y1="260" x2="370" y2="260"/>
  </g>
  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="290" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="290" x2="370" y2="290" stroke="#334155" stroke-width="1.6"/>
  <text x="220" y="322" font-size="12.5" fill="#334155" text-anchor="middle">log(time)</text>
  <text x="26" y="170" font-size="12.5" fill="#334155" text-anchor="middle" transform="rotate(-90 26 170)">log(M&#8339; / M<sub>∞</sub>)  (% released)</text>
  <text x="70" y="306" font-size="10" fill="#475569" text-anchor="middle">0.1</text>
  <text x="190" y="306" font-size="10" fill="#475569" text-anchor="middle">1</text>
  <text x="310" y="306" font-size="10" fill="#475569" text-anchor="middle">10</text>
  <text x="64" y="54" font-size="10" fill="#475569" text-anchor="end">-3</text>
  <text x="64" y="140" font-size="10" fill="#475569" text-anchor="end">-1</text>
  <text x="64" y="250" font-size="10" fill="#475569" text-anchor="end">-0.2</text>
  <text x="64" y="294" font-size="10" fill="#475569" text-anchor="end">0</text>

  <!-- Korsmeyer-Peppas curves for three exponents on log-log plot -->
  <!-- n = 0.5 (Fickian diffusion) slope m=0.5, roughly from (0.1, -3) to (10, -0.2) -->
  <line x1="70" y1="250" x2="310" y2="60" stroke="#E2570F" stroke-width="2.8" stroke-dasharray="5 2"/>
  <text x="315" y="62" font-size="10" fill="#E2570F" font-weight="700">n = 0.5</text>
  <text x="315" y="76" font-size="8.5" fill="#E2570F">Fickian</text>

  <!-- n = 0.75 (anomalous transport) slope m=0.75 -->
  <line x1="70" y1="265" x2="310" y2="55" stroke="#E2570F" stroke-width="2.8"/>
  <text x="315" y="120" font-size="10" fill="#E2570F" font-weight="700">n = 0.75</text>
  <text x="315" y="134" font-size="8.5" fill="#E2570F">anomalous</text>

  <!-- n = 1.0 (case-II, zero-order) slope m=1 -->
  <line x1="70" y1="275" x2="310" y2="50" stroke="#E2570F" stroke-width="2.8" stroke-dasharray="2 3"/>
  <text x="315" y="178" font-size="10" fill="#E2570F" font-weight="700">n = 1.0</text>
  <text x="315" y="192" font-size="8.5" fill="#E2570F">case-II</text>

  <!-- 60% validity cutoff vertical line -->
  <line x1="280" y1="50" x2="280" y2="290" stroke="#1E40AF" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="280,50 275,60 285,60" fill="#1E40AF"/>
  <text x="280" y="45" font-size="10" fill="#1E40AF" text-anchor="middle" font-weight="700">60%</text>

  <!-- Shade the invalid zone (past 60%) -->
  <rect x="280" y="50" width="90" height="240" fill="#1E40AF" opacity="0.06"/>
  <text x="325" y="180" font-size="10" fill="#1E40AF" font-weight="600" text-anchor="middle">unreliable</text>
  <text x="325" y="194" font-size="9" fill="#1E40AF" text-anchor="middle">(boundary effects)</text>

  <!-- Axis arrows showing slope interpretation -->
  <path d="M100,160 L120,140" stroke="#334155" stroke-width="1.2" fill="none" stroke-dasharray="2 2"/>
  <text x="80" y="175" font-size="9" fill="#334155">slope = n</text>

  <!-- Right-side annotations -->
  <text x="420" y="85" font-size="11" fill="#334155" font-weight="700">Release mechanism</text>
  <line x1="420" y1="100" x2="590" y2="100" stroke="#334155" stroke-width="0.8"/>

  <line x1="420" y1="115" x2="440" y2="115" stroke="#E2570F" stroke-width="2.5" stroke-dasharray="5 2"/>
  <text x="450" y="120" font-size="9" fill="#1E40AF">Diffusion (n=0.5)</text>

  <line x1="420" y1="145" x2="440" y2="145" stroke="#E2570F" stroke-width="2.5"/>
  <text x="450" y="150" font-size="9" fill="#1E40AF">Anomalous (0.5&lt;n&lt;1)</text>

  <line x1="420" y1="175" x2="440" y2="175" stroke="#E2570F" stroke-width="2.5" stroke-dasharray="2 3"/>
  <text x="450" y="180" font-size="9" fill="#1E40AF">Zero-order (n=1.0)</text>

  <rect x="420" y="205" width="12" height="12" fill="#1E40AF" opacity="0.1"/>
  <text x="450" y="215" font-size="9" fill="#1E40AF">Model valid zone</text>

  <!-- Key formula -->
  <text x="420" y="260" font-size="10" fill="#334155" font-weight="600">Key: t&#8320;&#8322; = (0.5/k)^(1/n)</text>
  <text x="420" y="275" font-size="9" fill="#475569">(half-dose time)</text>
</svg>
