<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#334155">LCST collapse &#8594; temperature-actuated valve</text>

  <!-- ===== Left plot: Swelling ratio Q(T) ===== -->
  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="50" x2="70" y2="290"/>
    <line x1="120" y1="50" x2="120" y2="290"/>
    <line x1="170" y1="50" x2="170" y2="290"/>
    <line x1="220" y1="50" x2="220" y2="290"/>
    <line x1="270" y1="50" x2="270" y2="290"/>
    <line x1="320" y1="50" x2="320" y2="290"/>
    <line x1="70" y1="98" x2="370" y2="98"/>
    <line x1="70" y1="146" x2="370" y2="146"/>
    <line x1="70" y1="194" x2="370" y2="194"/>
    <line x1="70" y1="242" x2="370" y2="242"/>
  </g>
  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="290" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="290" x2="380" y2="290" stroke="#334155" stroke-width="1.6"/>
  <text x="220" y="322" font-size="12.5" fill="#334155" text-anchor="middle">temperature (°C)</text>
  <text x="26" y="170" font-size="12.5" fill="#334155" text-anchor="middle" transform="rotate(-90 26 170)">swelling ratio  Q</text>
  <text x="70" y="306" font-size="10" fill="#475569" text-anchor="middle">20</text>
  <text x="170" y="306" font-size="10" fill="#475569" text-anchor="middle">30</text>
  <text x="270" y="306" font-size="10" fill="#475569" text-anchor="middle">40</text>
  <text x="64" y="294" font-size="10" fill="#475569" text-anchor="end">1</text>
  <text x="64" y="150" font-size="10" fill="#475569" text-anchor="end">6</text>
  <text x="64" y="54" font-size="10" fill="#475569" text-anchor="end">11</text>

  <!-- Sigmoid LCST curve (rust): Q = Q_col + (Q_sw - Q_col) * phi(T) -->
  <path d="M70,270 Q95,260 120,245 Q145,215 170,170 Q190,120 220,85 Q245,60 270,55 L320,52"
        fill="none" stroke="#E2570F" stroke-width="2.8"/>

  <!-- LCST transition point at 32°C -->
  <line x1="195" y1="290" x2="195" y2="168" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 2"/>
  <circle cx="195" cy="168" r="4.5" fill="#1E40AF"/>
  <text x="195" y="308" font-size="10" fill="#334155" text-anchor="middle" font-weight="700">32°C</text>

  <!-- Labels -->
  <text x="105" y="265" font-size="10" fill="#1E40AF">swollen</text>
  <text x="280" y="60" font-size="10" fill="#1E40AF">collapsed</text>

  <!-- ===== Right plot: Sharpness (dQ/dT derivative peak) ===== -->
  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="420" y1="50" x2="420" y2="290"/>
    <line x1="470" y1="50" x2="470" y2="290"/>
    <line x1="520" y1="50" x2="520" y2="290"/>
    <line x1="420" y1="98" x2="590" y2="98"/>
    <line x1="420" y1="146" x2="590" y2="146"/>
    <line x1="420" y1="194" x2="590" y2="194"/>
    <line x1="420" y1="242" x2="590" y2="242"/>
  </g>
  <!-- axes -->
  <line x1="420" y1="50" x2="420" y2="290" stroke="#334155" stroke-width="1.6"/>
  <line x1="420" y1="290" x2="590" y2="290" stroke="#334155" stroke-width="1.6"/>
  <text x="500" y="322" font-size="12.5" fill="#334155" text-anchor="middle">temperature (°C)</text>
  <text x="380" y="170" font-size="12.5" fill="#334155" text-anchor="middle" transform="rotate(-90 380 170)">|dQ/dT|  (sharpness)</text>
  <text x="420" y="306" font-size="10" fill="#475569" text-anchor="middle">20</text>
  <text x="470" y="306" font-size="10" fill="#475569" text-anchor="middle">30</text>
  <text x="520" y="306" font-size="10" fill="#475569" text-anchor="middle">40</text>
  <text x="414" y="294" font-size="10" fill="#475569" text-anchor="end">0</text>
  <text x="414" y="150" font-size="10" fill="#475569" text-anchor="end">peak</text>

  <!-- dQ/dT bell curve centered at 32°C (rust) -->
  <path d="M420,270 Q435,268 450,255 Q465,225 480,165 Q495,105 505,65 Q520,110 535,165 Q550,225 565,255 Q580,268 590,270"
        fill="none" stroke="#E2570F" stroke-width="2.8"/>

  <!-- FWHM annotation -->
  <line x1="460" y1="168" x2="520" y2="168" stroke="#E2570F" stroke-width="2" stroke-dasharray="2 2"/>
  <polygon points="460,168 465,163 465,173" fill="#E2570F"/>
  <polygon points="520,168 515,163 515,173" fill="#E2570F"/>
  <text x="490" y="156" font-size="10" fill="#E2570F" text-anchor="middle" font-weight="700">FWHM</text>

  <!-- Peak marker -->
  <circle cx="495" cy="120" r="4.5" fill="#1E40AF"/>
  <text x="505" y="125" font-size="10" fill="#1E40AF">sharp switch</text>

  <!-- Annotations -->
  <text x="445" y="35" font-size="11" fill="#1E40AF" font-weight="700">Swollen state</text>
  <text x="510" y="35" font-size="11" fill="#1E40AF" font-weight="700">Collapsed state</text>
</svg>
