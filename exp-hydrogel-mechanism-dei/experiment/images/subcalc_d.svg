<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#334155">Swelling &#8594; modulus decay &#8594; tissue window</text>

  <!-- ===== Main plot: E (log scale) vs Q ===== -->
  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="50" x2="70" y2="290"/>
    <line x1="140" y1="50" x2="140" y2="290"/>
    <line x1="210" y1="50" x2="210" y2="290"/>
    <line x1="280" y1="50" x2="280" y2="290"/>
    <line x1="350" y1="50" x2="350" y2="290"/>
    <line x1="70" y1="74" x2="380" y2="74"/>
    <line x1="70" y1="122" x2="380" y2="122"/>
    <line x1="70" y1="170" x2="380" y2="170"/>
    <line x1="70" y1="218" x2="380" y2="218"/>
    <line x1="70" y1="266" x2="380" y2="266"/>
  </g>
  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="290" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="290" x2="380" y2="290" stroke="#334155" stroke-width="1.6"/>
  <text x="220" y="322" font-size="12.5" fill="#334155" text-anchor="middle">swelling ratio  Q</text>
  <text x="26" y="170" font-size="12.5" fill="#334155" text-anchor="middle" transform="rotate(-90 26 170)">Young&#8217;s modulus  E  (log scale, MPa)</text>
  <text x="70" y="306" font-size="10" fill="#475569" text-anchor="middle">2</text>
  <text x="210" y="306" font-size="10" fill="#475569" text-anchor="middle">5</text>
  <text x="350" y="306" font-size="10" fill="#475569" text-anchor="middle">15</text>
  <text x="64" y="54" font-size="10" fill="#475569" text-anchor="end">10</text>
  <text x="64" y="122" font-size="10" fill="#475569" text-anchor="end">1</text>
  <text x="64" y="218" font-size="10" fill="#475569" text-anchor="end">0.01</text>
  <text x="64" y="294" font-size="10" fill="#475569" text-anchor="end">0.001</text>

  <!-- G_swollen = G_dry * Q^(-1/3) decay curve (rust) -->
  <path d="M70,55 Q100,80 140,115 Q175,155 210,185 Q250,220 280,245 Q310,265 350,280 L380,289"
        fill="none" stroke="#E2570F" stroke-width="3"/>

  <!-- Tissue stiffness bands -->
  <!-- Brain band (lightest, 0.001-0.01) -->
  <rect x="70" y="260" width="310" height="15" fill="#1E40AF" opacity="0.08"/>
  <text x="75" y="273" font-size="9" fill="#1E40AF" font-weight="600">Brain  0.001&#8211;0.01 MPa</text>

  <!-- Muscle band (0.01-0.1) -->
  <rect x="70" y="240" width="310" height="18" fill="#1E40AF" opacity="0.12"/>
  <text x="75" y="253" font-size="9" fill="#1E40AF" font-weight="600">Muscle  0.01&#8211;0.1 MPa</text>

  <!-- Cartilage band (TARGET, 0.1-1) -->
  <rect x="70" y="210" width="310" height="28" fill="#E2570F" opacity="0.18"/>
  <text x="75" y="228" font-size="10" fill="#E2570F" font-weight="700">Cartilage  0.1&#8211;1 MPa  (TARGET)</text>

  <!-- Skin band (1-2) -->
  <rect x="70" y="195" width="310" height="13" fill="#1E40AF" opacity="0.12"/>
  <text x="75" y="205" font-size="9" fill="#1E40AF" font-weight="600">Skin  1&#8211;2 MPa</text>

  <!-- Design point on cartilage (Q ~ 5, E ~ 0.3 MPa) -->
  <circle cx="215" cy="195" r="5.5" fill="none" stroke="#1E40AF" stroke-width="2.5"/>
  <line x1="215" y1="200" x2="215" y2="215" stroke="#1E40AF" stroke-width="1.2"/>
  <text x="225" y="220" font-size="9.5" fill="#1E40AF" font-weight="700">design target</text>

  <!-- Formula annotation -->
  <text x="290" y="125" font-size="11" fill="#E2570F" font-weight="700">E = 3G &#10005; Q</text>
  <text x="310" y="138" font-size="10" fill="#E2570F">&#8211;1/3</text>

  <!-- Right legend -->
  <text x="420" y="85" font-size="11" fill="#334155" font-weight="700">Stiffness ladder</text>
  <line x1="420" y1="100" x2="590" y2="100" stroke="#334155" stroke-width="0.8"/>

  <rect x="420" y="108" width="12" height="12" fill="#1E40AF" opacity="0.08"/>
  <text x="438" y="118" font-size="9" fill="#1E40AF">Brain</text>

  <rect x="420" y="130" width="12" height="12" fill="#1E40AF" opacity="0.12"/>
  <text x="438" y="140" font-size="9" fill="#1E40AF">Muscle</text>

  <rect x="420" y="152" width="12" height="12" fill="#E2570F" opacity="0.18"/>
  <text x="438" y="162" font-size="9" fill="#E2570F" font-weight="600">Cartilage</text>

  <rect x="420" y="174" width="12" height="12" fill="#1E40AF" opacity="0.12"/>
  <text x="438" y="184" font-size="9" fill="#1E40AF">Skin</text>
</svg>
