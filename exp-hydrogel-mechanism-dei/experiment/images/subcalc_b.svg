<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#334155">pH-triggered ionisation &#8594; Donnan swelling</text>

  <!-- ===== Left plot: Ionisation (Henderson-Hasselbalch) ===== -->
  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="50" x2="70" y2="290"/>
    <line x1="120" y1="50" x2="120" y2="290"/>
    <line x1="170" y1="50" x2="170" y2="290"/>
    <line x1="220" y1="50" x2="220" y2="290"/>
    <line x1="270" y1="50" x2="270" y2="290"/>
    <line x1="320" y1="50" x2="320" y2="290"/>
    <line x1="70" y1="98" x2="370" y2="98"/>
    <line x1="70" y1="146" x2="370" y2="146"/>
    <line x1="70" y1="194" x2="370" y2="194"/>
    <line x1="70" y1="242" x2="370" y2="242"/>
  </g>
  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="290" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="290" x2="380" y2="290" stroke="#334155" stroke-width="1.6"/>
  <text x="220" y="322" font-size="12.5" fill="#334155" text-anchor="middle">pH</text>
  <text x="26" y="170" font-size="12.5" fill="#334155" text-anchor="middle" transform="rotate(-90 26 170)">ionisation fraction &#945;</text>
  <text x="70" y="306" font-size="10" fill="#475569" text-anchor="middle">1</text>
  <text x="170" y="306" font-size="10" fill="#475569" text-anchor="middle">4</text>
  <text x="270" y="306" font-size="10" fill="#475569" text-anchor="middle">7</text>
  <text x="64" y="294" font-size="10" fill="#475569" text-anchor="end">0</text>
  <text x="64" y="150" font-size="10" fill="#475569" text-anchor="end">0.5</text>
  <text x="64" y="54" font-size="10" fill="#475569" text-anchor="end">1.0</text>

  <!-- pKa = 4.3 curve (rust) -->
  <path d="M70,280 Q95,260 120,220 Q145,170 170,110 Q195,70 220,55 Q245,52 270,51 L320,50"
        fill="none" stroke="#E2570F" stroke-width="2.8"/>

  <!-- p50 marker at pH 4.3 -->
  <circle cx="170" cy="170" r="5" fill="none" stroke="#E2570F" stroke-width="2"/>
  <text x="175" y="165" font-size="10" fill="#E2570F" font-weight="700">p50</text>
  <text x="152" y="215" font-size="9.5" fill="#1E40AF">PMAA pKa 4.3</text>

  <!-- ===== Right plot: Donnan swelling Q vs pH ===== -->
  <!-- grid (right side) -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="420" y1="50" x2="420" y2="290"/>
    <line x1="470" y1="50" x2="470" y2="290"/>
    <line x1="520" y1="50" x2="520" y2="290"/>
    <line x1="420" y1="98" x2="590" y2="98"/>
    <line x1="420" y1="146" x2="590" y2="146"/>
    <line x1="420" y1="194" x2="590" y2="194"/>
    <line x1="420" y1="242" x2="590" y2="242"/>
  </g>
  <!-- axes -->
  <line x1="420" y1="50" x2="420" y2="290" stroke="#334155" stroke-width="1.6"/>
  <line x1="420" y1="290" x2="590" y2="290" stroke="#334155" stroke-width="1.6"/>
  <text x="500" y="322" font-size="12.5" fill="#334155" text-anchor="middle">pH</text>
  <text x="380" y="170" font-size="12.5" fill="#334155" text-anchor="middle" transform="rotate(-90 380 170)">swelling ratio  Q</text>
  <text x="420" y="306" font-size="10" fill="#475569" text-anchor="middle">1</text>
  <text x="470" y="306" font-size="10" fill="#475569" text-anchor="middle">4</text>
  <text x="520" y="306" font-size="10" fill="#475569" text-anchor="middle">7</text>
  <text x="414" y="294" font-size="10" fill="#475569" text-anchor="end">3</text>
  <text x="414" y="150" font-size="10" fill="#475569" text-anchor="end">12</text>
  <text x="414" y="54" font-size="10" fill="#475569" text-anchor="end">21</text>

  <!-- Donnan swelling curve (rust) for sealed to open states) -->
  <path d="M420,270 Q440,255 470,195 Q490,160 520,110 Q540,75 560,58 L590,50"
        fill="none" stroke="#E2570F" stroke-width="2.8"/>

  <!-- Q_0 flat baseline (sealed) -->
  <line x1="420" y1="275" x2="435" y2="275" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="413" y="280" font-size="9.5" fill="#334155">Q&#8321;</text>

  <!-- Opening fraction marker at pH 4.3 -->
  <circle cx="470" cy="195" r="5" fill="none" stroke="#E2570F" stroke-width="2"/>
  <text x="475" y="190" font-size="10" fill="#E2570F" font-weight="700">50%</text>

  <!-- Rupture risk zone (high Q) -->
  <rect x="535" y="50" width="55" height="20" fill="#E2570F" opacity="0.1"/>
  <text x="562" y="68" font-size="9" fill="#E2570F" font-weight="700">rupture</text>

  <!-- annotations -->
  <text x="270" y="35" font-size="11" fill="#1E40AF" font-weight="700">Sealed (pH 1)</text>
  <text x="495" y="35" font-size="11" fill="#1E40AF" font-weight="700">Open (pH 8)</text>
</svg>
