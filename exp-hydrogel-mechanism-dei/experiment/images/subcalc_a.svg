<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="24" y="30" font-size="17" font-weight="700" fill="#334155">Flory&#8211;Rehner swelling &#8594; bilayer fold</text>

  <!-- ===== Left plot: Q vs chi ===== -->
  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="50" x2="70" y2="290"/>
    <line x1="130" y1="50" x2="130" y2="290"/>
    <line x1="190" y1="50" x2="190" y2="290"/>
    <line x1="250" y1="50" x2="250" y2="290"/>
    <line x1="310" y1="50" x2="310" y2="290"/>
    <line x1="70" y1="98" x2="370" y2="98"/>
    <line x1="70" y1="146" x2="370" y2="146"/>
    <line x1="70" y1="194" x2="370" y2="194"/>
    <line x1="70" y1="242" x2="370" y2="242"/>
  </g>
  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="290" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="290" x2="380" y2="290" stroke="#334155" stroke-width="1.6"/>
  <text x="220" y="322" font-size="12.5" fill="#334155" text-anchor="middle">solvent affinity  &#967;  (lower = loves water)</text>
  <text x="26" y="170" font-size="12.5" fill="#334155" text-anchor="middle" transform="rotate(-90 26 170)">swelling ratio  Q</text>
  <text x="70" y="306" font-size="10" fill="#475569" text-anchor="middle">0.35</text>
  <text x="190" y="306" font-size="10" fill="#475569" text-anchor="middle">0.45</text>
  <text x="310" y="306" font-size="10" fill="#475569" text-anchor="middle">0.55</text>
  <text x="64" y="294" font-size="10" fill="#475569" text-anchor="end">0</text>
  <text x="64" y="150" font-size="10" fill="#475569" text-anchor="end">15</text>
  <text x="64" y="54" font-size="10" fill="#475569" text-anchor="end">30</text>

  <!-- swelling curve (rust) -->
  <path d="M70,50 C100,80 112,95 130,104 C155,140 172,168 190,180 C208,196 218,206 226,211 C260,232 290,246 310,249 L370,261"
        fill="none" stroke="#E2570F" stroke-width="2.8"/>

  <!-- material markers -->
  <g fill="#1E40AF">
    <circle cx="130" cy="104" r="4.5"/><circle cx="190" cy="180" r="4.5"/>
    <circle cx="226" cy="211" r="4.5"/><circle cx="310" cy="249" r="4.5"/>
  </g>
  <text x="136" y="98" font-size="9.5" fill="#1E40AF">Alginate 0.40</text>
  <text x="196" y="176" font-size="9.5" fill="#1E40AF">PEG-DA 0.45</text>
  <text x="232" y="207" font-size="9.5" fill="#1E40AF">PNIPAM 0.48</text>
  <text x="250" y="252" font-size="9.5" fill="#1E40AF">pHEMA 0.55</text>
  <text x="150" y="70" font-size="10" fill="#E2570F" font-style="italic">Q = 1/v&#8339;</text>

  <!-- ===== Right: bilayer fold glyph ===== -->
  <text x="500" y="66" font-size="12.5" fill="#334155" text-anchor="middle">&#952;&#8202;&#8776; 90&#176;&#183;(Q&#185;&#8321;&#8323; &#8722; 1)</text>

  <!-- flat printed strip (dry) -->
  <rect x="430" y="96" width="140" height="16" rx="3" fill="#cbd5e1"/>
  <text x="500" y="128" font-size="10.5" fill="#475569" text-anchor="middle">flat, dry (Q &#8776; 1)</text>

  <!-- arrow down -->
  <line x1="500" y1="140" x2="500" y2="172" stroke="#334155" stroke-width="1.4"/>
  <polygon points="500,178 495,168 505,168" fill="#334155"/>
  <text x="512" y="160" font-size="9.5" fill="#334155">swell</text>

  <!-- curled strip (swollen) -->
  <path d="M440,300 A80,80 0 0 1 520,220" fill="none" stroke="#1E40AF" stroke-width="15" stroke-linecap="round"/>
  <!-- fold-angle arc -->
  <path d="M440,300 A80,80 0 0 1 470,238" fill="none" stroke="#E2570F" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="470" y="298" font-size="10.5" fill="#1E40AF" text-anchor="middle">folds shut</text>
  <text x="500" y="240" font-size="11" fill="#E2570F" font-weight="700">&#952;</text>
</svg>
