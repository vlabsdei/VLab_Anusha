<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc E: Actuation Speed Comparison</text>

  <!-- log bar chart -->
  <text x="320" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Response time (log scale)</text>
  <line x1="120" y1="90" x2="120" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="200" x2="600" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="120" y="100" width="70" height="24" fill="#2563eb"/><text x="200" y="117" fill="#1e293b" font-size="11" font-weight="700">Magnetic ~12 ms</text>
  <rect x="120" y="135" width="300" height="24" fill="#9333ea"/><text x="430" y="152" fill="#1e293b" font-size="11" font-weight="700">Photo ~85 s</text>
  <rect x="120" y="170" width="430" height="24" fill="#b91c1c"/><text x="120" y="217" fill="#475569" font-size="9">log10 seconds &#8594;</text>
  <text x="560" y="187" fill="#1e293b" font-size="11" font-weight="700">Thermal ~8 min</text>
  <text x="300" y="240" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">magnetic 7000x faster than photo, 40000x faster than thermal</text>

  <!-- equation + mapping panel -->
  <rect x="20" y="252" width="600" height="168" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="280" fill="#8A1134" font-size="14" font-weight="700">Governing relations &amp; application mapping</text>
  <text x="36" y="306" fill="#1e293b" font-size="13" font-weight="700">t_mag &#8776; &#951;/(M_s B) [ms]   t_photo &#8776; 1/(&#934; I &#963;) [s]   t_thermal = &#964; [min]</text>
  <rect x="36" y="320" width="180" height="44" rx="6" fill="#2563eb"/><text x="126" y="340" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Magnetic (ms)</text><text x="126" y="356" fill="#fff" font-size="10" text-anchor="middle">surgical robots</text>
  <rect x="230" y="320" width="180" height="44" rx="6" fill="#9333ea"/><text x="320" y="340" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Photo (s)</text><text x="320" y="356" fill="#fff" font-size="10" text-anchor="middle">microfluidics</text>
  <rect x="424" y="320" width="180" height="44" rx="6" fill="#b91c1c"/><text x="514" y="340" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Thermal (min)</text><text x="514" y="356" fill="#fff" font-size="10" text-anchor="middle">implants</text>
  <text x="36" y="392" fill="#0f766e" font-size="12" font-weight="700">The single most useful design-decision guide: match stimulus speed to the application.</text>
  <text x="36" y="412" fill="#475569" font-size="11" font-weight="700">Magnetic = fastest, photo = intermediate, thermal = slowest.</text>
</svg>
