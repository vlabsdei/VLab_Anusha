<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Wireless coil power vs implant depth: 1/r³ falloff</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="79" x2="560" y2="79"/>
    <line x1="70" y1="130" x2="560" y2="130"/>
    <line x1="70" y1="181" x2="560" y2="181"/>
    <line x1="70" y1="232" x2="560" y2="232"/>
    <line x1="70" y1="283" x2="560" y2="283"/>
    <line x1="192" y1="40" x2="192" y2="300"/>
    <line x1="315" y1="40" x2="315" y2="300"/>
    <line x1="437" y1="40" x2="437" y2="300"/>
  </g>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="560" y2="300" stroke="#334155" stroke-width="1.6"/>
  <polygon points="70,34 66,44 74,44" fill="#334155"/>
  <polygon points="566,300 556,296 556,304" fill="#334155"/>

  <!-- wireless power budget limit at 300 W -->
  <line x1="70" y1="101" x2="350" y2="101" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="80" y="95" font-size="11" fill="#dc2626" font-weight="bold">P<sub>wireless</sub> budget = 300 W</text>

  <!-- crossover depth -->
  <line x1="350" y1="101" x2="350" y2="300" stroke="#E2570F" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="355" y="292" font-size="11" fill="#E2570F" font-weight="bold">crossover depth</text>

  <!-- coil power curve: strong 1/r³ scaling -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.8"
    points="70,298 120,295 170,282 220,252 270,213 320,167 350,101 380,67 410,45 437,32 480,20 520,12 560,6"/>

  <!-- marker at crossover -->
  <circle cx="350" cy="101" r="5.5" fill="#E2570F" stroke="#ffffff" stroke-width="1.6"/>

  <!-- axis labels -->
  <text x="315" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Implant depth r (cm)</text>
  <text x="24" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155" transform="rotate(-90 24 170)">Coil power P (W)</text>

  <!-- y-axis tick labels (log scale appearance) -->
  <text x="64" y="304" text-anchor="end" font-size="10" fill="#475569">1</text>
  <text x="64" y="253" text-anchor="end" font-size="10" fill="#475569">10</text>
  <text x="64" y="152" text-anchor="end" font-size="10" fill="#475569">100</text>
  <text x="64" y="83" text-anchor="end" font-size="10" fill="#475569">300+</text>

  <!-- x-axis tick labels -->
  <text x="70" y="320" font-size="10" fill="#475569">0</text>
  <text x="192" y="320" font-size="10" fill="#475569">2</text>
  <text x="315" y="320" font-size="10" fill="#475569">4</text>
  <text x="437" y="320" font-size="10" fill="#475569">6</text>

  <!-- coil schematic (small diagram upper right) -->
  <circle cx="490" cy="70" r="15" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="490" cy="70" r="12" fill="none" stroke="#334155" stroke-width="1.2"/>
  <line x1="505" y1="70" x2="520" y2="70" stroke="#334155" stroke-width="1.5"/>
  <text x="520" y="75" font-size="10" fill="#334155">n turns</text>

  <!-- annotations -->
  <text x="380" y="150" font-size="11" fill="#1E40AF" font-weight="bold">B &#8733; 1/r&#179;</text>
  <text x="380" y="166" font-size="10.5" fill="#475569">I<sub>req</sub> ∝ r³, P = I² R ∝ r⁶</text>
  <text x="380" y="182" font-size="10.5" fill="#475569">Beyond crossover: on-board battery wins</text>
</svg>
