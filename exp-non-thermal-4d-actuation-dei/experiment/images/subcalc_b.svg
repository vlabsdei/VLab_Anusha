<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc B: NIR Photothermal Heating</text>

  <!-- laser + hot spot -->
  <text x="150" y="74" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">NIR laser heats nanoparticle spot</text>
  <line x1="150" y1="82" x2="150" y2="150" stroke="#b91c1c" stroke-width="4"/>
  <polygon points="142,150 158,150 150,165" fill="#b91c1c"/>
  <rect x="55" y="165" width="190" height="55" rx="6" fill="#cbd5e1" stroke="#94a3b8"/>
  <radialGradient id="hot6" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4500"/><stop offset="100%" stop-color="#cbd5e1"/></radialGradient>
  <ellipse cx="150" cy="192" rx="48" ry="20" fill="url(#hot6)"/>
  <text x="150" y="196" fill="#7f1d1d" font-size="10" font-weight="700" text-anchor="middle">heated zone d</text>
  <text x="55" y="240" fill="#64748b" font-size="10">d = thermal blur grows with exposure time</text>

  <!-- d vs power -->
  <text x="470" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">resolution d vs power</text>
  <line x1="360" y1="84" x2="360" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="360" y1="210" x2="618" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="349" y="94" fill="#475569" font-size="10" text-anchor="end">d</text>
  <text x="618" y="227" fill="#475569" font-size="10" text-anchor="end">P</text>
  <rect x="360" y="175" width="258" height="35" fill="#d1fae5" opacity="0.6"/>
  <text x="364" y="190" fill="#047857" font-size="8" font-weight="700">localised d &lt; 0.5 mm</text>
  <path d="M368 92 Q420 150 500 178 Q560 195 614 200" fill="none" stroke="#8A1134" stroke-width="2.5"/>
  <text x="430" y="120" fill="#475569" font-size="9">higher power &#8594; faster &#8594; smaller blur</text>

  <!-- equation panel -->
  <rect x="20" y="252" width="600" height="168" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="280" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="310" fill="#1e293b" font-size="14" font-weight="700">dT/dt = &#951;_abs I&#8320; A_particle / (m C_p)</text>
  <text x="36" y="338" fill="#1e293b" font-size="14" font-weight="700">&#916;T = &#951;_abs P / (h_conv A_surface)</text>
  <text x="36" y="366" fill="#1e293b" font-size="15" font-weight="700">d = 2&#8730;(D_th t_exp)  (spatial resolution / thermal blur)</text>
  <text x="36" y="392" fill="#0f766e" font-size="12" font-weight="700">Trade-off: more power heats faster &#8594; shorter exposure &#8594; sharper (smaller d).</text>
  <text x="36" y="412" fill="#475569" font-size="11" font-weight="700">NIR (808 nm) penetrates tissue; find min power for localised (d &lt; 0.5 mm) SMP activation.</text>
</svg>
