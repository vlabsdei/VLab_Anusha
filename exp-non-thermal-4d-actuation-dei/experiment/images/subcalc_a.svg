<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Photoswitching kinetics: cis fraction &amp; bend vs time</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="79" x2="560" y2="79"/>
    <line x1="70" y1="144" x2="560" y2="144"/>
    <line x1="70" y1="209" x2="560" y2="209"/>
    <line x1="70" y1="274" x2="560" y2="274"/>
    <line x1="192" y1="40" x2="192" y2="300"/>
    <line x1="315" y1="40" x2="315" y2="300"/>
    <line x1="437" y1="40" x2="437" y2="300"/>
  </g>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="560" y2="300" stroke="#334155" stroke-width="1.6"/>
  <polygon points="70,34 66,44 74,44" fill="#334155"/>
  <polygon points="566,300 556,296 556,304" fill="#334155"/>

  <!-- PSS asymptote -->
  <line x1="70" y1="79" x2="560" y2="79" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="556" y="73" text-anchor="end" font-size="11" fill="#475569">[cis]&#8339;&#8347;&#8347; = 0.85  (&#952; &#8776; 70&#176;)</text>

  <!-- 90% line -->
  <line x1="70" y1="101" x2="315" y2="101" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="80" y="96" font-size="11" fill="#16a34a" font-weight="bold">90% of full bend</text>

  <!-- t90 vertical -->
  <line x1="315" y1="101" x2="315" y2="300" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="322" y="292" font-size="11" fill="#dc2626" font-weight="bold">t&#8320; = ln(10)/k</text>

  <!-- curve -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.8"
    points="70,300 119,218.6 168,167 217,134.4 266,114 315,101.1 364,93 413,87.8 462,84.5 511,82.5 560,81.2"/>

  <!-- tracker dot -->
  <circle cx="315" cy="101.1" r="5.5" fill="#E2570F" stroke="#ffffff" stroke-width="1.6"/>

  <!-- axis labels -->
  <text x="315" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Time under the light (s)</text>
  <text x="24" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155" transform="rotate(-90 24 170)">cis fraction  /  bend angle</text>

  <!-- y ticks -->
  <text x="64" y="304" text-anchor="end" font-size="10" fill="#475569">0</text>
  <text x="64" y="213" text-anchor="end" font-size="10" fill="#475569">0.5</text>
  <text x="64" y="83" text-anchor="end" font-size="10" fill="#475569">0.85</text>

  <!-- note -->
  <text x="380" y="150" font-size="11" fill="#1E40AF" font-weight="bold">[cis](t) = [cis]&#8339;&#8347;&#8347;(1 &#8722; e&#8315;&#7503;&#7511;)</text>
  <text x="380" y="166" font-size="10.5" fill="#475569">brighter light &#8594; larger k &#8594; smaller t&#8320;</text>
</svg>
