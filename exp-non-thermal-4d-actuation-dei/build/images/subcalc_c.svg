<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc C: Magnetic Torque on Embedded Particles</text>

  <!-- deflecting beam -->
  <text x="150" y="74" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Magnetic composite beam in field B</text>
  <rect x="60" y="200" width="60" height="20" fill="#475569"/>
  <path d="M120 210 q60 -10 95 -70" fill="none" stroke="#8A1134" stroke-width="14" stroke-linecap="round"/>
  <g fill="#2563eb"><circle cx="135" cy="205" r="3"/><circle cx="160" cy="190" r="3"/><circle cx="185" cy="165" r="3"/><circle cx="205" cy="145" r="3"/></g>
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <path d="M250 110 h45" marker-end="url(#arC6)"/><path d="M250 150 h45" marker-end="url(#arC6)"/><path d="M250 190 h45" marker-end="url(#arC6)"/>
  </g>
  <defs><marker id="arC6" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker></defs>
  <text x="272" y="100" fill="#2563eb" font-size="10" font-weight="700" text-anchor="middle">B</text>
  <text x="150" y="245" fill="#8A1134" font-size="10" font-weight="700">deflection &#948;, angle &#952;</text>

  <!-- B_crit vs vol% -->
  <text x="490" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">B_crit vs volume fraction</text>
  <line x1="390" y1="84" x2="390" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="390" y1="210" x2="618" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="379" y="94" fill="#475569" font-size="10" text-anchor="end">B_c</text>
  <text x="618" y="227" fill="#475569" font-size="10" text-anchor="end">vol%</text>
  <path d="M398 92 Q440 165 510 188 Q560 200 612 204" fill="none" stroke="#9333ea" stroke-width="2.5"/>
  <text x="460" y="120" fill="#9333ea" font-size="9" font-weight="700">B_crit &#8733; 1/(vol fraction)</text>

  <!-- equation panel -->
  <rect x="20" y="252" width="600" height="168" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="280" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="310" fill="#1e293b" font-size="15" font-weight="700">&#964; = m B sin(&#952;),   m = M_s V_particle</text>
  <text x="36" y="338" fill="#1e293b" font-size="15" font-weight="700">&#948; = &#964; L&#178; / (2 E I)</text>
  <text x="36" y="366" fill="#1e293b" font-size="14" font-weight="700">B_crit = E I &#960; / (4 M_s V L&#178;)  &#8733; 1/(volume fraction)</text>
  <text x="36" y="392" fill="#0f766e" font-size="12" font-weight="700">A more highly loaded composite bends in a weaker field.</text>
  <text x="36" y="412" fill="#b91c1c" font-size="11" font-weight="700">Large particles agglomerate &#8594; superparamagnetic (&lt;20 nm) preferred.</text>
</svg>
