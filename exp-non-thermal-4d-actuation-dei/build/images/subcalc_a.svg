<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc A: Azobenzene Photoisomerisation</text>

  <!-- trans -> cis -->
  <text x="110" y="74" fill="#b45309" font-size="12" font-weight="700" text-anchor="middle">trans (extended)</text>
  <line x1="55" y1="120" x2="165" y2="120" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <circle cx="55" cy="120" r="9" fill="#b45309"/><circle cx="165" cy="120" r="9" fill="#b45309"/>
  <path d="M185 120 h44" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arA6)"/>
  <text x="207" y="110" fill="#8b5cf6" font-size="10" font-weight="700" text-anchor="middle">365 nm</text>
  <defs><marker id="arA6" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b5cf6"/></marker></defs>
  <text x="300" y="74" fill="#7f1d1d" font-size="12" font-weight="700" text-anchor="middle">cis (bent, smaller)</text>
  <path d="M255 145 L290 110 L325 145" fill="none" stroke="#b91c1c" stroke-width="10" stroke-linecap="round"/>
  <circle cx="255" cy="145" r="9" fill="#7f1d1d"/><circle cx="325" cy="145" r="9" fill="#7f1d1d"/>
  <path d="M290 165 q-40 25 -90 0" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arA6b)"/>
  <defs><marker id="arA6b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#3b82f6"/></marker></defs>
  <text x="248" y="195" fill="#3b82f6" font-size="10" font-weight="700">450 nm (reverse)</text>

  <!-- t90 vs intensity -->
  <text x="500" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">t90 vs intensity</text>
  <line x1="400" y1="84" x2="400" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="400" y1="210" x2="618" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="389" y="94" fill="#475569" font-size="10" text-anchor="end">t90</text>
  <text x="618" y="227" fill="#475569" font-size="10" text-anchor="end">I&#8320;</text>
  <path d="M408 92 Q450 165 510 188 Q560 200 612 205" fill="none" stroke="#9333ea" stroke-width="2.5"/>
  <text x="470" y="120" fill="#9333ea" font-size="9" font-weight="700">t90 &#8733; 1/I</text>

  <!-- equation panel -->
  <rect x="20" y="252" width="600" height="168" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="280" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="310" fill="#1e293b" font-size="15" font-weight="700">Beer-Lambert:  I(x) = I&#8320; e^(&#8722;&#949; C x)</text>
  <text x="36" y="338" fill="#1e293b" font-size="14" font-weight="700">Rate:  d[cis]/dt = &#934; I_abs / (N_A h&#957;),  &#934; &#8776; 0.20</text>
  <text x="36" y="366" fill="#1e293b" font-size="15" font-weight="700">Volume contraction:  &#916;V/V = &#946;_photo [cis]</text>
  <text x="36" y="392" fill="#0f766e" font-size="12" font-weight="700">t90 = ln(10)/(k I): doubling intensity halves the conversion time.</text>
  <text x="36" y="412" fill="#b91c1c" font-size="11" font-weight="700">Beer-Lambert ignores scattering &#8212; real composites penetrate 2&#8211;5x less.</text>
</svg>
