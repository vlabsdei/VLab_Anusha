<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Non-Thermal 4D Actuation: Light &amp; Magnetic Control</text>
  <defs>
    <marker id="aV" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#7c3aed"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="aG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
  </defs>

  <!-- central actuator -->
  <path d="M280 165 L320 165 L356 130" stroke="#8A1134" stroke-width="10" stroke-linecap="round" fill="none"/>
  <circle cx="320" cy="165" r="7" fill="#8A1134"/>
  <text x="320" y="192" fill="#8A1134" font-size="11" font-weight="700" text-anchor="middle">soft 4D actuator</text>

  <!-- light source (UV/Vis) -->
  <circle cx="86" cy="92" r="18" fill="#7c3aed"/><circle cx="86" cy="92" r="9" fill="#ddd6fe"/>
  <text x="86" y="128" fill="#7c3aed" font-size="11" font-weight="700" text-anchor="middle">UV / Vis light</text>
  <path d="M104 100 L268 158" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aV)"/>
  <text x="150" y="135" fill="#7c3aed" font-size="9" font-weight="700">azobenzene</text>

  <!-- NIR laser -->
  <rect x="300" y="60" width="40" height="18" rx="4" fill="#dc2626"/>
  <text x="320" y="98" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">NIR laser (808 nm)</text>
  <path d="M320 80 L320 122" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aR)"/>

  <!-- magnet -->
  <rect x="540" y="78" width="24" height="14" fill="#dc2626"/><rect x="540" y="92" width="24" height="14" fill="#1e40af"/>
  <text x="552" y="128" fill="#16a34a" font-size="11" font-weight="700" text-anchor="middle">magnetic field</text>
  <path d="M538 100 L372 158" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#aG)"/>
  <text x="470" y="135" fill="#16a34a" font-size="9" font-weight="700">embedded particles</text>

  <text x="320" y="216" fill="#475569" font-size="11" font-weight="700" text-anchor="middle">Remote, spatially-precise, biocompatible actuation - no bulk heating required</text>

  <!-- five sub-calc pipeline -->
  <text x="320" y="244" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Five governing principles (Sub-Calc A-E)</text>
  <g>
    <rect x="21" y="254" width="110" height="138" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="21" y="254" width="6" height="138" rx="3" fill="#8A1134"/>
    <text x="39" y="278" fill="#8A1134" font-size="13" font-weight="700">A</text><text x="39" y="298" fill="#1e293b" font-size="10" font-weight="700">Azobenzene</text><text x="39" y="316" fill="#475569" font-size="9">trans &#8596; cis</text><text x="39" y="330" fill="#475569" font-size="9">Beer-Lambert</text>
    <rect x="143" y="254" width="110" height="138" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="143" y="254" width="6" height="138" rx="3" fill="#2563eb"/>
    <text x="161" y="278" fill="#2563eb" font-size="13" font-weight="700">B</text><text x="161" y="298" fill="#1e293b" font-size="10" font-weight="700">NIR thermal</text><text x="161" y="316" fill="#475569" font-size="9">&#916;T, blur d</text><text x="161" y="330" fill="#475569" font-size="9">localisation</text>
    <rect x="265" y="254" width="110" height="138" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="265" y="254" width="6" height="138" rx="3" fill="#7c3aed"/>
    <text x="283" y="278" fill="#7c3aed" font-size="13" font-weight="700">C</text><text x="283" y="298" fill="#1e293b" font-size="10" font-weight="700">Magnetic</text><text x="283" y="316" fill="#475569" font-size="9">&#964; = mB sin&#952;</text><text x="283" y="330" fill="#475569" font-size="9">B_crit ~ 1/&#966;</text>
    <rect x="387" y="254" width="110" height="138" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="387" y="254" width="6" height="138" rx="3" fill="#16a34a"/>
    <text x="405" y="278" fill="#16a34a" font-size="13" font-weight="700">D</text><text x="405" y="298" fill="#1e293b" font-size="10" font-weight="700">Coil design</text><text x="405" y="316" fill="#475569" font-size="9">wireless B</text><text x="405" y="330" fill="#475569" font-size="9">power budget</text>
    <rect x="509" y="254" width="110" height="138" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="509" y="254" width="6" height="138" rx="3" fill="#b45309"/>
    <text x="527" y="278" fill="#b45309" font-size="13" font-weight="700">E</text><text x="527" y="298" fill="#1e293b" font-size="10" font-weight="700">Speed</text><text x="527" y="316" fill="#475569" font-size="9">ms / s / min</text><text x="527" y="330" fill="#475569" font-size="9">application map</text>
  </g>
  <text x="320" y="414" fill="#475569" font-size="11" text-anchor="middle" font-style="italic">Magnetic &#8594; surgical robots (ms); photo &#8594; microfluidics (s); thermal &#8594; implants (min).</text>
  <text x="320" y="432" fill="#94a3b8" font-size="10" text-anchor="middle">Couples optics, materials science and electrical engineering into one actuation toolkit.</text>
</svg>
