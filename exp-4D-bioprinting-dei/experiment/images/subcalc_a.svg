<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#ffffff}
      .axis{stroke:#334155;stroke-width:2;fill:none}
      .grid{stroke:#E2E8F0;stroke-width:1}
      .curve{stroke:#1E40AF;stroke-width:2.5;fill:none;stroke-linejoin:round}
      .win{fill:#E2570F;opacity:0.10}
      .winedge{stroke:#E2570F;stroke-width:1.2;stroke-dasharray:5 4;fill:none;opacity:0.7}
      .dot{fill:#1E40AF}
      .dotout{fill:#ffffff;stroke:#E2570F;stroke-width:2}
      .t-title{font-family:Arial,sans-serif;font-size:16px;font-weight:bold;fill:#334155}
      .t-ax{font-family:Arial,sans-serif;font-size:13px;fill:#334155}
      .t-tick{font-family:Arial,sans-serif;font-size:11px;fill:#334155}
      .t-note{font-family:Arial,sans-serif;font-size:11px;fill:#334155}
      .t-win{font-family:Arial,sans-serif;font-size:11px;font-weight:bold;fill:#E2570F}
      .t-noz{font-family:Arial,sans-serif;font-size:11px;font-weight:bold;fill:#1E40AF}
    </style>
  </defs>
  <rect class="bg" width="640" height="400"/>
  <text class="t-title" x="320" y="28" text-anchor="middle">Power-Law Bioink Viscosity and Printability Window</text>

  <!-- printable band 1 to 100 Pa·s -->
  <rect class="win" x="72" y="124.5" width="536" height="137"/>
  <line class="winedge" x1="72" y1="124.5" x2="608" y2="124.5"/>
  <line class="winedge" x1="72" y1="261.5" x2="608" y2="261.5"/>
  <text class="t-win" x="600" y="140" text-anchor="end">printable window  1 to 100 Pa·s</text>

  <!-- gridlines -->
  <line class="grid" x1="250.7" y1="56" x2="250.7" y2="330"/>
  <line class="grid" x1="429.3" y1="56" x2="429.3" y2="330"/>
  <line class="grid" x1="72" y1="193" x2="608" y2="193"/>

  <!-- axes -->
  <line class="axis" x1="72" y1="330" x2="608" y2="330"/>
  <line class="axis" x1="72" y1="56" x2="72" y2="330"/>

  <!-- x ticks (log decades) -->
  <g>
    <line class="axis" x1="72" y1="330" x2="72" y2="336"/><text class="t-tick" x="72" y="350" text-anchor="middle">1</text>
    <line class="axis" x1="250.7" y1="330" x2="250.7" y2="336"/><text class="t-tick" x="250.7" y="350" text-anchor="middle">10</text>
    <line class="axis" x1="429.3" y1="330" x2="429.3" y2="336"/><text class="t-tick" x="429.3" y="350" text-anchor="middle">100</text>
    <line class="axis" x1="608" y1="330" x2="608" y2="336"/><text class="t-tick" x="608" y="350" text-anchor="middle">1000</text>
  </g>
  <!-- y ticks (log decades) -->
  <g>
    <line class="axis" x1="66" y1="330" x2="72" y2="330"/><text class="t-tick" x="60" y="334" text-anchor="end">0.1</text>
    <line class="axis" x1="66" y1="261.5" x2="72" y2="261.5"/><text class="t-tick" x="60" y="265.5" text-anchor="end">1</text>
    <line class="axis" x1="66" y1="193" x2="72" y2="193"/><text class="t-tick" x="60" y="197" text-anchor="end">10</text>
    <line class="axis" x1="66" y1="124.5" x2="72" y2="124.5"/><text class="t-tick" x="60" y="128.5" text-anchor="end">100</text>
    <line class="axis" x1="66" y1="56" x2="72" y2="56"/><text class="t-tick" x="60" y="60" text-anchor="end">1000</text>
  </g>

  <!-- power-law line, slope n-1 = -0.6 (n=0.4) -->
  <polyline class="curve" points="72.0,56.0 101.8,62.9 131.6,69.7 161.3,76.5 191.1,83.4 220.9,90.2 250.7,97.1 280.4,104.0 310.2,110.8 340.0,117.6 369.8,124.5 399.6,131.3 429.3,138.2 459.1,145.0 488.9,151.9 518.7,158.8 548.4,165.6 578.2,172.4 608.0,179.3"/>

  <!-- nozzle operating points -->
  <circle class="dotout" cx="304.5" cy="109.5" r="4.5"/>
  <text class="t-win" x="304.5" y="102" text-anchor="middle">610 µm (under-extrudes)</text>
  <circle class="dot" cx="429.3" cy="138.2" r="4.5"/>
  <text class="t-noz" x="429.3" y="131" text-anchor="middle">400 µm</text>
  <circle class="dot" cx="554.2" cy="166.9" r="4.5"/>
  <text class="t-noz" x="554.2" y="159" text-anchor="middle">200 µm</text>

  <!-- axis captions -->
  <text class="t-ax" x="340" y="374" text-anchor="middle">Wall shear rate γ̇ = 4v/R  (s⁻¹, log scale)</text>
  <text class="t-ax" x="22" y="193" text-anchor="middle" transform="rotate(-90 22 193)">Viscosity η  (Pa·s, log scale)</text>

  <!-- equation note -->
  <text class="t-note" x="80" y="72">η(γ̇) = K·γ̇ⁿ⁻¹,  n &lt; 1  (slope n−1)</text>
</svg>
