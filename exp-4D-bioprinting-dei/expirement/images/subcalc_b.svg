<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis-line { stroke: #334155; stroke-width: 2; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; }
      .curve { stroke: #1E40AF; stroke-width: 2.5; fill: none; }
      .highlight { stroke: #E2570F; stroke-width: 2; }
      .axis-label { font-family: Arial, sans-serif; font-size: 12px; fill: #334155; }
      .title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #334155; }
      .tick-label { font-family: Arial, sans-serif; font-size: 10px; fill: #334155; }
      .marker { stroke: #E2570F; stroke-width: 2.5; fill: #E2570F; }
      .marker-label { font-family: Arial, sans-serif; font-size: 11px; fill: #E2570F; font-weight: bold; }
      .dashed { stroke-dasharray: 3,2; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" class="title" text-anchor="middle">Avrami Gelation Kinetics: Conversion &amp; Storage Modulus</text>

  <!-- Axes -->
  <line x1="70" y1="290" x2="570" y2="290" class="axis-line"/>
  <line x1="70" y1="50" x2="70" y2="290" class="axis-line"/>

  <!-- Grid lines -->
  <line x1="100" y1="290" x2="100" y2="50" class="grid-line"/>
  <line x1="160" y1="290" x2="160" y2="50" class="grid-line"/>
  <line x1="220" y1="290" x2="220" y2="50" class="grid-line"/>
  <line x1="280" y1="290" x2="280" y2="50" class="grid-line"/>
  <line x1="340" y1="290" x2="340" y2="50" class="grid-line"/>
  <line x1="400" y1="290" x2="400" y2="50" class="grid-line"/>
  <line x1="460" y1="290" x2="460" y2="50" class="grid-line"/>
  <line x1="520" y1="290" x2="520" y2="50" class="grid-line"/>

  <line x1="70" y1="240" x2="570" y2="240" class="grid-line"/>
  <line x1="70" y1="190" x2="570" y2="190" class="grid-line"/>
  <line x1="70" y1="140" x2="570" y2="140" class="grid-line"/>
  <line x1="70" y1="90" x2="570" y2="90" class="grid-line"/>

  <!-- Sigmoidal Avrami conversion curve α(t) -->
  <path d="M 70 270 Q 150 250, 200 180 Q 250 110, 350 85 Q 450 75, 570 70" class="curve"/>

  <!-- Gel point line at α = 0.5 (50% conversion) -->
  <line x1="70" y1="170" x2="570" y2="170" class="highlight dashed" stroke-width="1.5"/>
  <text x="55" y="173" class="tick-label" text-anchor="end" fill="#E2570F">α = 0.5</text>

  <!-- Vertical line at gel point -->
  <circle cx="235" cy="170" r="3" class="marker"/>
  <line x1="235" y1="170" x2="235" y2="290" class="highlight dashed" stroke-width="1.5"/>
  <text x="235" y="315" class="marker-label" text-anchor="middle">t_gel</text>

  <!-- Storage modulus axis label (right side) -->
  <text x="600" y="130" class="tick-label" fill="#1E40AF" font-weight="bold">G' ↑</text>

  <!-- Axis labels -->
  <text x="320" y="330" class="axis-label" text-anchor="middle">Time t (min)</text>
  <text x="25" y="170" class="axis-label" text-anchor="middle" transform="rotate(-90 25 170)">Conversion α (-)</text>

  <!-- Tick marks -->
  <line x1="65" y1="290" x2="75" y2="290" class="axis-line"/>
  <line x1="65" y1="240" x2="75" y2="240" class="axis-line"/>
  <line x1="65" y1="190" x2="75" y2="190" class="axis-line"/>
  <line x1="65" y1="140" x2="75" y2="140" class="axis-line"/>
  <line x1="65" y1="90" x2="75" y2="90" class="axis-line"/>

  <line x1="70" y1="295" x2="70" y2="305" class="axis-line"/>
  <line x1="160" y1="295" x2="160" y2="305" class="axis-line"/>
  <line x1="250" y1="295" x2="250" y2="305" class="axis-line"/>
  <line x1="340" y1="295" x2="340" y2="305" class="axis-line"/>
  <line x1="430" y1="295" x2="430" y2="305" class="axis-line"/>
  <line x1="520" y1="295" x2="520" y2="305" class="axis-line"/>

  <!-- Axis tick labels -->
  <text x="70" y="320" class="tick-label" text-anchor="middle">0</text>
  <text x="160" y="320" class="tick-label" text-anchor="middle">10</text>
  <text x="250" y="320" class="tick-label" text-anchor="middle">20</text>
  <text x="340" y="320" class="tick-label" text-anchor="middle">30</text>

  <text x="50" y="295" class="tick-label" text-anchor="end">0</text>
  <text x="50" y="245" class="tick-label" text-anchor="end">0.25</text>
  <text x="50" y="195" class="tick-label" text-anchor="end">0.5</text>
  <text x="50" y="145" class="tick-label" text-anchor="end">0.75</text>
  <text x="50" y="95" class="tick-label" text-anchor="end">1.0</text>

  <!-- Legend/annotation -->
  <text x="350" y="55" class="tick-label" font-style="italic">Avrami: α(t) = 1 - exp(-k_Av·t^m)</text>
</svg>
