<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis-line { stroke: #334155; stroke-width: 2; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; }
      .axis-label { font-family: sans-serif; font-size: 13px; fill: #334155; }
      .curve { fill: none; stroke: #1E40AF; stroke-width: 2.5; }
      .highlight { fill: none; stroke: #E2570F; stroke-width: 2.5; stroke-dasharray: 5,5; }
      .limit-line { stroke: #E2570F; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">
    Strain Fixity: Saturation with Programming Margin
  </text>

  <!-- Grid -->
  <line x1="80" y1="120" x2="550" y2="120" class="grid-line"/>
  <line x1="80" y1="150" x2="550" y2="150" class="grid-line"/>
  <line x1="80" y1="180" x2="550" y2="180" class="grid-line"/>
  <line x1="80" y1="210" x2="550" y2="210" class="grid-line"/>
  <line x1="150" y1="90" x2="150" y2="240" class="grid-line"/>
  <line x1="220" y1="90" x2="220" y2="240" class="grid-line"/>
  <line x1="290" y1="90" x2="290" y2="240" class="grid-line"/>
  <line x1="360" y1="90" x2="360" y2="240" class="grid-line"/>
  <line x1="430" y1="90" x2="430" y2="240" class="grid-line"/>
  <line x1="500" y1="90" x2="500" y2="240" class="grid-line"/>

  <!-- Axes -->
  <line x1="80" y1="90" x2="80" y2="240" class="axis-line"/>
  <line x1="80" y1="240" x2="550" y2="240" class="axis-line"/>

  <!-- Axis labels -->
  <text x="30" y="165" font-size="12" text-anchor="end" class="axis-label">R<tspan baseline-shift="sub">f</tspan> (%)</text>
  <text x="315" y="270" font-size="12" text-anchor="middle" class="axis-label">Programming Margin T<tspan baseline-shift="sub">prog</tspan> - T<tspan baseline-shift="sub">g</tspan> (°C)</text>

  <!-- Y-axis ticks and labels -->
  <line x1="75" y1="240" x2="80" y2="240" class="axis-line"/>
  <line x1="75" y1="210" x2="80" y2="210" class="axis-line"/>
  <line x1="75" y1="150" x2="80" y2="150" class="axis-line"/>
  <line x1="75" y1="90" x2="80" y2="90" class="axis-line"/>
  <text x="68" y="245" font-size="10" text-anchor="end" class="axis-label">0</text>
  <text x="68" y="215" font-size="10" text-anchor="end" class="axis-label">25</text>
  <text x="68" y="155" font-size="10" text-anchor="end" class="axis-label">50</text>
  <text x="68" y="95" font-size="10" text-anchor="end" class="axis-label">85</text>

  <!-- X-axis ticks and labels -->
  <line x1="150" y1="238" x2="150" y2="242" class="axis-line"/>
  <line x1="220" y1="238" x2="220" y2="242" class="axis-line"/>
  <line x1="290" y1="238" x2="290" y2="242" class="axis-line"/>
  <line x1="360" y1="238" x2="360" y2="242" class="axis-line"/>
  <line x1="430" y1="238" x2="430" y2="242" class="axis-line"/>
  <line x1="500" y1="238" x2="500" y2="242" class="axis-line"/>
  <text x="150" y="258" font-size="10" text-anchor="middle" class="axis-label">0</text>
  <text x="220" y="258" font-size="10" text-anchor="middle" class="axis-label">10</text>
  <text x="290" y="258" font-size="10" text-anchor="middle" class="axis-label">20</text>
  <text x="360" y="258" font-size="10" text-anchor="middle" class="axis-label">30</text>
  <text x="430" y="258" font-size="10" text-anchor="middle" class="axis-label">40</text>
  <text x="500" y="258" font-size="10" text-anchor="middle" class="axis-label">50</text>

  <!-- Saturation line for PU (X_c = 0.85) -->
  <line x1="80" y1="166.5" x2="550" y2="166.5" class="limit-line"/>
  <text x="560" y="170" font-size="10" fill="#E2570F" font-weight="bold">X<tspan baseline-shift="sub">c</tspan>=0.85 (PU)</text>

  <!-- PU-SMP curve (navy) -->
  <path d="M 150 240 Q 190 210 230 178 Q 270 158 310 156 Q 350 154 450 165" class="curve"/>

  <!-- PLA-SMP curve (dashed, also approaching saturation) -->
  <path d="M 150 240 Q 190 218 230 190 Q 270 169 310 163 Q 350 160 450 163" class="highlight" stroke="#1E40AF"/>
  <text x="480" y="155" font-size="9" fill="#1E40AF">PLA (X<tspan baseline-shift="sub">c</tspan>=0.70)</text>

  <!-- PMMA-SMP curve (lighter dashed) -->
  <path d="M 150 240 Q 190 225 230 202 Q 270 180 310 170 Q 350 165 450 162" class="highlight" stroke="#1E40AF" opacity="0.6"/>
  <text x="480" y="170" font-size="9" fill="#1E40AF" opacity="0.8">PMMA (X<tspan baseline-shift="sub">c</tspan>=0.60)</text>

  <!-- Annotations -->
  <text x="315" y="50" font-size="12" text-anchor="middle" fill="#334155" font-weight="bold">
    Saturating Exponential: R<tspan baseline-shift="sub">f</tspan> = X<tspan baseline-shift="sub">c</tspan> × [1 - exp(-(T<tspan baseline-shift="sub">prog</tspan> - T<tspan baseline-shift="sub">g</tspan>)/15)]
  </text>

  <!-- Legend marker -->
  <circle cx="150" cy="312" r="3" fill="#1E40AF"/>
  <text x="160" y="316" font-size="11" class="axis-label">Navy: PU-SMP</text>

  <line x1="150" y1="325" x2="165" y2="325" class="highlight" stroke="#1E40AF"/>
  <text x="175" y="330" font-size="11" class="axis-label">Dashed: PLA &amp; PMMA curves</text>

  <line x1="150" y1="338" x2="165" y2="338" class="limit-line"/>
  <text x="175" y="343" font-size="11" class="axis-label">Rust: Crystallinity ceiling (X<tspan baseline-shift="sub">c</tspan>)</text>
</svg>
