<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis-line { stroke: #334155; stroke-width: 2; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; }
      .axis-label { font-family: sans-serif; font-size: 13px; fill: #334155; }
      .curve-phase { fill: none; stroke: #1E40AF; stroke-width: 2.5; }
      .curve-miscible { fill: none; stroke: #1E40AF; stroke-width: 2.5; stroke-dasharray: 4,4; }
      .transition-marker { stroke: #E2570F; stroke-width: 1.5; stroke-dasharray: 3,3; }
      .highlight { fill: #E2570F; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">
    Multi-Shape Memory: Phase-Separated vs. Miscible Blends
  </text>

  <!-- Left panel: Phase-Separated (PU/PMMA immiscible) -->
  <g>
    <text x="165" y="55" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">Phase-Separated (Immiscible)</text>
    <text x="165" y="70" font-size="10" text-anchor="middle" fill="#666">PU/PMMA: T<tspan baseline-shift="sub">g1</tspan>=45°C, T<tspan baseline-shift="sub">g2</tspan>=90°C</text>

    <!-- Grid -->
    <line x1="50" y1="120" x2="280" y2="120" class="grid-line"/>
    <line x1="50" y1="150" x2="280" y2="150" class="grid-line"/>
    <line x1="50" y1="180" x2="280" y2="180" class="grid-line"/>
    <line x1="50" y1="210" x2="280" y2="210" class="grid-line"/>
    <line x1="100" y1="90" x2="100" y2="240" class="grid-line"/>
    <line x1="150" y1="90" x2="150" y2="240" class="grid-line"/>
    <line x1="200" y1="90" x2="200" y2="240" class="grid-line"/>
    <line x1="250" y1="90" x2="250" y2="240" class="grid-line"/>

    <!-- Axes -->
    <line x1="50" y1="90" x2="50" y2="240" class="axis-line"/>
    <line x1="50" y1="240" x2="280" y2="240" class="axis-line"/>

    <!-- Axis labels -->
    <text x="20" y="165" font-size="11" text-anchor="end" class="axis-label">Recovery (%)</text>
    <text x="165" y="260" font-size="11" text-anchor="middle" class="axis-label">Temperature (°C)</text>

    <!-- Y-axis ticks -->
    <line x1="45" y1="240" x2="50" y2="240" class="axis-line"/>
    <line x1="45" y1="210" x2="50" y2="210" class="axis-line"/>
    <line x1="45" y1="150" x2="50" y2="150" class="axis-line"/>
    <line x1="45" y1="90" x2="50" y2="90" class="axis-line"/>
    <text x="38" y="245" font-size="10" text-anchor="end" class="axis-label">0</text>
    <text x="38" y="215" font-size="10" text-anchor="end" class="axis-label">33</text>
    <text x="38" y="155" font-size="10" text-anchor="end" class="axis-label">66</text>
    <text x="38" y="95" font-size="10" text-anchor="end" class="axis-label">100</text>

    <!-- X-axis ticks -->
    <line x1="100" y1="238" x2="100" y2="242" class="axis-line"/>
    <line x1="150" y1="238" x2="150" y2="242" class="axis-line"/>
    <line x1="200" y1="238" x2="200" y2="242" class="axis-line"/>
    <line x1="250" y1="238" x2="250" y2="242" class="axis-line"/>
    <text x="100" y="255" font-size="10" text-anchor="middle" class="axis-label">20</text>
    <text x="150" y="255" font-size="10" text-anchor="middle" class="axis-label">45</text>
    <text x="200" y="255" font-size="10" text-anchor="middle" class="axis-label">70</text>
    <text x="250" y="255" font-size="10" text-anchor="middle" class="axis-label">95</text>

    <!-- T_g1 marker (45°C) -->
    <line x1="115" y1="85" x2="115" y2="95" stroke="#E2570F" stroke-width="2"/>
    <text x="115" y="78" font-size="9" text-anchor="middle" fill="#E2570F" font-weight="bold">T<tspan baseline-shift="sub">g1</tspan></text>

    <!-- T_g2 marker (90°C) - extrapolated roughly to 240°C equiv -->
    <line x1="240" y1="85" x2="240" y2="95" stroke="#E2570F" stroke-width="2"/>
    <text x="240" y="78" font-size="9" text-anchor="middle" fill="#E2570F" font-weight="bold">T<tspan baseline-shift="sub">g2</tspan></text>

    <!-- Phase-separated recovery curve: step up at T_g1, plateau, step up at T_g2 -->
    <path d="M 60 235 L 115 200 L 115 155 L 240 120 L 270 90" class="curve-phase"/>

    <!-- Plateau zone annotation -->
    <rect x="120" y="145" width="115" height="20" fill="none" stroke="#E2570F" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="177" y="165" font-size="9" text-anchor="middle" fill="#E2570F" font-weight="bold">Plateau</text>
    <text x="177" y="177" font-size="8" text-anchor="middle" fill="#E2570F">(ε<tspan baseline-shift="sub">intermediate</tspan> locked)</text>
  </g>

  <!-- Right panel: Miscible (Fox equation) -->
  <g>
    <text x="455" y="55" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">Miscible Blend (Fox Equation)</text>
    <text x="455" y="70" font-size="10" text-anchor="middle" fill="#666">Single phase: T<tspan baseline-shift="sub">g,blend</tspan>≈65°C</text>

    <!-- Grid -->
    <line x1="340" y1="120" x2="570" y2="120" class="grid-line"/>
    <line x1="340" y1="150" x2="570" y2="150" class="grid-line"/>
    <line x1="340" y1="180" x2="570" y2="180" class="grid-line"/>
    <line x1="340" y1="210" x2="570" y2="210" class="grid-line"/>
    <line x1="390" y1="90" x2="390" y2="240" class="grid-line"/>
    <line x1="440" y1="90" x2="440" y2="240" class="grid-line"/>
    <line x1="490" y1="90" x2="490" y2="240" class="grid-line"/>
    <line x1="540" y1="90" x2="540" y2="240" class="grid-line"/>

    <!-- Axes -->
    <line x1="340" y1="90" x2="340" y2="240" class="axis-line"/>
    <line x1="340" y1="240" x2="570" y2="240" class="axis-line"/>

    <!-- Axis labels -->
    <text x="310" y="165" font-size="11" text-anchor="end" class="axis-label">Recovery (%)</text>
    <text x="455" y="260" font-size="11" text-anchor="middle" class="axis-label">Temperature (°C)</text>

    <!-- Y-axis ticks -->
    <line x1="335" y1="240" x2="340" y2="240" class="axis-line"/>
    <line x1="335" y1="210" x2="340" y2="210" class="axis-line"/>
    <line x1="335" y1="150" x2="340" y2="150" class="axis-line"/>
    <line x1="335" y1="90" x2="340" y2="90" class="axis-line"/>
    <text x="328" y="245" font-size="10" text-anchor="end" class="axis-label">0</text>
    <text x="328" y="215" font-size="10" text-anchor="end" class="axis-label">33</text>
    <text x="328" y="155" font-size="10" text-anchor="end" class="axis-label">66</text>
    <text x="328" y="95" font-size="10" text-anchor="end" class="axis-label">100</text>

    <!-- X-axis ticks -->
    <line x1="390" y1="238" x2="390" y2="242" class="axis-line"/>
    <line x1="440" y1="238" x2="440" y2="242" class="axis-line"/>
    <line x1="490" y1="238" x2="490" y2="242" class="axis-line"/>
    <line x1="540" y1="238" x2="540" y2="242" class="axis-line"/>
    <text x="390" y="255" font-size="10" text-anchor="middle" class="axis-label">20</text>
    <text x="440" y="255" font-size="10" text-anchor="middle" class="axis-label">45</text>
    <text x="490" y="255" font-size="10" text-anchor="middle" class="axis-label">70</text>
    <text x="540" y="255" font-size="10" text-anchor="middle" class="axis-label">95</text>

    <!-- T_g,blend marker (roughly 65°C, ~28% of range) -->
    <line x1="420" y1="85" x2="420" y2="95" stroke="#E2570F" stroke-width="2"/>
    <text x="420" y="78" font-size="9" text-anchor="middle" fill="#E2570F" font-weight="bold">T<tspan baseline-shift="sub">g,blend</tspan></text>

    <!-- Miscible recovery curve: single smooth step -->
    <path d="M 350 235 Q 385 215 420 165 Q 455 115 560 95" class="curve-miscible"/>

    <!-- Fox equation label -->
    <text x="455" y="115" font-size="9" text-anchor="middle" fill="#666" font-style="italic">Smooth single-step recovery</text>
  </g>

  <!-- Box formula at bottom -->
  <rect x="50" y="290" width="520" height="50" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="60" y="308" font-size="10" font-weight="bold" fill="#334155">Fox Equation (for miscible blends):</text>
  <text x="60" y="325" font-size="10" fill="#334155">
    1 / T<tspan baseline-shift="sub">g,blend</tspan> = w<tspan baseline-shift="sub">1</tspan> / (T<tspan baseline-shift="sub">g1</tspan> + 273.15) + w<tspan baseline-shift="sub">2</tspan> / (T<tspan baseline-shift="sub">g2</tspan> + 273.15)
  </text>
</svg>
