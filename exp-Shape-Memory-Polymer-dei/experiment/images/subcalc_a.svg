<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis-line { stroke: #334155; stroke-width: 2; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; }
      .axis-label { font-family: sans-serif; font-size: 13px; fill: #334155; }
      .curve { fill: none; stroke: #1E40AF; stroke-width: 2.5; }
      .highlight-curve { fill: none; stroke: #E2570F; stroke-width: 2.5; }
      .frozen-zone { fill: #E2E8F0; opacity: 0.5; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">
    Glass Transition: WLF Shift Factor &amp; DSC Heat Capacity
  </text>

  <!-- Left panel: WLF Shift Factor -->
  <g>
    <!-- Grid -->
    <line x1="50" y1="120" x2="280" y2="120" class="grid-line"/>
    <line x1="50" y1="150" x2="280" y2="150" class="grid-line"/>
    <line x1="50" y1="180" x2="280" y2="180" class="grid-line"/>
    <line x1="50" y1="210" x2="280" y2="210" class="grid-line"/>
    <line x1="100" y1="90" x2="100" y2="240" class="grid-line"/>
    <line x1="150" y1="90" x2="150" y2="240" class="grid-line"/>
    <line x1="200" y1="90" x2="200" y2="240" class="grid-line"/>
    <line x1="250" y1="90" x2="250" y2="240" class="grid-line"/>

    <!-- Frozen zone background -->
    <rect x="50" y="90" width="65" height="150" class="frozen-zone"/>
    <text x="82" y="175" font-size="10" fill="#999" font-style="italic">Frozen</text>

    <!-- Axes -->
    <line x1="50" y1="90" x2="50" y2="240" class="axis-line"/>
    <line x1="50" y1="240" x2="280" y2="240" class="axis-line"/>

    <!-- Axis labels -->
    <text x="20" y="165" font-size="11" text-anchor="end" class="axis-label">log(a<tspan baseline-shift="sub">T</tspan>)</text>
    <text x="165" y="260" font-size="11" text-anchor="middle" class="axis-label">Temperature (°C)</text>

    <!-- Tick marks -->
    <line x1="45" y1="240" x2="50" y2="240" class="axis-line"/>
    <line x1="45" y1="180" x2="50" y2="180" class="axis-line"/>
    <line x1="45" y1="120" x2="50" y2="120" class="axis-line"/>
    <text x="38" y="245" font-size="10" text-anchor="end" class="axis-label">0</text>
    <text x="38" y="185" font-size="10" text-anchor="end" class="axis-label">1</text>
    <text x="38" y="125" font-size="10" text-anchor="end" class="axis-label">2</text>

    <line x1="100" y1="238" x2="100" y2="242" class="axis-line"/>
    <line x1="150" y1="238" x2="150" y2="242" class="axis-line"/>
    <line x1="200" y1="238" x2="200" y2="242" class="axis-line"/>
    <line x1="250" y1="238" x2="250" y2="242" class="axis-line"/>
    <text x="100" y="255" font-size="10" text-anchor="middle" class="axis-label">20</text>
    <text x="150" y="255" font-size="10" text-anchor="middle" class="axis-label">45</text>
    <text x="200" y="255" font-size="10" text-anchor="middle" class="axis-label">70</text>
    <text x="250" y="255" font-size="10" text-anchor="middle" class="axis-label">95</text>

    <!-- T_g marker -->
    <line x1="115" y1="85" x2="115" y2="95" stroke="#E2570F" stroke-width="2"/>
    <text x="115" y="78" font-size="10" text-anchor="middle" fill="#E2570F" font-weight="bold">T<tspan baseline-shift="sub">g</tspan>=45°C</text>

    <!-- WLF curve (starts undefined at T_g, descends steeply) -->
    <path d="M 115 240 Q 130 235 150 220 Q 170 190 200 140 Q 230 100 260 85" class="highlight-curve"/>

    <!-- Label -->
    <text x="165" y="55" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">WLF Shift Factor a<tspan baseline-shift="sub">T</tspan></text>
  </g>

  <!-- Right panel: DSC Heat Capacity -->
  <g>
    <!-- Grid -->
    <line x1="340" y1="120" x2="570" y2="120" class="grid-line"/>
    <line x1="340" y1="150" x2="570" y2="150" class="grid-line"/>
    <line x1="340" y1="180" x2="570" y2="180" class="grid-line"/>
    <line x1="340" y1="210" x2="570" y2="210" class="grid-line"/>
    <line x1="390" y1="90" x2="390" y2="240" class="grid-line"/>
    <line x1="440" y1="90" x2="440" y2="240" class="grid-line"/>
    <line x1="490" y1="90" x2="490" y2="240" class="grid-line"/>
    <line x1="540" y1="90" x2="540" y2="240" class="grid-line"/>

    <!-- Frozen zone -->
    <rect x="340" y="90" width="65" height="150" class="frozen-zone"/>
    <text x="372" y="175" font-size="10" fill="#999" font-style="italic">Frozen</text>

    <!-- Axes -->
    <line x1="340" y1="90" x2="340" y2="240" class="axis-line"/>
    <line x1="340" y1="240" x2="570" y2="240" class="axis-line"/>

    <!-- Axis labels -->
    <text x="310" y="165" font-size="11" text-anchor="end" class="axis-label">C<tspan baseline-shift="sub">p</tspan> (J/g°C)</text>
    <text x="455" y="260" font-size="11" text-anchor="middle" class="axis-label">Temperature (°C)</text>

    <!-- Tick marks -->
    <line x1="335" y1="240" x2="340" y2="240" class="axis-line"/>
    <line x1="335" y1="180" x2="340" y2="180" class="axis-line"/>
    <line x1="335" y1="120" x2="340" y2="120" class="axis-line"/>
    <text x="328" y="245" font-size="10" text-anchor="end" class="axis-label">0.3</text>
    <text x="328" y="185" font-size="10" text-anchor="end" class="axis-label">0.45</text>
    <text x="328" y="125" font-size="10" text-anchor="end" class="axis-label">0.6</text>

    <line x1="390" y1="238" x2="390" y2="242" class="axis-line"/>
    <line x1="440" y1="238" x2="440" y2="242" class="axis-line"/>
    <line x1="490" y1="238" x2="490" y2="242" class="axis-line"/>
    <line x1="540" y1="238" x2="540" y2="242" class="axis-line"/>
    <text x="390" y="255" font-size="10" text-anchor="middle" class="axis-label">20</text>
    <text x="440" y="255" font-size="10" text-anchor="middle" class="axis-label">45</text>
    <text x="490" y="255" font-size="10" text-anchor="middle" class="axis-label">70</text>
    <text x="540" y="255" font-size="10" text-anchor="middle" class="axis-label">95</text>

    <!-- T_g marker -->
    <line x1="405" y1="85" x2="405" y2="95" stroke="#E2570F" stroke-width="2"/>
    <text x="405" y="78" font-size="10" text-anchor="middle" fill="#E2570F" font-weight="bold">T<tspan baseline-shift="sub">g</tspan>=45°C</text>

    <!-- DSC sigmoid step: starts at 0.3, inflection at T_g=45 (405 px), reaches 0.6 at high T -->
    <path d="M 355 225 Q 380 220 405 165 Q 430 115 555 105" class="curve"/>

    <!-- Inflection point marker -->
    <circle cx="405" cy="165" r="3" fill="#E2570F"/>

    <!-- Label -->
    <text x="455" y="55" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">DSC Heat Capacity Step</text>
  </g>
</svg>
