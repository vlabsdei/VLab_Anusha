<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .axis-line { stroke: #334155; stroke-width: 2; }
      .grid-line { stroke: #E2E8F0; stroke-width: 1; }
      .axis-label { font-family: sans-serif; font-size: 13px; fill: #334155; }
      .curve-free { fill: none; stroke: #1E40AF; stroke-width: 2.5; }
      .curve-constrained { fill: none; stroke: #1E40AF; stroke-width: 2.5; stroke-dasharray: 4,4; }
      .t95-marker { stroke: #E2570F; stroke-width: 1.5; stroke-dasharray: 3,3; }
      .highlight { fill: #E2570F; }
    </style>
  </defs>

  <!-- White background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#334155">
    Shape Recovery Kinetics: Free vs. Constrained Recovery
  </text>

  <!-- Grid -->
  <line x1="80" y1="120" x2="550" y2="120" class="grid-line"/>
  <line x1="80" y1="150" x2="550" y2="150" class="grid-line"/>
  <line x1="80" y1="180" x2="550" y2="180" class="grid-line"/>
  <line x1="80" y1="210" x2="550" y2="210" class="grid-line"/>
  <line x1="150" y1="90" x2="150" y2="240" class="grid-line"/>
  <line x1="220" y1="90" x2="220" y2="240" class="grid-line"/>
  <line x1="290" y1="90" x2="290" y2="240" class="grid-line"/>
  <line x1="360" y1="90" x2="360" y2="240" class="grid-line"/>
  <line x1="430" y1="90" x2="430" y2="240" class="grid-line"/>
  <line x1="500" y1="90" x2="500" y2="240" class="grid-line"/>

  <!-- Axes -->
  <line x1="80" y1="90" x2="80" y2="240" class="axis-line"/>
  <line x1="80" y1="240" x2="550" y2="240" class="axis-line"/>

  <!-- Axis labels -->
  <text x="20" y="165" font-size="12" text-anchor="middle" class="axis-label">Strain ε (%) or</text>
  <text x="20" y="180" font-size="12" text-anchor="middle" class="axis-label">Recovery R<tspan baseline-shift="sub">r</tspan> (%)</text>
  <text x="315" y="270" font-size="12" text-anchor="middle" class="axis-label">Time (s)</text>

  <!-- Y-axis ticks and labels -->
  <line x1="75" y1="240" x2="80" y2="240" class="axis-line"/>
  <line x1="75" y1="210" x2="80" y2="210" class="axis-line"/>
  <line x1="75" y1="150" x2="80" y2="150" class="axis-line"/>
  <line x1="75" y1="90" x2="80" y2="90" class="axis-line"/>
  <text x="68" y="245" font-size="10" text-anchor="end" class="axis-label">0</text>
  <text x="68" y="215" font-size="10" text-anchor="end" class="axis-label">25</text>
  <text x="68" y="155" font-size="10" text-anchor="end" class="axis-label">50</text>
  <text x="68" y="95" font-size="10" text-anchor="end" class="axis-label">100</text>

  <!-- X-axis ticks and labels -->
  <line x1="150" y1="238" x2="150" y2="242" class="axis-line"/>
  <line x1="220" y1="238" x2="220" y2="242" class="axis-line"/>
  <line x1="290" y1="238" x2="290" y2="242" class="axis-line"/>
  <line x1="360" y1="238" x2="360" y2="242" class="axis-line"/>
  <line x1="430" y1="238" x2="430" y2="242" class="axis-line"/>
  <line x1="500" y1="238" x2="500" y2="242" class="axis-line"/>
  <text x="150" y="258" font-size="10" text-anchor="middle" class="axis-label">0</text>
  <text x="220" y="258" font-size="10" text-anchor="middle" class="axis-label">1</text>
  <text x="290" y="258" font-size="10" text-anchor="middle" class="axis-label">2</text>
  <text x="360" y="258" font-size="10" text-anchor="middle" class="axis-label">3</text>
  <text x="430" y="258" font-size="10" text-anchor="middle" class="axis-label">4</text>
  <text x="500" y="258" font-size="10" text-anchor="middle" class="axis-label">5</text>

  <!-- Free recovery curve: ε(t) = 0 + (ε_u - 0)·exp(-t/τ); starts at 100, falls to 0 -->
  <path d="M 150 90 Q 200 130 250 175 Q 300 205 400 235 Q 480 240 540 241" class="curve-free"/>

  <!-- Constrained recovery curve: R_r = ((ε_u - ε_eq)/ε_u)·100; rises then plateaus -->
  <path d="M 150 240 Q 200 190 250 165 Q 300 155 350 152 L 540 152" class="curve-constrained"/>

  <!-- Equilibrium strain line (plateau for constrained) -->
  <line x1="80" y1="152" x2="550" y2="152" class="grid-line" stroke="#E2E8F0" opacity="0.3"/>
  <text x="60" y="156" font-size="9" fill="#999">ε<tspan baseline-shift="sub">eq</tspan></text>

  <!-- t_95 marker (time to 95% recovery for constrained) -->
  <line x1="280" y1="90" x2="280" y2="240" class="t95-marker"/>
  <circle cx="280" cy="154" r="2" class="highlight"/>
  <text x="280" y="80" font-size="10" text-anchor="middle" fill="#E2570F" font-weight="bold">t<tspan baseline-shift="sub">95</tspan></text>

  <!-- Annotations -->
  <text x="315" y="50" font-size="11" text-anchor="middle" fill="#334155" font-weight="bold">
    ε(t) = ε<tspan baseline-shift="sub">eq</tspan> + (ε<tspan baseline-shift="sub">u</tspan> − ε<tspan baseline-shift="sub">eq</tspan>)·exp(−t/τ)
  </text>

  <!-- Legend -->
  <line x1="80" y1="295" x2="110" y2="295" class="curve-free"/>
  <text x="120" y="300" font-size="11" class="axis-label">Free recovery (ε<tspan baseline-shift="sub">eq</tspan>=0): reaches 100%</text>

  <line x1="80" y1="320" x2="110" y2="320" class="curve-constrained"/>
  <text x="120" y="325" font-size="11" class="axis-label">Constrained recovery: levels at ε<tspan baseline-shift="sub">eq</tspan></text>

  <circle cx="95" cy="345" r="2" class="highlight"/>
  <text x="120" y="350" font-size="11" class="axis-label">t<tspan baseline-shift="sub">95</tspan>: time to 95% of available recovery (τ·ln(20))</text>
</svg>
