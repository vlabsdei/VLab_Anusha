<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Shape Error vs Mismatch Strain - Verification Gate</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="80" y1="40" x2="80" y2="280"/>
    <line x1="180" y1="40" x2="180" y2="280"/>
    <line x1="280" y1="40" x2="280" y2="280"/>
    <line x1="380" y1="40" x2="380" y2="280"/>
    <line x1="480" y1="40" x2="480" y2="280"/>
    <line x1="580" y1="40" x2="580" y2="280"/>

    <line x1="80" y1="280" x2="580" y2="280"/>
    <line x1="80" y1="232" x2="580" y2="232"/>
    <line x1="80" y1="184" x2="580" y2="184"/>
    <line x1="80" y1="136" x2="580" y2="136"/>
    <line x1="80" y1="88" x2="580" y2="88"/>
    <line x1="80" y1="40" x2="580" y2="40"/>
  </g>

  <!-- acceptance band (light green fill below 10% line) -->
  <rect x="80" y="136" width="500" height="144" fill="#10B981" fill-opacity="0.08"/>
  <text x="60" y="215" text-anchor="end" font-size="10" fill="#059669" font-weight="600">ACCEPT</text>

  <!-- 10% acceptance threshold line -->
  <line x1="80" y1="136" x2="580" y2="136" stroke="#E2570F" stroke-width="2.2" stroke-dasharray="4,4"/>
  <text x="590" y="140" font-size="10" fill="#E2570F" font-weight="600">ε_shape &lt; 10%</text>

  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="280" stroke="#1E40AF" stroke-width="1.8"/>
  <line x1="80" y1="280" x2="580" y2="280" stroke="#1E40AF" stroke-width="1.8"/>

  <!-- x tick labels (mismatch strain %) -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="80" y="300">0</text>
    <text x="180" y="300">2</text>
    <text x="280" y="300">4</text>
    <text x="380" y="300">6</text>
    <text x="480" y="300">8</text>
    <text x="580" y="300">10</text>
  </g>

  <!-- y tick labels (shape error %) -->
  <g font-size="11" fill="#334155" text-anchor="end">
    <text x="72" y="284">0</text>
    <text x="72" y="236">5</text>
    <text x="72" y="188">10</text>
    <text x="72" y="140">15</text>
    <text x="72" y="92">20</text>
    <text x="72" y="44">25</text>
  </g>

  <!-- axis labels -->
  <text x="330" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Mismatch Strain Δε (%)</text>
  <text x="25" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#334155" transform="rotate(-90 25 160)">Shape Error ε_shape (%)</text>

  <!-- data curve: error rising with strain (quadratic-ish) -->
  <polyline points="80,276 180,258 280,210 380,150 480,90 580,45"
            fill="none" stroke="#1E40AF" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- data point markers -->
  <circle cx="80" cy="276" r="3" fill="#1E40AF"/>
  <circle cx="180" cy="258" r="3" fill="#1E40AF"/>
  <circle cx="280" cy="210" r="3" fill="#1E40AF"/>
  <circle cx="380" cy="150" r="3" fill="#1E40AF"/>
  <circle cx="480" cy="90" r="3" fill="#1E40AF"/>
  <circle cx="580" cy="45" r="3" fill="#1E40AF"/>

  <!-- annotations -->
  <text x="420" y="70" font-size="10" fill="#334155" font-weight="500">Timoshenko</text>
  <text x="420" y="85" font-size="10" fill="#334155" font-weight="500">finite-strain effects</text>
  <g stroke="#334155" stroke-width="1" fill="none">
    <path d="M 450 95 L 480 130" stroke-width="1.4"/>
  </g>

  <!-- legend box -->
  <g font-size="10" fill="#334155">
    <rect x="90" y="50" width="180" height="35" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.2"/>
    <line x1="100" y1="58" x2="130" y2="58" stroke="#1E40AF" stroke-width="2.4"/>
    <text x="140" y="62" font-weight="600">Predicted vs simulated</text>
    <line x1="100" y1="72" x2="130" y2="72" stroke="#E2570F" stroke-width="2.2" stroke-dasharray="4,4"/>
    <text x="140" y="76" font-weight="600">10% gate (ACCEPT below)</text>
  </g>
</svg>
