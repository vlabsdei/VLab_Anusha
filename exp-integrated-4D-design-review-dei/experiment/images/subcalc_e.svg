<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Technology Readiness Level (TRL) Ladder - Four 4D Applications</text>

  <!-- TRL ladder structure: vertical rungs 1-9 -->
  <!-- Y positions for TRL 1-9 (bottom to top) -->
  <!-- TRL 1 at y=290, TRL 9 at y=50 (spacing ~30px per rung) -->

  <!-- left axis line -->
  <line x1="60" y1="50" x2="60" y2="290" stroke="#334155" stroke-width="2"/>

  <!-- TRL rungs (horizontal lines) -->
  <g stroke="#334155" stroke-width="1.4">
    <line x1="50" y1="290" x2="280" y2="290"/>  <!-- TRL 1 -->
    <line x1="50" y1="260" x2="280" y2="260"/>  <!-- TRL 2 -->
    <line x1="50" y1="230" x2="280" y2="230"/>  <!-- TRL 3 -->
    <line x1="50" y1="200" x2="280" y2="200"/>  <!-- TRL 4 -->
    <line x1="50" y1="170" x2="280" y2="170"/>  <!-- TRL 5 -->
    <line x1="50" y1="140" x2="280" y2="140"/>  <!-- TRL 6 -->
    <line x1="50" y1="110" x2="280" y2="110"/>  <!-- TRL 7 -->
    <line x1="50" y1="80" x2="280" y2="80"/>   <!-- TRL 8 -->
    <line x1="50" y1="50" x2="280" y2="50"/>   <!-- TRL 9 -->
  </g>

  <!-- TRL labels on left -->
  <g font-size="12" font-weight="700" fill="#334155" text-anchor="end">
    <text x="40" y="295">TRL 1</text>
    <text x="40" y="265">TRL 2</text>
    <text x="40" y="235">TRL 3</text>
    <text x="40" y="205">TRL 4</text>
    <text x="40" y="175">TRL 5</text>
    <text x="40" y="145">TRL 6</text>
    <text x="40" y="115">TRL 7</text>
    <text x="40" y="85">TRL 8</text>
    <text x="40" y="55">TRL 9</text>
  </g>

  <!-- TRL descriptions on right (brief) -->
  <g font-size="10" fill="#334155" text-anchor="start">
    <text x="290" y="295">Basic research</text>
    <text x="290" y="265">Concept formulated</text>
    <text x="290" y="235">Proof of concept</text>
    <text x="290" y="205">Lab validation</text>
    <text x="290" y="175">Relevant environment</text>
    <text x="290" y="145">Prototype in simulated env.</text>
    <text x="290" y="115">System prototype in field</text>
    <text x="290" y="85">System complete, qualified</text>
    <text x="290" y="55">Proven in operational mission</text>
  </g>

  <!-- application markers and labels -->
  <!-- Consumer 4D goods: TRL 3 -->
  <circle cx="130" cy="230" r="5" fill="#E2570F"/>
  <text x="145" y="235" font-size="11" font-weight="700" fill="#E2570F">Consumer 4D goods</text>
  <text x="160" y="248" font-size="9" fill="#9A3412">(blocked by manufacturing cost - Sub-Calc D)</text>

  <!-- Soft robotics: TRL 4 -->
  <circle cx="130" cy="200" r="5" fill="#1E40AF"/>
  <text x="145" y="205" font-size="11" font-weight="700" fill="#1E40AF">Soft robotics</text>
  <text x="160" y="218" font-size="9" fill="#16223a">(needs repeatability &amp; autonomy)</text>

  <!-- Aerospace morphing: TRL 5 -->
  <circle cx="130" cy="170" r="5" fill="#8B5CF6"/>
  <text x="145" y="175" font-size="11" font-weight="700" fill="#8B5CF6">Aerospace morphing</text>
  <text x="160" y="188" font-size="9" fill="#5B21B6">(shape verification, fatigue)</text>

  <!-- Biomedical stent: TRL 6 -->
  <circle cx="130" cy="140" r="5" fill="#10B981"/>
  <text x="145" y="145" font-size="11" font-weight="700" fill="#10B981">Biomedical stent</text>
  <text x="160" y="158" font-size="9" fill="#059669">(in-vivo validation, body-heat trigger)</text>

  <!-- band labels -->
  <g font-size="10" font-weight="600" fill="#334155" text-anchor="middle" opacity="0.7">
    <rect x="310" y="230" width="290" height="75" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.2" rx="3"/>
    <text x="455" y="250">TRL 1-3: Basic principles &amp; analytical proof</text>

    <rect x="310" y="155" width="290" height="65" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.2" rx="3"/>
    <text x="455" y="175">TRL 4-6: Lab-to-relevant-environment validation</text>

    <rect x="310" y="75" width="290" height="70" fill="#ffffff" stroke="#E2E8F0" stroke-width="1.2" rx="3"/>
    <text x="455" y="100">TRL 7-9: System prototype through</text>
    <text x="455" y="115">flight-proven operation</text>
  </g>

  <!-- key insight box at bottom -->
  <rect x="50" y="310" width="520" height="35" fill="#E2E8F0" stroke="#334155" stroke-width="1.2" rx="3"/>
  <text x="310" y="328" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Each barrier traces to a Sub-Calc gate: material selection (A), shape verification (B), energy economics (C), scalability (D), or trigger mechanism (E).</text>
</svg>
