<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Ashby Selection Map — 5 4D-active materials</text>

  <!-- gridlines -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="80"  y1="56" x2="80"  y2="330"/>
    <line x1="253.3" y1="56" x2="253.3" y2="330"/>
    <line x1="426.7" y1="56" x2="426.7" y2="330"/>
    <line x1="600" y1="56" x2="600" y2="330"/>
    <line x1="80" y1="330" x2="600" y2="330"/>
    <line x1="80" y1="261.5" x2="600" y2="261.5"/>
    <line x1="80" y1="193" x2="600" y2="193"/>
    <line x1="80" y1="124.5" x2="600" y2="124.5"/>
    <line x1="80" y1="56" x2="600" y2="56"/>
  </g>

  <!-- axes -->
  <line x1="80" y1="56" x2="80" y2="330" stroke="#334155" stroke-width="1.6"/>
  <line x1="80" y1="330" x2="600" y2="330" stroke="#334155" stroke-width="1.6"/>

  <!-- x tick labels -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="80"  y="347">0.1</text>
    <text x="253.3" y="347">1</text>
    <text x="426.7" y="347">10</text>
    <text x="600" y="347">100</text>
  </g>
  <!-- y tick labels -->
  <g font-size="11" fill="#334155" text-anchor="end">
    <text x="72" y="334">10</text>
    <text x="72" y="265.5">10²</text>
    <text x="72" y="197">10³</text>
    <text x="72" y="128.5">10⁴</text>
    <text x="72" y="60">10⁵</text>
  </g>

  <!-- axis captions -->
  <text x="340" y="376" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">M₁ = √E / ρ   stiffness-per-mass index</text>
  <text x="24" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#334155" transform="rotate(-90 24 193)">M₂ = σ_recovery / ρ   recovery index</text>

  <!-- material bubbles: radius ∝ trigger efficiency M₃ -->
  <!-- SMA NiTi: weighted winner (recovery-led default) -->
  <circle cx="532.9" cy="63.5" r="15" fill="#E2570F" fill-opacity="0.20" stroke="#E2570F" stroke-width="3"/>
  <text x="532.9" y="42" text-anchor="middle" font-size="12" font-weight="700" fill="#9A3412">SMA (NiTi)</text>
  <!-- SMP-PLA -->
  <circle cx="543.7" cy="167.0" r="24" fill="#1E40AF" fill-opacity="0.12" stroke="#1E40AF" stroke-width="2"/>
  <text x="543.7" y="134" text-anchor="middle" font-size="11" font-weight="600" fill="#16223a">SMP-PLA</text>
  <!-- SMP-PU -->
  <circle cx="494.4" cy="176.6" r="18" fill="#1E40AF" fill-opacity="0.12" stroke="#3E5A82" stroke-width="2"/>
  <text x="482" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#16223a">SMP-PU</text>
  <!-- PAA gel -->
  <circle cx="162.7" cy="283.6" r="12" fill="#1E40AF" fill-opacity="0.12" stroke="#15803D" stroke-width="2"/>
  <text x="162.7" y="264" text-anchor="middle" font-size="11" font-weight="600" fill="#16223a">PAA gel</text>
  <!-- PNIPAM -->
  <circle cx="139.3" cy="309.7" r="11" fill="#1E40AF" fill-opacity="0.12" stroke="#8B929B" stroke-width="2"/>
  <text x="156" y="314" text-anchor="start" font-size="11" font-weight="600" fill="#16223a">PNIPAM</text>

  <!-- legend (upper-left, empty region) -->
  <g font-size="11" fill="#334155">
    <rect x="95" y="66" width="200" height="46" fill="#ffffff" fill-opacity="0.85" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="108" cy="82" r="6" fill="#E2570F" fill-opacity="0.20" stroke="#E2570F" stroke-width="2.4"/>
    <text x="120" y="86">rust = weighted winner (recovery-led)</text>
    <circle cx="108" cy="100" r="6" fill="none" stroke="#1E40AF" stroke-width="1.6"/>
    <text x="120" y="104">bubble radius ∝ trigger efficiency M₃</text>
  </g>
</svg>
