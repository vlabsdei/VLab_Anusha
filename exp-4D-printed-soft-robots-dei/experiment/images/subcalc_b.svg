<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" font-size="16" font-weight="bold" fill="#334155">Shape-Memory Stiffness Switching</text>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="60" y="50" width="520" height="260" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Axes -->
  <line x1="60" y1="310" x2="580" y2="310" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="310" x2="60" y2="50" stroke="#334155" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="570" y="330" font-size="13" fill="#334155" text-anchor="end">T (°C)</text>
  <text x="35" y="60" font-size="13" fill="#334155">E (Pa)</text>

  <!-- Axis ticks and values (Temperature) -->
  <text x="55" y="320" font-size="11" fill="#334155" text-anchor="end">20</text>
  <text x="165" y="320" font-size="11" fill="#334155" text-anchor="end">30</text>
  <text x="275" y="320" font-size="11" fill="#334155" text-anchor="end">40</text>
  <text x="385" y="320" font-size="11" fill="#334155" text-anchor="end">50</text>
  <text x="495" y="320" font-size="11" fill="#334155" text-anchor="end">60</text>
  <text x="580" y="320" font-size="11" fill="#334155" text-anchor="end">70</text>

  <!-- Axis ticks and values (Modulus) -->
  <text x="50" y="315" font-size="10" fill="#334155" text-anchor="end">0</text>
  <text x="50" y="230" font-size="10" fill="#334155" text-anchor="end">0.5G</text>
  <text x="50" y="145" font-size="10" fill="#334155" text-anchor="end">1.0G</text>
  <text x="50" y="60" font-size="10" fill="#334155" text-anchor="end">1.5G</text>

  <!-- Minor tick marks -->
  <line x1="60" y1="308" x2="60" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="110" y1="308" x2="110" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="160" y1="308" x2="160" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="210" y1="308" x2="210" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="260" y1="308" x2="260" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="310" y1="308" x2="310" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="360" y1="308" x2="360" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="410" y1="308" x2="410" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="460" y1="308" x2="460" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="510" y1="308" x2="510" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="560" y1="308" x2="560" y2="312" stroke="#334155" stroke-width="1"/>

  <!-- T_g = 40°C reference line (dashed vertical) -->
  <line x1="275" y1="50" x2="275" y2="310" stroke="#E2570F" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="275" y="335" font-size="11" fill="#E2570F" font-weight="bold" text-anchor="middle">T_g = 40°C</text>

  <!-- Sigmoid curve E(T) -->
  <path d="M 60,305 Q 150,295 200,270 Q 240,220 275,140 Q 310,70 350,62 Q 420,55 500,52 Q 550,51 580,50"
    stroke="#1E40AF" stroke-width="2.5" fill="none"/>

  <!-- Cold state label (left) -->
  <text x="100" y="320" font-size="11" fill="#334155" font-style="italic">E_active</text>

  <!-- Warm state label (right) -->
  <text x="520" y="65" font-size="11" fill="#334155" font-style="italic">E_passive</text>
  <text x="535" y="80" font-size="10" fill="#334155">1.5 GPa</text>

  <!-- Transition width annotation -->
  <g>
    <path d="M 240 225 L 240 175" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 310 175 L 310 225" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="240" y1="200" x2="310" y2="200" stroke="#334155" stroke-width="1"/>
    <text x="275" y="195" font-size="9" fill="#334155" text-anchor="middle">w = 3°C</text>
  </g>

  <!-- Lock/Hold annotation -->
  <g>
    <circle cx="275" cy="140" r="3" fill="#E2570F"/>
    <path d="M 280 135 L 340 110" stroke="#E2570F" stroke-width="1"/>
    <text x="345" y="115" font-size="10" fill="#E2570F" font-weight="bold">Freeze</text>
    <text x="345" y="128" font-size="9" fill="#334155">(power = 0)</text>
  </g>

  <!-- Spring back annotation -->
  <g>
    <circle cx="150" cy="290" r="3" fill="#334155"/>
    <path d="M 155 285 L 120 250" stroke="#334155" stroke-width="1"/>
    <text x="90" y="250" font-size="10" fill="#334155">Spring back</text>
    <text x="90" y="263" font-size="9" fill="#334155">(no lock)</text>
  </g>

  <!-- Legend -->
  <g>
    <line x1="420" y1="330" x2="450" y2="330" stroke="#1E40AF" stroke-width="2.5"/>
    <text x="455" y="335" font-size="11" fill="#334155">E(T) sigmoid</text>
  </g>

  <g>
    <line x1="420" y1="350" x2="450" y2="350" stroke="#E2570F" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="455" y="355" font-size="11" fill="#334155">Glass transition</text>
  </g>
</svg>