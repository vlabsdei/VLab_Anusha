<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" font-size="16" font-weight="bold" fill="#334155">Closed-Loop PID: Step Response</text>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="60" y="50" width="520" height="260" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Axes -->
  <line x1="60" y1="310" x2="580" y2="310" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="310" x2="60" y2="50" stroke="#334155" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="570" y="330" font-size="13" fill="#334155" text-anchor="end">Time (s)</text>
  <text x="35" y="60" font-size="13" fill="#334155">θ (°)</text>

  <!-- Axis ticks and values (x-axis: time) -->
  <text x="60" y="325" font-size="11" fill="#334155" text-anchor="middle">0</text>
  <text x="140" y="325" font-size="11" fill="#334155" text-anchor="middle">0.5</text>
  <text x="220" y="325" font-size="11" fill="#334155" text-anchor="middle">1.0</text>
  <text x="300" y="325" font-size="11" fill="#334155" text-anchor="middle">1.5</text>
  <text x="380" y="325" font-size="11" fill="#334155" text-anchor="middle">2.0</text>
  <text x="460" y="325" font-size="11" fill="#334155" text-anchor="middle">2.5</text>
  <text x="540" y="325" font-size="11" fill="#334155" text-anchor="middle">3.0</text>

  <!-- Axis ticks and values (y-axis: angle) -->
  <text x="55" y="315" font-size="11" fill="#334155" text-anchor="end">0</text>
  <text x="55" y="230" font-size="11" fill="#334155" text-anchor="end">30</text>
  <text x="55" y="145" font-size="11" fill="#334155" text-anchor="end">60</text>
  <text x="55" y="60" font-size="11" fill="#334155" text-anchor="end">90</text>

  <!-- Minor tick marks -->
  <line x1="60" y1="308" x2="60" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="100" y1="308" x2="100" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="140" y1="308" x2="140" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="180" y1="308" x2="180" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="220" y1="308" x2="220" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="260" y1="308" x2="260" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="300" y1="308" x2="300" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="340" y1="308" x2="340" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="308" x2="380" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="420" y1="308" x2="420" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="460" y1="308" x2="460" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="500" y1="308" x2="500" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="540" y1="308" x2="540" y2="312" stroke="#334155" stroke-width="1"/>

  <!-- Setpoint θ_set (step input at t=0) -->
  <line x1="60" y1="310" x2="60" y2="145" stroke="#334155" stroke-width="2.5" stroke-dasharray="3,3"/>
  <line x1="60" y1="145" x2="580" y2="145" stroke="#334155" stroke-width="2.5" stroke-dasharray="3,3"/>
  <text x="45" y="150" font-size="10" fill="#334155" font-weight="bold">θ_set</text>

  <!-- PID step response with overshoot -->
  <!-- Rise phase: 0-0.8s, peak at ~0.9s with ~12% overshoot -->
  <!-- Settling band at ±2%: 2% of 90° = 1.8°, so ±1.8° from setpoint (y ≈ 140-150) -->
  <path d="M 60,310 Q 120,250 160,130 Q 180,115 200,125 Q 240,145 280,148 Q 340,145 380,146 Q 420,145 460,145.5 Q 500,145 540,145"
    stroke="#1E40AF" stroke-width="2.5" fill="none"/>

  <!-- Overshoot annotation -->
  <g>
    <circle cx="180" cy="115" r="2.5" fill="#E2570F"/>
    <path d="M 185 110 L 210 95" stroke="#E2570F" stroke-width="1"/>
    <text x="215" y="100" font-size="10" fill="#E2570F" font-weight="bold">Overshoot</text>
    <text x="215" y="113" font-size="9" fill="#334155">&lt;15%</text>
  </g>

  <!-- 2% Settling band -->
  <g>
    <line x1="280" y1="140" x2="500" y2="140" stroke="#E2570F" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <line x1="280" y1="150" x2="500" y2="150" stroke="#E2570F" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
    <rect x="280" y="140" width="220" height="10" fill="#E2570F" opacity="0.1"/>
    <text x="510" y="148" font-size="9" fill="#E2570F">±2%</text>
  </g>

  <!-- Settling time annotation (t_s) -->
  <g>
    <path d="M 280 315 L 280 320" stroke="#334155" stroke-width="1"/>
    <path d="M 500 315 L 500 320" stroke="#334155" stroke-width="1"/>
    <line x1="280" y1="318" x2="500" y2="318" stroke="#334155" stroke-width="1"/>
    <text x="390" y="340" font-size="10" fill="#334155" text-anchor="middle">t_s &lt; 2 s</text>
  </g>

  <!-- Rise time marker -->
  <g>
    <line x1="160" y1="308" x2="160" y2="312" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="340" font-size="9" fill="#334155" text-anchor="middle">t_r</text>
  </g>

  <!-- Valve saturation limit annotation (if gains too high) -->
  <text x="95" y="75" font-size="9" fill="#334155" font-style="italic">0-150 kPa valve range</text>

  <!-- Legend -->
  <g>
    <line x1="420" y1="330" x2="450" y2="330" stroke="#1E40AF" stroke-width="2.5"/>
    <text x="455" y="335" font-size="11" fill="#334155">Closed-loop response</text>
  </g>

  <g>
    <line x1="420" y1="350" x2="450" y2="350" stroke="#334155" stroke-width="2.5" stroke-dasharray="3,3"/>
    <text x="455" y="355" font-size="11" fill="#334155">Setpoint</text>
  </g>

  <!-- Pass criteria annotation -->
  <g>
    <rect x="70" y="60" width="160" height="75" fill="none" stroke="#1E40AF" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="75" y="75" font-size="9" fill="#1E40AF" font-weight="bold">Pass criteria:</text>
    <text x="75" y="90" font-size="8" fill="#334155">- OS &lt; 15%</text>
    <text x="75" y="105" font-size="8" fill="#334155">- t_s &lt; 2 s</text>
    <text x="75" y="120" font-size="8" fill="#334155">- No saturation</text>
  </g>
</svg>