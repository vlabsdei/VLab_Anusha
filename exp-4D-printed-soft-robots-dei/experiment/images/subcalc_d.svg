<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="620" height="360" fill="white"/>

  <!-- Title -->
  <text x="310" y="25" font-size="16" font-weight="bold" fill="#334155">Three-Finger Grasping: Force Closure</text>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect x="60" y="50" width="520" height="260" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Axes -->
  <line x1="60" y1="310" x2="580" y2="310" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="310" x2="60" y2="50" stroke="#334155" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="570" y="330" font-size="13" fill="#334155" text-anchor="end">θ (°)</text>
  <text x="30" y="60" font-size="13" fill="#334155">F_grasp (N)</text>

  <!-- Axis ticks and values (x-axis: angle) -->
  <text x="60" y="325" font-size="11" fill="#334155" text-anchor="middle">0</text>
  <text x="140" y="325" font-size="11" fill="#334155" text-anchor="middle">15</text>
  <text x="220" y="325" font-size="11" fill="#334155" text-anchor="middle">30</text>
  <text x="300" y="325" font-size="11" fill="#334155" text-anchor="middle">45</text>
  <text x="380" y="325" font-size="11" fill="#334155" text-anchor="middle">60</text>
  <text x="460" y="325" font-size="11" fill="#334155" text-anchor="middle">75</text>
  <text x="540" y="325" font-size="11" fill="#334155" text-anchor="middle">90</text>

  <!-- Axis ticks and values (y-axis: force) -->
  <text x="55" y="315" font-size="11" fill="#334155" text-anchor="end">0</text>
  <text x="55" y="230" font-size="11" fill="#334155" text-anchor="end">5</text>
  <text x="55" y="145" font-size="11" fill="#334155" text-anchor="end">10</text>
  <text x="55" y="60" font-size="11" fill="#334155" text-anchor="end">15</text>

  <!-- Minor tick marks -->
  <line x1="60" y1="308" x2="60" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="100" y1="308" x2="100" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="140" y1="308" x2="140" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="180" y1="308" x2="180" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="220" y1="308" x2="220" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="260" y1="308" x2="260" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="300" y1="308" x2="300" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="340" y1="308" x2="340" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="308" x2="380" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="420" y1="308" x2="420" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="460" y1="308" x2="460" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="500" y1="308" x2="500" y2="312" stroke="#334155" stroke-width="1"/>
  <line x1="540" y1="308" x2="540" y2="312" stroke="#334155" stroke-width="1"/>

  <!-- Cosine curve F_grasp = P·A_tip·cos(θ) -->
  <!-- At θ=0: F = P·A_tip ≈ 10 N (y ≈ 80) -->
  <!-- At θ=60: F = P·A_tip·0.5 ≈ 5 N (y ≈ 230) -->
  <!-- At θ=90: F ≈ 0 N (y ≈ 310) -->

  <path d="M 60,80 Q 150,95 220,130 Q 300,180 380,250 Q 460,290 540,308"
    stroke="#1E40AF" stroke-width="2.5" fill="none"/>

  <!-- Hold threshold line (horizontal) -->
  <!-- mg/(3μ) ≈ 3.3 N for typical object; places threshold at y ≈ 210 -->
  <line x1="60" y1="210" x2="520" y2="210" stroke="#E2570F" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="530" y="215" font-size="10" fill="#E2570F" font-weight="bold">F_min</text>
  <text x="530" y="228" font-size="9" fill="#334155">mg/(3μ)</text>

  <!-- Critical angle where curve crosses threshold (≈ 55°) -->
  <circle cx="435" cy="210" r="3" fill="#E2570F"/>
  <text x="440" y="195" font-size="10" fill="#E2570F" font-weight="bold">Drop point</text>
  <line x1="445" y1="200" x2="450" y2="210" stroke="#E2570F" stroke-width="1"/>

  <!-- Stable grasp region (below threshold) -->
  <path d="M 60,210 L 435,210" stroke="#1E40AF" stroke-width="3" opacity="0.3"/>
  <text x="240" y="195" font-size="10" fill="#1E40AF" font-weight="bold">Stable grasp</text>

  <!-- Slip region (above threshold) -->
  <path d="M 435,210 L 520,210" stroke="#334155" stroke-width="3" opacity="0.2"/>
  <text x="480" y="245" font-size="10" fill="#334155">Slip / drop</text>

  <!-- Angle annotation showing cosine effect -->
  <g>
    <path d="M 300 145 L 340 165" stroke="#334155" stroke-width="1"/>
    <text x="305" y="140" font-size="9" fill="#334155">cos θ term</text>
  </g>

  <!-- 90° annotation -->
  <text x="540" y="330" font-size="9" fill="#E2570F" font-weight="bold">F = 0</text>

  <!-- Legend -->
  <g>
    <line x1="420" y1="330" x2="450" y2="330" stroke="#1E40AF" stroke-width="2.5"/>
    <text x="455" y="335" font-size="11" fill="#334155">F_grasp = P·A_tip·cos(θ)</text>
  </g>

  <g>
    <line x1="420" y1="350" x2="450" y2="350" stroke="#E2570F" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="455" y="355" font-size="11" fill="#334155">Hold threshold</text>
  </g>
</svg>