<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc C: PNIPAM Thermoresponsive Collapse (LCST)</text>

  <!-- swollen (cold) -->
  <text x="100" y="74" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">Below 32&#176;C: swollen</text>
  <circle cx="100" cy="138" r="55" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <g fill="#38bdf8"><circle cx="80" cy="120" r="4"/><circle cx="120" cy="120" r="4"/><circle cx="80" cy="156" r="4"/><circle cx="120" cy="156" r="4"/><circle cx="100" cy="138" r="4"/></g>
  <text x="100" y="206" fill="#1e40af" font-size="11" text-anchor="middle">hydrophilic, water-rich</text>

  <!-- arrow -->
  <path d="M165 138 L215 138" stroke="#8A1134" stroke-width="3" marker-end="url(#arrC)"/>
  <text x="190" y="128" fill="#8A1134" font-size="11" font-weight="700" text-anchor="middle">heat</text>
  <defs><marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8A1134"/></marker></defs>

  <!-- collapsed (hot) -->
  <text x="300" y="74" fill="#991b1b" font-size="12" font-weight="700" text-anchor="middle">Above 32&#176;C: collapsed</text>
  <circle cx="300" cy="138" r="26" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <g fill="#38bdf8" opacity="0.8"><circle cx="345" cy="105" r="4"/><circle cx="360" cy="135" r="4"/><circle cx="345" cy="168" r="4"/><circle cx="255" cy="110" r="4"/><circle cx="248" cy="160" r="4"/></g>
  <text x="300" y="206" fill="#991b1b" font-size="11" text-anchor="middle">hydrophobic, water expelled</text>

  <!-- Q vs T collapse -->
  <text x="510" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Q vs T</text>
  <rect x="420" y="84" width="100" height="126" fill="#dbeafe" opacity="0.5"/>
  <rect x="520" y="84" width="98" height="126" fill="#fee2e2" opacity="0.5"/>
  <line x1="420" y1="84" x2="420" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="420" y1="210" x2="618" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="409" y="94" fill="#475569" font-size="10" text-anchor="end">Q</text>
  <text x="618" y="227" fill="#475569" font-size="10" text-anchor="end">T</text>
  <line x1="520" y1="84" x2="520" y2="210" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="520" y="96" fill="#b91c1c" font-size="9" text-anchor="middle" font-weight="700">32&#176;C</text>
  <path d="M428 94 Q500 96 520 150 Q540 204 612 206" fill="none" stroke="#8A1134" stroke-width="2.5"/>

  <!-- equation panel -->
  <rect x="20" y="248" width="600" height="172" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="276" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="306" fill="#1e293b" font-size="15" font-weight="700">Q(T) = Q_c + (Q_s &#8722; Q_c) / (1 + e^((T &#8722; LCST)/w))</text>
  <text x="36" y="334" fill="#1e293b" font-size="14" font-weight="700">Volume Change Ratio: VCR = Q_swollen / Q_collapsed  (20&#8211;40&#215;)</text>
  <text x="36" y="362" fill="#1e293b" font-size="15" font-weight="700">&#949;_act = (Q_s^(1/3) &#8722; Q_c^(1/3)) / Q_s^(1/3)</text>
  <text x="36" y="390" fill="#0f766e" font-size="12" font-weight="700">PNIPAM actuation strain &#8776; 50&#8211;70% &#8212; far exceeds SMP / SMA (~8%).</text>
  <text x="36" y="411" fill="#94a3b8" font-size="11">Transition sharpness &#916;T (FWHM of dQ/dT) &#8776; 3.53&#183;w &#8776; 2&#8211;5&#176;C for pure PNIPAM.</text>
</svg>
