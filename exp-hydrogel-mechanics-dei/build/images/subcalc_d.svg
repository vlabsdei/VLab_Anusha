<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc D: Shear &amp; Young's Modulus vs Crosslink Density</text>

  <!-- stiff gel: shallow indent -->
  <text x="110" y="74" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">Stiff (tight network)</text>
  <circle cx="110" cy="92" r="14" fill="#475569"/>
  <path d="M55 120 q55 8 110 0 v70 h-110 z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="208" fill="#1e40af" font-size="11" text-anchor="middle">shallow indent, high E</text>

  <!-- soft gel: deep indent -->
  <text x="300" y="74" fill="#0f766e" font-size="12" font-weight="700" text-anchor="middle">Soft (swollen)</text>
  <circle cx="300" cy="104" r="14" fill="#475569"/>
  <path d="M245 120 q55 40 110 0 v70 h-110 z" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text x="300" y="208" fill="#0f766e" font-size="11" text-anchor="middle">deep indent, low E</text>

  <!-- E vs Q plot -->
  <text x="510" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">E vs Q</text>
  <rect x="420" y="120" width="198" height="55" fill="#d1fae5" opacity="0.6"/>
  <text x="424" y="134" fill="#047857" font-size="8" font-weight="700">tissue 0.1&#8211;2 MPa</text>
  <line x1="420" y1="84" x2="420" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="420" y1="210" x2="618" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="409" y="94" fill="#475569" font-size="10" text-anchor="end">E</text>
  <text x="618" y="227" fill="#475569" font-size="10" text-anchor="end">Q</text>
  <path d="M428 92 Q470 150 520 175 Q570 195 612 202" fill="none" stroke="#8A1134" stroke-width="2.5"/>

  <!-- equation panel -->
  <rect x="20" y="248" width="600" height="172" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="276" fill="#8A1134" font-size="14" font-weight="700">Governing equations (rubber elasticity)</text>
  <text x="36" y="306" fill="#1e293b" font-size="15" font-weight="700">G = &#957;_e &#183; k_B &#183; T      (k_B = 1.38&#215;10&#8315;&#178;&#179; J/K)</text>
  <text x="36" y="334" fill="#1e293b" font-size="15" font-weight="700">G_swollen = G_dry &#183; v_p^(1/3) = G_dry / Q^(1/3)</text>
  <text x="36" y="362" fill="#1e293b" font-size="15" font-weight="700">Young (incompressible):  E = 3G</text>
  <text x="36" y="390" fill="#047857" font-size="12" font-weight="700">Target windows: cartilage 0.1&#8211;1 MPa, skin 0.1&#8211;2 MPa.</text>
  <text x="36" y="411" fill="#b91c1c" font-size="11" font-weight="700">At Q &gt; 50 chains are near full extension &#8212; use non-Gaussian (Arruda-Boyce) model.</text>
</svg>
