<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Model Validity Windows &amp; Limitations</text>

  <!-- Row 1: Flory-Rehner ionic limitation -->
  <text x="40" y="78" fill="#1e293b" font-size="13" font-weight="700">1. Flory-Rehner (Sub-Calc A): electrostatics omitted</text>
  <rect x="40" y="86" width="336" height="30" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="376" y="86" width="224" height="30" fill="#fee2e2" stroke="#dc2626"/>
  <text x="208" y="105" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Non-ionic gels: VALID</text>
  <text x="488" y="105" fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle">Ionic gels: add Donnan (2-5x)</text>

  <!-- Row 2: Rubber elasticity Gaussian window -->
  <text x="40" y="156" fill="#1e293b" font-size="13" font-weight="700">2. Rubber elasticity (Sub-Calc D): Gaussian-chain limit</text>
  <rect x="40" y="164" width="280" height="30" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="320" y="164" width="187" height="30" fill="#fef9c3" stroke="#b45309"/>
  <rect x="507" y="164" width="93" height="30" fill="#fee2e2" stroke="#dc2626"/>
  <text x="180" y="183" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">Q &lt; 30: valid (+/-10%)</text>
  <text x="413" y="183" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">30-50 marginal</text>
  <text x="553" y="183" fill="#b91c1c" font-size="9" font-weight="700" text-anchor="middle">&gt;50 non-Gaussian</text>
  <g fill="#475569" font-size="9" text-anchor="middle"><text x="40" y="208">0</text><text x="320" y="208">30</text><text x="507" y="208">50</text><text x="600" y="208">Q = 60</text></g>

  <!-- Row 3: Korsmeyer-Peppas cutoff -->
  <text x="40" y="246" fill="#1e293b" font-size="13" font-weight="700">3. Korsmeyer-Peppas (Sub-Calc E): finite-reservoir cutoff</text>
  <rect x="40" y="254" width="336" height="30" fill="#dcfce7" stroke="#16a34a"/>
  <rect x="376" y="254" width="224" height="30" fill="#fee2e2" stroke="#dc2626"/>
  <line x1="376" y1="248" x2="376" y2="290" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="208" y="273" fill="#166534" font-size="11" font-weight="700" text-anchor="middle">M_t/M_&#8734; &lt; 0.6: VALID</text>
  <text x="488" y="273" fill="#b91c1c" font-size="11" font-weight="700" text-anchor="middle">&gt; 0.6: model breaks down</text>
  <g fill="#475569" font-size="9" text-anchor="middle"><text x="40" y="298">0</text><text x="376" y="298">0.6</text><text x="600" y="298">1.0</text></g>

  <!-- summary panel -->
  <rect x="40" y="318" width="560" height="104" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="56" y="342" fill="#8A1134" font-size="13" font-weight="700">Engineering takeaways</text>
  <text x="56" y="366" fill="#475569" font-size="11">&#8226; Use Sub-Calc B (Donnan) for any polyelectrolyte gel; Sub-Calc A alone underestimates ionic swelling.</text>
  <text x="56" y="388" fill="#475569" font-size="11">&#8226; Above Q = 50 switch to the Arruda-Boyce (8-chain) model for stiffness.</text>
  <text x="56" y="410" fill="#475569" font-size="11">&#8226; Fit the release exponent n only to the &lt; 60% data; mark the cutoff on the log-log plot.</text>
</svg>
