<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Hydrogel Mechanics: Stimuli-Responsive Swelling &amp; Actuation</text>
  <defs><marker id="ov4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8A1134"/></marker></defs>

  <!-- core transformation: dry -> swollen -->
  <text x="120" y="74" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Dry network</text>
  <rect x="78" y="84" width="84" height="84" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <g stroke="#64748b" stroke-width="2"><line x1="98" y1="104" x2="142" y2="104"/><line x1="98" y1="126" x2="142" y2="126"/><line x1="98" y1="148" x2="142" y2="148"/><line x1="98" y1="104" x2="98" y2="148"/><line x1="120" y1="104" x2="120" y2="148"/><line x1="142" y1="104" x2="142" y2="148"/></g>
  <g fill="#64748b"><circle cx="98" cy="104" r="4"/><circle cx="120" cy="104" r="4"/><circle cx="142" cy="104" r="4"/><circle cx="98" cy="126" r="4"/><circle cx="120" cy="126" r="4"/><circle cx="142" cy="126" r="4"/><circle cx="98" cy="148" r="4"/><circle cx="120" cy="148" r="4"/><circle cx="142" cy="148" r="4"/></g>

  <path d="M172 126 L214 126" stroke="#8A1134" stroke-width="3" marker-end="url(#ov4)"/>
  <text x="193" y="117" fill="#8A1134" font-size="10" font-weight="700" text-anchor="middle">stimulus</text>

  <text x="300" y="74" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">Swollen network (Q = 1/v_p)</text>
  <rect x="228" y="80" width="120" height="120" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <g stroke="#2563eb" stroke-width="2"><line x1="250" y1="102" x2="326" y2="102"/><line x1="250" y1="140" x2="326" y2="140"/><line x1="250" y1="178" x2="326" y2="178"/><line x1="250" y1="102" x2="250" y2="178"/><line x1="288" y1="102" x2="288" y2="178"/><line x1="326" y1="102" x2="326" y2="178"/></g>
  <g fill="#2563eb"><circle cx="250" cy="102" r="5"/><circle cx="288" cy="102" r="5"/><circle cx="326" cy="102" r="5"/><circle cx="250" cy="140" r="5"/><circle cx="288" cy="140" r="5"/><circle cx="326" cy="140" r="5"/><circle cx="250" cy="178" r="5"/><circle cx="288" cy="178" r="5"/><circle cx="326" cy="178" r="5"/></g>
  <g fill="#38bdf8" opacity="0.75"><circle cx="269" cy="121" r="3"/><circle cx="307" cy="121" r="3"/><circle cx="269" cy="159" r="3"/><circle cx="307" cy="159" r="3"/></g>

  <!-- balance: mixing vs elastic -->
  <rect x="372" y="80" width="250" height="120" rx="8" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="497" y="102" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Free-energy balance at equilibrium</text>
  <text x="388" y="128" fill="#2563eb" font-size="12" font-weight="700">Mixing &#8594; swell</text>
  <text x="520" y="128" fill="#b45309" font-size="12" font-weight="700" text-anchor="end">Elastic &#8594; retract</text>
  <path d="M388 140 L470 140" stroke="#2563eb" stroke-width="3" marker-end="url(#ov4)"/>
  <path d="M606 140 L524 140" stroke="#b45309" stroke-width="3"/>
  <text x="497" y="172" fill="#1e293b" font-size="11" text-anchor="middle">&#928;_mix + &#928;_elastic = 0</text>
  <text x="497" y="190" fill="#64748b" font-size="10" text-anchor="middle">sets v_p, hence Q</text>

  <!-- five sub-calc pipeline -->
  <text x="320" y="222" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">One network, five governing principles (Sub-Calc A-E)</text>
  <g>
    <rect x="21" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="21" y="232" width="6" height="150" rx="3" fill="#8A1134"/>
    <text x="39" y="256" fill="#8A1134" font-size="13" font-weight="700">A</text><text x="39" y="276" fill="#1e293b" font-size="10" font-weight="700">Flory-Rehner</text><text x="39" y="296" fill="#475569" font-size="9">solvent &#967;</text><text x="39" y="312" fill="#475569" font-size="9">&#8594; swelling Q</text>
    <rect x="143" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="143" y="232" width="6" height="150" rx="3" fill="#2563eb"/>
    <text x="161" y="256" fill="#2563eb" font-size="13" font-weight="700">B</text><text x="161" y="276" fill="#1e293b" font-size="10" font-weight="700">Donnan / pH</text><text x="161" y="296" fill="#475569" font-size="9">ionisation &#945;</text><text x="161" y="312" fill="#475569" font-size="9">&#8594; Q(pH) sigmoid</text>
    <rect x="265" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="265" y="232" width="6" height="150" rx="3" fill="#7c3aed"/>
    <text x="283" y="256" fill="#7c3aed" font-size="13" font-weight="700">C</text><text x="283" y="276" fill="#1e293b" font-size="10" font-weight="700">PNIPAM LCST</text><text x="283" y="296" fill="#475569" font-size="9">T &#8805; 32&#176;C</text><text x="283" y="312" fill="#475569" font-size="9">&#8594; collapse, VCR</text>
    <rect x="387" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="387" y="232" width="6" height="150" rx="3" fill="#16a34a"/>
    <text x="405" y="256" fill="#16a34a" font-size="13" font-weight="700">D</text><text x="405" y="276" fill="#1e293b" font-size="10" font-weight="700">Modulus</text><text x="405" y="296" fill="#475569" font-size="9">&#957;_e &#8594; G</text><text x="405" y="312" fill="#475569" font-size="9">E = 3G</text>
    <rect x="509" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="509" y="232" width="6" height="150" rx="3" fill="#b45309"/>
    <text x="527" y="256" fill="#b45309" font-size="13" font-weight="700">E</text><text x="527" y="276" fill="#1e293b" font-size="10" font-weight="700">Drug release</text><text x="527" y="296" fill="#475569" font-size="9">M_t/M_&#8734; = k t^n</text><text x="527" y="312" fill="#475569" font-size="9">Korsmeyer-Peppas</text>
  </g>
  <text x="320" y="406" fill="#475569" font-size="11" text-anchor="middle" font-style="italic">A flat printed gel folds, expands or releases a drug when its environment changes - the soft branch of 4D printing.</text>
  <text x="320" y="428" fill="#94a3b8" font-size="10" text-anchor="middle">Sub-Calc A is non-ionic; ionic gels add the Donnan term (B). Modulus (D) feeds actuator sizing.</text>
</svg>
