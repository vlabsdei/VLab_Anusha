<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc E: Drug-Release Kinetics (Korsmeyer-Peppas)</text>

  <!-- matrix releasing drug -->
  <text x="120" y="74" fill="#0f766e" font-size="12" font-weight="700" text-anchor="middle">Hydrogel matrix</text>
  <ellipse cx="120" cy="92" rx="48" ry="12" fill="#99f6e4" stroke="#14b8a6"/>
  <rect x="72" y="92" width="96" height="96" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <ellipse cx="120" cy="188" rx="48" ry="12" fill="#5eead4" stroke="#14b8a6"/>
  <g fill="#8A1134"><circle cx="100" cy="120" r="4"/><circle cx="135" cy="135" r="4"/><circle cx="110" cy="160" r="4"/><circle cx="140" cy="170" r="4"/><circle cx="95" cy="145" r="4"/></g>
  <g fill="#94a3b8"><circle cx="195" cy="100" r="4"/><circle cx="205" cy="140" r="4"/><circle cx="190" cy="175" r="4"/><circle cx="40" cy="115" r="4"/><circle cx="35" cy="160" r="4"/></g>
  <path d="M168 130 q25 -5 40 0" stroke="#8A1134" stroke-width="1.5" fill="none" marker-end="url(#arrE)"/>
  <defs><marker id="arrE" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A1134"/></marker></defs>
  <text x="120" y="208" fill="#0f766e" font-size="11" text-anchor="middle">drug diffuses out over time</text>

  <!-- release curve -->
  <text x="430" y="74" fill="#0f172a" font-size="12" font-weight="700">M_t/M_inf vs t</text>
  <line x1="300" y1="84" x2="300" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="300" y1="210" x2="618" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="289" y="94" fill="#475569" font-size="10" text-anchor="end">1.0</text>
  <text x="618" y="227" fill="#475569" font-size="10" text-anchor="end">t</text>
  <rect x="300" y="160" width="318" height="50" fill="#d1fae5" opacity="0.5"/>
  <line x1="300" y1="160" x2="618" y2="160" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="614" y="155" fill="#b91c1c" font-size="9" font-weight="700" text-anchor="end">60% validity cutoff</text>
  <path d="M300 208 Q360 170 430 150 Q520 122 618 100" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M300 208 Q360 170 408 160" fill="none" stroke="#8A1134" stroke-width="3"/>
  <text x="318" y="200" fill="#8A1134" font-size="9" font-weight="700">valid fit region</text>

  <!-- equation panel -->
  <rect x="20" y="248" width="600" height="172" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="276" fill="#8A1134" font-size="14" font-weight="700">Governing equation</text>
  <text x="36" y="306" fill="#1e293b" font-size="16" font-weight="700">M_t / M_&#8734; = k &#183; t^n</text>
  <text x="36" y="334" fill="#1e293b" font-size="14" font-weight="700">Half-release:  t&#8325;&#8320; = (0.5 / k)^(1/n)</text>
  <text x="36" y="360" fill="#2563eb" font-size="12" font-weight="700">n = 0.5: Fickian diffusion</text>
  <text x="240" y="360" fill="#b45309" font-size="12" font-weight="700">0.5 &lt; n &lt; 1: anomalous</text>
  <text x="452" y="360" fill="#b91c1c" font-size="12" font-weight="700">n = 1: Case-II / zero-order</text>
  <text x="36" y="390" fill="#b91c1c" font-size="12" font-weight="700">Valid only for M_t/M_&#8734; &lt; 0.6 &#8212; restrict the log-log fit to data below the cutoff.</text>
  <text x="36" y="411" fill="#94a3b8" font-size="11">log-log plot is linear with slope n and intercept log(k).</text>
</svg>
