<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Mechanism Mobility and Joint Count</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="40" x2="70" y2="300"/>
    <line x1="152.5" y1="40" x2="152.5" y2="300"/>
    <line x1="235" y1="40" x2="235" y2="300"/>
    <line x1="317.5" y1="40" x2="317.5" y2="300"/>
    <line x1="400" y1="40" x2="400" y2="300"/>
    <line x1="482.5" y1="40" x2="482.5" y2="300"/>
    <line x1="565" y1="40" x2="565" y2="300"/>
    <line x1="70" y1="300" x2="565" y2="300"/>
    <line x1="70" y1="247" x2="565" y2="247"/>
    <line x1="70" y1="194" x2="565" y2="194"/>
    <line x1="70" y1="141" x2="565" y2="141"/>
    <line x1="70" y1="88" x2="565" y2="88"/>
    <line x1="70" y1="40" x2="565" y2="40"/>
  </g>

  <!-- bands: F<0 (locked), F=0 (rigid), F=1, F=2 (working), F>2 (floppy) -->
  <!-- F < 0 band (red, locked) -->
  <rect x="70" y="40" width="70" height="260" fill="#dc2626" opacity="0.08"/>
  <text x="105" y="56" text-anchor="middle" font-size="9" font-weight="700" fill="#dc2626">F&lt;0</text>
  <text x="105" y="68" text-anchor="middle" font-size="8" fill="#991b1b">jammed</text>

  <!-- F = 0 band (orange, rigid) -->
  <rect x="140" y="40" width="70" height="260" fill="#ea580c" opacity="0.08"/>
  <text x="175" y="56" text-anchor="middle" font-size="9" font-weight="700" fill="#ea580c">F=0</text>
  <text x="175" y="68" text-anchor="middle" font-size="8" fill="#92400e">rigid</text>

  <!-- F = 1 band -->
  <rect x="210" y="40" width="70" height="260" fill="#f59e0b" opacity="0.08"/>
  <text x="245" y="56" text-anchor="middle" font-size="9" font-weight="700" fill="#f59e0b">F=1</text>
  <text x="245" y="68" text-anchor="middle" font-size="8" fill="#92400e">stiff</text>

  <!-- F = 2 band (green, sweet spot, working) -->
  <rect x="280" y="40" width="140" height="260" fill="#16a34a" opacity="0.15"/>
  <text x="350" y="56" text-anchor="middle" font-size="10" font-weight="700" fill="#16a34a">F=2 ← IDEAL</text>
  <text x="350" y="68" text-anchor="middle" font-size="8" fill="#166534">controlled</text>

  <!-- F > 2 band (purple, floppy) -->
  <rect x="420" y="40" width="145" height="260" fill="#8b5cf6" opacity="0.08"/>
  <text x="492" y="56" text-anchor="middle" font-size="9" font-weight="700" fill="#7c3aed">F&gt;2</text>
  <text x="492" y="68" text-anchor="middle" font-size="8" fill="#5b21b6">floppy</text>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="565" y2="300" stroke="#334155" stroke-width="1.6"/>

  <!-- y ticks (Mobility F) -->
  <g font-size="11" fill="#334155" text-anchor="end">
    <text x="63" y="304">−3</text>
    <text x="63" y="251">−1</text>
    <text x="63" y="198">1</text>
    <text x="63" y="145">3</text>
    <text x="63" y="92">5</text>
    <text x="63" y="44">7</text>
  </g>

  <!-- x ticks (number of joints added) -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="70" y="318">0</text>
    <text x="152.5" y="318">2</text>
    <text x="235" y="318">4</text>
    <text x="317.5" y="318">6</text>
    <text x="400" y="318">8</text>
    <text x="482.5" y="318">10</text>
    <text x="565" y="318">12</text>
  </g>

  <!-- axis labels -->
  <text x="310" y="344" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Number of One-DOF Joints Added</text>
  <text x="22" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" transform="rotate(-90 22 170)">Mobility F = 3(n−1) − 2j₁</text>

  <!-- F = 2 reference line (sweet spot) -->
  <line x1="70" y1="141" x2="565" y2="141" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="76" y="137" font-size="10" fill="#16a34a" font-weight="600">F=2</text>

  <!-- F = 0 reference line -->
  <line x1="70" y1="194" x2="565" y2="194" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- sample data line: F = 7 - 2*joints_added (for 4 links) -->
  <!-- F starts at 7 (when j₁=0) and decreases by 2 for each joint -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.8"
    points="70,40 152.5,88 235,136 317.5,184 400,232 482.5,280 565,300"/>

  <!-- highlight point at F=2 for the ideal gripper -->
  <circle cx="280" cy="141" r="6" fill="#E2570F" stroke="#ffffff" stroke-width="2"/>
  <text x="288" y="135" font-size="10" font-weight="700" fill="#E2570F">sweet spot</text>

  <text x="500" y="310" font-size="10" fill="#64748b" font-style="italic">each joint subtracts 2 from F</text>
</svg>
