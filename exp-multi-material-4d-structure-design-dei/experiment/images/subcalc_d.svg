<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Miura-ori: Pack Ratio and Auxetic Behavior</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="70" y1="50" x2="70" y2="280"/>
    <line x1="147" y1="50" x2="147" y2="280"/>
    <line x1="224" y1="50" x2="224" y2="280"/>
    <line x1="301" y1="50" x2="301" y2="280"/>
    <line x1="378" y1="50" x2="378" y2="280"/>
    <line x1="455" y1="50" x2="455" y2="280"/>
    <line x1="532" y1="50" x2="532" y2="280"/>
    <line x1="70" y1="280" x2="532" y2="280"/>
    <line x1="70" y1="232" x2="532" y2="232"/>
    <line x1="70" y1="184" x2="532" y2="184"/>
    <line x1="70" y1="136" x2="532" y2="136"/>
    <line x1="70" y1="88" x2="532" y2="88"/>
    <line x1="70" y1="50" x2="532" y2="50"/>
  </g>

  <!-- axes -->
  <line x1="70" y1="50" x2="70" y2="280" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="280" x2="532" y2="280" stroke="#334155" stroke-width="1.6"/>

  <!-- x-axis ticks and labels -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="70" y="303">0°</text>
    <text x="147" y="303">15°</text>
    <text x="224" y="303">30°</text>
    <text x="301" y="303">45°</text>
    <text x="378" y="303">60°</text>
    <text x="455" y="303">75°</text>
    <text x="532" y="303">90°</text>
  </g>

  <!-- y-axis ticks and labels -->
  <g font-size="11" fill="#334155" text-anchor="end">
    <text x="63" y="284">0</text>
    <text x="63" y="236">25</text>
    <text x="63" y="188">50</text>
    <text x="63" y="140">75</text>
    <text x="63" y="92">100</text>
    <text x="63" y="54">125</text>
  </g>

  <!-- axis labels -->
  <text x="301" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Fold angle φ (degrees)</text>
  <text x="22" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" transform="rotate(-90 22 165)">Ratio (%)</text>

  <!-- 0% line (flat) -->
  <line x1="70" y1="280" x2="532" y2="280" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="76" y="277" font-size="10" fill="#64748b">0%</text>

  <!-- 100% line (reference) -->
  <line x1="70" y1="88" x2="532" y2="88" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="76" y="84" font-size="10" fill="#64748b">100%</text>

  <!-- Pack ratio curve: A_pack/A_flat = cos(φ) · √[1 - sin²(α)sin²(φ)] with α = 60° -->
  <!-- At φ=0°: cos(0)·√[1-0] = 1·1 = 100% -->
  <!-- At φ=30°: cos(30)·√[1-0.75·0.25] = 0.866·√0.8125 ≈ 0.78 = 78% -->
  <!-- At φ=60°: cos(60)·√[1-0.75·0.75] = 0.5·√0.4375 ≈ 0.33 = 33% -->
  <!-- At φ=90°: cos(90)·√[1-0.75·1] = 0·√0.25 = 0% -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.8"
    points="70,88 147,136 224,184 301,232 378,264 455,276 532,280"/>
  <text x="445" y="255" font-size="10" fill="#1E40AF" font-weight="600">Pack ratio</text>

  <!-- Poisson's ratio curve (negative, inverted for display) -->
  <!-- νₓ = -d(ln λ_W)/d(ln λ_L) < 0 -->
  <!-- At φ=0°: νₓ ≈ 0 (flat, no auxetic behavior) -->
  <!-- At φ=45°: νₓ ≈ -0.5 to -0.7 (moderately auxetic) -->
  <!-- At φ=90°: νₓ → -1 (highly auxetic, pulls expand in both directions) -->
  <!-- Offset vertically to show "negative" concept: higher fold = more negative = shown as high on inverted scale -->
  <polyline fill="none" stroke="#E2570F" stroke-width="2.8"
    points="70,258 147,238 224,210 301,160 378,108 455,76 532,52"/>
  <text x="485" y="65" font-size="10" fill="#E2570F" font-weight="600">Auxetic (-νₓ)</text>

  <!-- Auxetic region highlight -->
  <rect x="300" y="50" width="232" height="230" fill="#16a34a" opacity="0.06"/>
  <text x="515" y="68" font-size="9" fill="#16a34a" font-weight="600">Auxetic</text>
  <text x="515" y="80" font-size="9" fill="#16a34a" font-weight="600">region</text>

  <!-- Fold angle =0 label -->
  <line x1="70" y1="50" x2="70" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="70" y="40" text-anchor="middle" font-size="9" fill="#64748b">flat</text>

  <!-- Fold angle = 90 label -->
  <line x1="532" y1="50" x2="532" y2="290" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="532" y="40" text-anchor="middle" font-size="9" fill="#64748b">packed</text>

  <!-- Bottom note -->
  <text x="301" y="350" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">As fold angle increases, sheet compresses while negative Poisson's ratio grows</text>
</svg>
