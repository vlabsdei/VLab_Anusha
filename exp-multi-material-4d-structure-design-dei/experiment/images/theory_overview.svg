<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Multi-Material 4D Structure Design</text>
  <defs><marker id="ov5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8A1134"/></marker></defs>

  <!-- flat bilayer -->
  <text x="118" y="76" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Flat bilayer</text>
  <rect x="58" y="92" width="120" height="11" fill="#8A1134"/>
  <rect x="58" y="103" width="120" height="11" fill="#64748b"/>
  <text x="118" y="130" fill="#8A1134" font-size="9" font-weight="700" text-anchor="middle">active (soft)</text>
  <text x="118" y="143" fill="#64748b" font-size="9" font-weight="700" text-anchor="middle">passive (stiff)</text>

  <path d="M188 104 L226 104" stroke="#8A1134" stroke-width="3" marker-end="url(#ov5)"/>
  <text x="207" y="95" fill="#8A1134" font-size="9" font-weight="700" text-anchor="middle">stimulus</text>

  <!-- folded with localised hinge -->
  <text x="320" y="76" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">Folds at the soft hinge</text>
  <path d="M250 150 L300 150" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
  <path d="M300 150 L348 108" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="300" cy="150" r="9" fill="#8A1134"/>
  <text x="300" y="178" fill="#8A1134" font-size="9" font-weight="700" text-anchor="middle">hinge (95% of bend)</text>

  <!-- stiffness contrast panel -->
  <rect x="392" y="84" width="230" height="96" rx="8" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="507" y="106" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Stiffness contrast localises bending</text>
  <text x="507" y="132" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">SC = E_passive / E_active</text>
  <text x="507" y="156" fill="#16a34a" font-size="11" font-weight="700" text-anchor="middle">SC &gt; 1000 &#8594; clean localised fold</text>
  <text x="507" y="172" fill="#b45309" font-size="10" text-anchor="middle">low SC &#8594; passive arms also bend</text>

  <!-- five sub-calc pipeline -->
  <text x="320" y="222" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">A transformation-design pipeline (Sub-Calc A-E)</text>
  <g>
    <rect x="21" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="21" y="232" width="6" height="150" rx="3" fill="#8A1134"/>
    <text x="39" y="256" fill="#8A1134" font-size="13" font-weight="700">A</text><text x="39" y="276" fill="#1e293b" font-size="10" font-weight="700">Stiffness</text><text x="39" y="290" fill="#1e293b" font-size="10" font-weight="700">contrast</text><text x="39" y="308" fill="#475569" font-size="9">SC = E_p/E_a</text>
    <rect x="143" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="143" y="232" width="6" height="150" rx="3" fill="#2563eb"/>
    <text x="161" y="256" fill="#2563eb" font-size="13" font-weight="700">B</text><text x="161" y="276" fill="#1e293b" font-size="10" font-weight="700">Grubler DOF</text><text x="161" y="296" fill="#475569" font-size="9">F = 3(n-1)</text><text x="161" y="310" fill="#475569" font-size="9">-2j1 - j2</text>
    <rect x="265" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="265" y="232" width="6" height="150" rx="3" fill="#7c3aed"/>
    <text x="283" y="256" fill="#7c3aed" font-size="13" font-weight="700">C</text><text x="283" y="276" fill="#1e293b" font-size="10" font-weight="700">Kinematics</text><text x="283" y="296" fill="#475569" font-size="9">forward +</text><text x="283" y="310" fill="#475569" font-size="9">inverse fold</text>
    <rect x="387" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="387" y="232" width="6" height="150" rx="3" fill="#16a34a"/>
    <text x="405" y="256" fill="#16a34a" font-size="13" font-weight="700">D</text><text x="405" y="276" fill="#1e293b" font-size="10" font-weight="700">Miura fold</text><text x="405" y="296" fill="#475569" font-size="9">auxetic</text><text x="405" y="310" fill="#475569" font-size="9">&#957;_x &lt; 0</text>
    <rect x="509" y="232" width="110" height="150" rx="8" fill="#fafbfc" stroke="#e2e8f0"/><rect x="509" y="232" width="6" height="150" rx="3" fill="#b45309"/>
    <text x="527" y="256" fill="#b45309" font-size="13" font-weight="700">E</text><text x="527" y="276" fill="#1e293b" font-size="10" font-weight="700">Fatigue</text><text x="527" y="296" fill="#475569" font-size="9">Basquin N =</text><text x="527" y="310" fill="#475569" font-size="9">(&#963;_f/&#963;)^(1/b)</text>
  </g>
  <text x="320" y="406" fill="#475569" font-size="11" text-anchor="middle" font-style="italic">Material stiffness, mechanism mobility, fold kinematics, origami geometry and fatigue life - one design chain.</text>
  <text x="320" y="428" fill="#94a3b8" font-size="10" text-anchor="middle">Classical Theory of Machines (B) and origami metamaterials (D) applied to 4D-printed structures.</text>
</svg>
