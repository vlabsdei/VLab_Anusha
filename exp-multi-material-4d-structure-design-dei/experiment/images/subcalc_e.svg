<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="620" height="360" fill="#ffffff"/>
  <text x="310" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Basquin S-N Fatigue Curve and Hinge Life</text>

  <!-- logarithmic grid for cycles (x-axis) -->
  <g stroke="#E2E8F0" stroke-width="1">
    <!-- major vertical lines (log scale) -->
    <line x1="70" y1="40" x2="70" y2="300"/>
    <line x1="133" y1="40" x2="133" y2="300"/>
    <line x1="196" y1="40" x2="196" y2="300"/>
    <line x1="259" y1="40" x2="259" y2="300"/>
    <line x1="322" y1="40" x2="322" y2="300"/>
    <line x1="385" y1="40" x2="385" y2="300"/>
    <line x1="448" y1="40" x2="448" y2="300"/>
    <line x1="511" y1="40" x2="511" y2="300"/>
    <line x1="574" y1="40" x2="574" y2="300"/>
    <!-- horizontal lines (linear stress) -->
    <line x1="70" y1="40" x2="574" y2="40"/>
    <line x1="70" y1="86" x2="574" y2="86"/>
    <line x1="70" y1="132" x2="574" y2="132"/>
    <line x1="70" y1="178" x2="574" y2="178"/>
    <line x1="70" y1="224" x2="574" y2="224"/>
    <line x1="70" y1="270" x2="574" y2="270"/>
    <line x1="70" y1="300" x2="574" y2="300"/>
  </g>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="300" stroke="#334155" stroke-width="1.6"/>
  <line x1="70" y1="300" x2="574" y2="300" stroke="#334155" stroke-width="1.6"/>

  <!-- x-axis ticks (log cycles) -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="70" y="320">10°</text>
    <text x="133" y="320">10¹</text>
    <text x="196" y="320">10²</text>
    <text x="259" y="320">10³</text>
    <text x="322" y="320">10⁴</text>
    <text x="385" y="320">10⁵</text>
    <text x="448" y="320">10⁶</text>
    <text x="511" y="320">10⁷</text>
    <text x="574" y="320">10⁸</text>
  </g>

  <!-- y-axis ticks (stress in MPa) -->
  <g font-size="11" fill="#334155" text-anchor="end">
    <text x="63" y="304">0</text>
    <text x="63" y="228">20</text>
    <text x="63" y="152">40</text>
    <text x="63" y="76">60</text>
    <text x="63" y="44">70</text>
  </g>

  <!-- axis labels -->
  <text x="322" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Cycles to Failure N (log scale)</text>
  <text x="20" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" transform="rotate(-90 20 170)">Stress σ (MPa)</text>

  <!-- fatigue strength reference line -->
  <line x1="70" y1="60" x2="574" y2="60" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="76" y="56" font-size="10" font-weight="600" fill="#dc2626">σ_f = 60 MPa</text>

  <!-- Basquin curve: σ = σ_f · N^(−b) with b=0.1 -->
  <!-- At N=1: σ = 60·1^(-0.1) = 60 MPa -->
  <!-- At N=10: σ = 60·10^(-0.1) ≈ 60·0.794 ≈ 47.6 MPa -->
  <!-- At N=100: σ = 60·100^(-0.1) ≈ 60·0.631 ≈ 37.8 MPa -->
  <!-- At N=1000: σ = 60·1000^(-0.1) ≈ 60·0.501 ≈ 30 MPa -->
  <!-- At N=10000: σ = 60·10000^(-0.1) ≈ 60·0.398 ≈ 23.9 MPa -->
  <!-- At N=100000: σ = 60·100000^(-0.1) ≈ 60·0.316 ≈ 19 MPa -->
  <!-- At N=1000000: σ = 60·1000000^(-0.1) ≈ 60·0.251 ≈ 15 MPa -->
  <!-- At N=10000000: σ = 60·10000000^(-0.1) ≈ 60·0.2 ≈ 12 MPa -->
  <!-- At N=100000000: σ = 60·100000000^(-0.1) ≈ 60·0.158 ≈ 9.5 MPa -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.8"
    points="70,60 133,94 196,125 259,160 322,188 385,210 448,230 511,245 574,258"/>
  <text x="480" y="240" font-size="10" fill="#1E40AF" font-weight="600">σ = 60·N^(−0.1)</text>

  <!-- Safe life threshold (N_safe = 1000) with safety factor 5 -->
  <line x1="259" y1="40" x2="259" y2="300" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="259" y="32" text-anchor="middle" font-size="10" font-weight="600" fill="#16a34a">N_safe = 1000</text>

  <!-- Working point at N=5000 cycles, σ ≈ 24 MPa -->
  <circle cx="300" cy="170" r="5" fill="#E2570F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="315" y="175" font-size="9" fill="#E2570F" font-weight="700">working point</text>
  <text x="315" y="187" font-size="8" fill="#E2570F">(N=5000, σ≈24 MPa)</text>

  <!-- Thinner hinge comparison curve (rightward shift) -->
  <!-- Thinner hinge reduces stress, moving the operating point right on the S-N curve -->
  <polyline fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3 3"
    points="133,80 196,110 259,140 322,165 385,185 448,202 511,215 574,225"/>
  <text x="530" y="205" font-size="9" fill="#8b5cf6" font-weight="600">thinner hinge</text>
  <text x="530" y="217" font-size="8" fill="#7c3aed">(lower stress)</text>

  <!-- Failure region (above σ_f) -->
  <rect x="70" y="40" width="504" height="20" fill="#dc2626" opacity="0.08"/>
  <text x="575" y="55" font-size="9" fill="#991b1b" font-weight="600">failure</text>

  <!-- 90% survival threshold -->
  <line x1="70" y1="107" x2="574" y2="107" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="76" y="104" font-size="9" fill="#64748b">90% survival</text>

  <!-- Bottom note -->
  <text x="322" y="350" text-anchor="middle" font-size="9" fill="#64748b" font-style="italic">Low Basquin exponent (b=0.1) makes life extremely sensitive to stress; thinner hinges win exponentially more cycles</text>
</svg>
