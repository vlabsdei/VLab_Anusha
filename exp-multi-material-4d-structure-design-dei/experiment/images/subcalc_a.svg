<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#ffffff"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">Stiffness contrast localises the fold in the hinge</text>

  <!-- gridlines -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="72" y1="54" x2="72" y2="322"/>
    <line x1="204" y1="54" x2="204" y2="322"/>
    <line x1="336" y1="54" x2="336" y2="322"/>
    <line x1="468" y1="54" x2="468" y2="322"/>
    <line x1="600" y1="54" x2="600" y2="322"/>
    <line x1="72" y1="322" x2="600" y2="322"/>
    <line x1="72" y1="255" x2="600" y2="255"/>
    <line x1="72" y1="188" x2="600" y2="188"/>
    <line x1="72" y1="121" x2="600" y2="121"/>
    <line x1="72" y1="54" x2="600" y2="54"/>
  </g>

  <!-- clean-fold region SC >= 1000 -->
  <rect x="468" y="54" width="132" height="268" fill="#16a34a" opacity="0.09"/>
  <text x="534" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#16a34a">clean box  SC ≥ 1000</text>
  <line x1="468" y1="54" x2="468" y2="322" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="5 4"/>

  <!-- 90% reference -->
  <line x1="72" y1="80.8" x2="600" y2="80.8" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="78" y="76" font-size="11" fill="#64748B">90%</text>

  <!-- axes -->
  <line x1="72" y1="54" x2="72" y2="322" stroke="#334155" stroke-width="1.6"/>
  <line x1="72" y1="322" x2="600" y2="322" stroke="#334155" stroke-width="1.6"/>

  <!-- y ticks -->
  <g font-size="11" fill="#334155" text-anchor="end">
    <text x="65" y="326">0</text>
    <text x="65" y="259">25</text>
    <text x="65" y="192">50</text>
    <text x="65" y="125">75</text>
    <text x="65" y="58">100</text>
  </g>
  <!-- x ticks -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="72" y="340">1</text>
    <text x="204" y="340">10</text>
    <text x="336" y="340">100</text>
    <text x="468" y="340">1000</text>
    <text x="600" y="340">10⁴</text>
  </g>

  <text x="336" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Stiffness contrast  SC = E_passive / E_active</text>
  <text x="24" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" transform="rotate(-90 24 188)">Fold that stays in hinge  f (%)</text>

  <!-- localisation curve f = SC/(SC+100) -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.5"
    points="72,319.4 98.4,317.8 124.8,315.4 151.2,311.7 177.6,306.1 204,297.6 230.4,285.3 256.8,268.2 283.2,245.7 309.6,218.3 336,188 362.4,157.7 388.8,130.3 415.2,107.8 441.6,90.7 468,78.4 494.4,69.9 520.8,64.3 547.2,60.6 573.6,58.2 600,56.7"/>

  <!-- answer point SC=100 -> 50% -->
  <circle cx="336" cy="188" r="5" fill="#E2570F" stroke="#ffffff" stroke-width="1.5"/>
  <text x="345" y="184" font-size="11" font-weight="700" fill="#E2570F">f = 50% at SC = 100</text>

  <text x="120" y="238" font-size="11" fill="#64748B" font-style="italic">panels bow, fold smears</text>
</svg>
