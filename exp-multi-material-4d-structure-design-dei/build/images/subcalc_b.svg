<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc B: Degrees of Freedom (Grubler-Kutzbach)</text>

  <!-- gripper mechanism -->
  <text x="150" y="74" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Compliant gripper (target F = 2)</text>
  <rect x="110" y="190" width="80" height="22" rx="4" fill="#475569"/>
  <text x="150" y="226" fill="#64748b" font-size="9" text-anchor="middle">ground link</text>
  <line x1="125" y1="190" x2="105" y2="110" stroke="#8A1134" stroke-width="9"/>
  <line x1="175" y1="190" x2="195" y2="110" stroke="#8A1134" stroke-width="9"/>
  <line x1="105" y1="110" x2="110" y2="70" stroke="#8A1134" stroke-width="7"/>
  <line x1="195" y1="110" x2="190" y2="70" stroke="#8A1134" stroke-width="7"/>
  <g fill="#2563eb"><circle cx="125" cy="190" r="7"/><circle cx="175" cy="190" r="7"/><circle cx="105" cy="110" r="7"/><circle cx="195" cy="110" r="7"/></g>
  <text x="240" y="150" fill="#2563eb" font-size="10" font-weight="700">joints</text>
  <text x="80" y="95" fill="#8A1134" font-size="10" font-weight="700">links</text>

  <!-- regime bar -->
  <text x="470" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Mobility regime</text>
  <rect x="335" y="95" width="90" height="40" rx="6" fill="#fca5a5"/><text x="380" y="120" fill="#7f1d1d" font-size="11" font-weight="700" text-anchor="middle">F&lt;2 locked</text>
  <rect x="430" y="95" width="90" height="40" rx="6" fill="#6ee7b7"/><text x="475" y="120" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">F=2 target</text>
  <rect x="525" y="95" width="90" height="40" rx="6" fill="#fcd34d"/><text x="570" y="120" fill="#92400e" font-size="11" font-weight="700" text-anchor="middle">F&gt;2 floppy</text>
  <text x="475" y="170" fill="#475569" font-size="11" text-anchor="middle">Add a joint &#8594; lower F &#183; Add a link &#8594; raise F</text>
  <text x="475" y="200" fill="#1e293b" font-size="13" font-weight="700" text-anchor="middle">n=4, j&#8321;=3, j&#8322;=1 &#8594; F = 9 &#8722; 6 &#8722; 1 = 2</text>
  <text x="475" y="222" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">2 DOF: open/close + lateral</text>

  <!-- equation panel -->
  <rect x="20" y="252" width="600" height="168" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="280" fill="#8A1134" font-size="14" font-weight="700">Governing equation</text>
  <text x="36" y="312" fill="#1e293b" font-size="16" font-weight="700">F = 3(n &#8722; 1) &#8722; 2 j&#8321; &#8722; j&#8322;</text>
  <text x="36" y="340" fill="#475569" font-size="12">n = links (incl. ground) &#183; j&#8321; = full joints (1 DOF, &#8722;2 each) &#183; j&#8322; = half joints (2 DOF, &#8722;1 each)</text>
  <text x="36" y="366" fill="#1e293b" font-size="14" font-weight="700">Links for target: n = (F + 2 j&#8321; + j&#8322;)/3 + 1</text>
  <text x="36" y="392" fill="#0f766e" font-size="12" font-weight="700">First application of classical Theory-of-Machines mobility to a 4D-printing design.</text>
  <text x="36" y="412" fill="#b91c1c" font-size="11" font-weight="700">Approximate for compliant flexures: they distribute deformation (not point joints).</text>
</svg>
