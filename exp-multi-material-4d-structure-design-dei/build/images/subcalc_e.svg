<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc E: Printed Hinge Fatigue (Basquin's Law)</text>

  <!-- bent hinge with strain -->
  <text x="140" y="74" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Flexure hinge bent to R_min</text>
  <path d="M60 200 h60 a40 40 0 0 1 40 -40 v-60" fill="none" stroke="#475569" stroke-width="16"/>
  <path d="M120 200 a40 40 0 0 1 40 -40" fill="none" stroke="#14b8a6" stroke-width="9"/>
  <text x="170" y="215" fill="#8A1134" font-size="10" font-weight="700">R_min = L/&#952;</text>
  <text x="205" y="170" fill="#b91c1c" font-size="10" font-weight="700">&#949;_max = h/2R</text>
  <text x="40" y="240" fill="#64748b" font-size="10">surface strain peaks at the bend</text>

  <!-- S-N curve -->
  <text x="470" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">S-N curve (Basquin)</text>
  <line x1="350" y1="84" x2="350" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="350" y1="220" x2="620" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="339" y="94" fill="#475569" font-size="10" text-anchor="end">&#963;</text>
  <text x="620" y="237" fill="#475569" font-size="10" text-anchor="end">log N</text>
  <path d="M356 92 Q430 150 520 185 Q580 205 614 212" fill="none" stroke="#8A1134" stroke-width="2.5"/>
  <line x1="470" y1="84" x2="470" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="470" y="96" fill="#64748b" font-size="8" text-anchor="middle">N=1e3</text>
  <line x1="545" y1="84" x2="545" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="545" y="96" fill="#64748b" font-size="8" text-anchor="middle">N=1e5</text>
  <circle cx="500" cy="178" r="6" fill="#ef4444"/><text x="510" y="178" fill="#ef4444" font-size="9" font-weight="700">operating point</text>

  <!-- equation panel -->
  <rect x="20" y="252" width="600" height="168" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="280" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="312" fill="#1e293b" font-size="15" font-weight="700">&#949;_max = h / (2 R_min)      &#963;_max = E &#183; &#949;_max</text>
  <text x="36" y="340" fill="#1e293b" font-size="15" font-weight="700">N = (&#963;_f / &#963;_max)^(1/b)      (&#963;_f &#8776; 60 MPa, b = 0.1)</text>
  <text x="36" y="368" fill="#0f766e" font-size="12" font-weight="700">1/b = 10 &#8594; life is extremely sensitive to stress: thinner h &#8594; far longer life.</text>
  <text x="36" y="392" fill="#b91c1c" font-size="12" font-weight="700">Basquin is for metals; polymer fatigue carries ~factor-of-3 scatter.</text>
  <text x="36" y="412" fill="#475569" font-size="11" font-weight="700">Apply a safety factor of 5 on N: design so safe life N/5 exceeds the target cycles.</text>
</svg>
