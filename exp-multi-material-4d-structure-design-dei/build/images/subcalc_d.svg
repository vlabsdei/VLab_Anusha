<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc D: Origami-Based Structures (Miura Fold)</text>

  <!-- Miura herringbone pattern -->
  <text x="160" y="74" fill="#475569" font-size="12" font-weight="700" text-anchor="middle">Miura-ori crease pattern</text>
  <g stroke="#8A1134" stroke-width="2" fill="none">
    <path d="M40 90 l40 18 l40 -18 l40 18 l40 -18 l40 18"/>
    <path d="M40 130 l40 18 l40 -18 l40 18 l40 -18 l40 18"/>
    <path d="M40 170 l40 18 l40 -18 l40 18 l40 -18 l40 18"/>
    <path d="M40 210 l40 18 l40 -18 l40 18 l40 -18 l40 18"/>
  </g>
  <g stroke="#2563eb" stroke-width="1.6" fill="none" stroke-dasharray="5 3">
    <line x1="40" y1="90" x2="40" y2="210"/><line x1="80" y1="108" x2="80" y2="228"/>
    <line x1="120" y1="90" x2="120" y2="210"/><line x1="160" y1="108" x2="160" y2="228"/>
    <line x1="200" y1="90" x2="200" y2="210"/><line x1="240" y1="108" x2="240" y2="228"/>
  </g>
  <text x="55" y="250" fill="#8A1134" font-size="9" font-weight="700">mountain</text>
  <text x="175" y="250" fill="#2563eb" font-size="9" font-weight="700">valley</text>

  <!-- auxetic indicator -->
  <text x="470" y="74" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">Auxetic behaviour</text>
  <rect x="380" y="95" width="80" height="60" rx="6" fill="#ccfbf1" stroke="#14b8a6"/>
  <path d="M470 125 h36" stroke="#8A1134" stroke-width="2" marker-end="url(#arD)"/>
  <rect x="516" y="85" width="100" height="80" rx="6" fill="#99f6e4" stroke="#0d9488"/>
  <defs><marker id="arD" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A1134"/></marker></defs>
  <text x="420" y="180" fill="#0f766e" font-size="10" text-anchor="middle">stretch x</text>
  <text x="566" y="180" fill="#0f766e" font-size="10" font-weight="700" text-anchor="middle">expands x AND y</text>
  <text x="498" y="210" fill="#9333ea" font-size="12" font-weight="700" text-anchor="middle">&#957;_x &lt; 0 (negative Poisson)</text>

  <!-- equation panel -->
  <rect x="20" y="262" width="600" height="158" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="290" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="320" fill="#1e293b" font-size="15" font-weight="700">tan(&#952;_M) = tan(&#945;) &#183; sin(&#966;)</text>
  <text x="36" y="348" fill="#1e293b" font-size="14" font-weight="700">A_ratio = sin(&#966;)cos(&#945;) / (sin&#178;(&#945;)cos(&#966;) + cos&#178;(&#945;))   &#8594; A_ratio &lt; 1 (folds smaller)</text>
  <text x="36" y="376" fill="#9333ea" font-size="14" font-weight="700">&#957;_x = &#8722;(&#8706;&#949;_y/&#8706;&#949;_x) &lt; 0   (auxetic)</text>
  <text x="36" y="402" fill="#94a3b8" font-size="11" font-weight="700">Rigid-origami assumption fails when panel thickness &gt; ~5% of panel length (Tachi-Miura).</text>
</svg>
