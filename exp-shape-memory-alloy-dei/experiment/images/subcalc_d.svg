<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc D: Actuator Stroke &amp; Force Sizing</text>

  <!-- wire contracting and lifting a load -->
  <text x="175" y="74" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Wire contracts on heating &#8594; lifts load</text>
  <rect x="60" y="86" width="230" height="10" fill="#cbd5e1"/>
  <!-- cold (long) -->
  <line x1="110" y1="96" x2="110" y2="180" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
  <rect x="92" y="180" width="36" height="24" rx="3" fill="#94a3b8"/>
  <text x="110" y="222" fill="#2563eb" font-size="10" font-weight="700" text-anchor="middle">cold</text>
  <!-- hot (short) -->
  <line x1="230" y1="96" x2="230" y2="150" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <rect x="212" y="150" width="36" height="24" rx="3" fill="#94a3b8"/>
  <text x="230" y="222" fill="#dc2626" font-size="10" font-weight="700" text-anchor="middle">hot</text>
  <path d="M150 165 L195 165" stroke="#8A1134" stroke-width="2.5" marker-end="url(#arE)"/>
  <defs><marker id="arE" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8A1134"/></marker></defs>
  <line x1="148" y1="180" x2="148" y2="150" stroke="#16a34a" stroke-width="1.4"/>
  <text x="170" y="148" fill="#16a34a" font-size="10" font-weight="700" text-anchor="middle">stroke d</text>

  <!-- force-displacement work triangle -->
  <text x="480" y="74" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Force vs displacement (work)</text>
  <line x1="380" y1="210" x2="600" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="210" x2="380" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="372" y="100" fill="#475569" font-size="10" text-anchor="end">F</text>
  <text x="600" y="226" fill="#475569" font-size="10" text-anchor="end">d</text>
  <polygon points="380,210 380,110 560,210" fill="#fde2e7" stroke="#8A1134" stroke-width="2"/>
  <text x="376" y="106" fill="#8A1134" font-size="9" text-anchor="end" font-weight="700">F_block</text>
  <text x="560" y="224" fill="#1e293b" font-size="9" text-anchor="middle" font-weight="700">d</text>
  <text x="450" y="175" fill="#8A1134" font-size="10" font-weight="700">W = F_block&#183;d / 2</text>

  <!-- equation panel -->
  <rect x="20" y="248" width="600" height="172" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="276" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="304" fill="#1e293b" font-size="14" font-weight="700">Stroke:  d = e_pre &#215; L_wire</text>
  <text x="36" y="330" fill="#1e293b" font-size="14" font-weight="700">Blocking force:  F_block = &#963;_recovery &#215; A_wire</text>
  <text x="36" y="356" fill="#1e293b" font-size="14" font-weight="700">Work:  W = (F_block &#215; d) / 2     Specific work:  w_sp = W / m_wire</text>
  <text x="36" y="380" fill="#475569" font-size="12">&#963;_recovery = &#963;_AM at the operating temperature; A_wire = &#960;&#183;d_w&#178;/4.</text>
  <text x="36" y="404" fill="#94a3b8" font-size="11">Specific work: SMP &#8776; 5 J/kg, pneumatics &#8776; 100, hydraulics &#8776; 1000, SMA wire &gt; 1000 J/kg.</text>
</svg>
