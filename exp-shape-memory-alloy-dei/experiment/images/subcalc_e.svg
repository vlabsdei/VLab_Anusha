<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="620" height="360" fill="white"/>

  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="620" height="360" fill="url(#grid)"/>

  <!-- Axes -->
  <line x1="60" y1="30" x2="60" y2="310" stroke="#334155" stroke-width="2"/>
  <line x1="60" y1="310" x2="600" y2="310" stroke="#334155" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="25" y="180" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="end" font-style="italic">Strain Amplitude (%)</text>
  <text x="330" y="340" font-family="Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-style="italic">Cycles to Failure (log scale)</text>

  <!-- Cycles markers on x-axis (log scale) -->
  <line x1="100" y1="305" x2="100" y2="315" stroke="#334155" stroke-width="1"/>
  <text x="100" y="330" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">10<tspan baseline-shift="super">2</tspan></text>

  <line x1="180" y1="305" x2="180" y2="315" stroke="#334155" stroke-width="1"/>
  <text x="180" y="330" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">10<tspan baseline-shift="super">3</tspan></text>

  <line x1="260" y1="305" x2="260" y2="315" stroke="#334155" stroke-width="1"/>
  <text x="260" y="330" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">10<tspan baseline-shift="super">4</tspan></text>

  <line x1="340" y1="305" x2="340" y2="315" stroke="#334155" stroke-width="1"/>
  <text x="340" y="330" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">10<tspan baseline-shift="super">5</tspan></text>

  <line x1="420" y1="305" x2="420" y2="315" stroke="#334155" stroke-width="1"/>
  <text x="420" y="330" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">10<tspan baseline-shift="super">6</tspan></text>

  <line x1="500" y1="305" x2="500" y2="315" stroke="#334155" stroke-width="1"/>
  <text x="500" y="330" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">10<tspan baseline-shift="super">7</tspan></text>

  <!-- Strain markers on y-axis -->
  <line x1="55" y1="310" x2="65" y2="310" stroke="#334155" stroke-width="1"/>
  <text x="50" y="315" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">0</text>

  <line x1="55" y1="250" x2="65" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="50" y="255" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">2</text>

  <line x1="55" y1="190" x2="65" y2="190" stroke="#334155" stroke-width="1"/>
  <text x="50" y="195" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">4</text>

  <line x1="55" y1="130" x2="65" y2="130" stroke="#334155" stroke-width="1"/>
  <text x="50" y="135" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">6</text>

  <line x1="55" y1="70" x2="65" y2="70" stroke="#334155" stroke-width="1"/>
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="end">8</text>

  <!-- S-N curve: N_f = C / epsilon^2, with C = 8 (strain as fraction) -->
  <!-- Plot points: (100, 80%), (180, 40%), (260, 18%), (340, 8%), (420, 3.2%), (500, 1.3%) -->
  <path d="M 100 85 L 130 125 L 160 160 L 190 185 L 220 205 L 250 218 L 280 228 L 310 235 L 340 240 L 370 243 L 400 245 L 430 247 L 460 248 L 490 249 L 520 250"
        fill="none" stroke="#1E40AF" stroke-width="2.5"/>

  <!-- 4000-cycle dividing line (vertical at ~N = 4000, log scale place it around 260) -->
  <line x1="260" y1="30" x2="260" y2="310" stroke="#E2570F" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="260" y="20" font-family="Arial, sans-serif" font-size="11" fill="#E2570F" font-weight="bold" text-anchor="middle">4000 cycles</text>

  <!-- Regions annotation -->
  <rect x="100" y="260" width="140" height="45" fill="#E2570F" opacity="0.1" stroke="#E2570F" stroke-width="1.5"/>
  <text x="170" y="280" font-family="Arial, sans-serif" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">Low-Cycle Fatigue</text>
  <text x="170" y="295" font-family="Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">High-strain regime</text>

  <rect x="300" y="260" width="200" height="45" fill="#1E40AF" opacity="0.1" stroke="#1E40AF" stroke-width="1.5"/>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="10" fill="#334155" font-weight="bold" text-anchor="middle">High-Cycle Fatigue (Durable)</text>
  <text x="400" y="295" font-family="Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">Finite-life service regime</text>

  <!-- Coffin-Manson law annotation -->
  <rect x="350" y="50" width="230" height="85" fill="white" stroke="#334155" stroke-width="1"/>
  <text x="465" y="70" font-family="Arial, sans-serif" font-size="12" fill="#334155" font-weight="bold" text-anchor="middle">Coffin-Manson Law</text>

  <line x1="360" y1="78" x2="570" y2="78" stroke="#334155" stroke-width="0.5"/>

  <text x="465" y="95" font-family="Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">N<tspan baseline-shift="sub">f</tspan> = C / ε<tspan baseline-shift="sub">a</tspan><tspan baseline-shift="super">2</tspan></text>

  <text x="465" y="112" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">C = 8 (constant)</text>

  <text x="465" y="127" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">ε<tspan baseline-shift="sub">a</tspan> = strain amplitude (fraction)</text>

  <!-- Functional fatigue box -->
  <rect x="30" y="50" width="300" height="85" fill="white" stroke="#334155" stroke-width="1"/>
  <text x="180" y="70" font-family="Arial, sans-serif" font-size="12" fill="#334155" font-weight="bold" text-anchor="middle">Functional Fatigue Loss</text>

  <line x1="40" y1="78" x2="290" y2="78" stroke="#334155" stroke-width="0.5"/>

  <text x="180" y="95" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">ε<tspan baseline-shift="sub">rec</tspan> = ε<tspan baseline-shift="sub">app</tspan> × exp(−kN<tspan baseline-shift="sub">ref</tspan>)</text>

  <text x="180" y="110" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">k = k<tspan baseline-shift="sub">0</tspan> ε<tspan baseline-shift="super">n</tspan> (n = 1.8)</text>

  <text x="180" y="125" font-family="Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle" font-style="italic">Strain-sensitive recovery loss</text>

  <!-- Design note -->
  <rect x="100" y="150" width="500" height="50" fill="white" stroke="#E2570F" stroke-width="1.5"/>
  <text x="350" y="170" font-family="Arial, sans-serif" font-size="11" fill="#334155" font-weight="bold" text-anchor="middle">Design Strategy for Long Life</text>
  <text x="350" y="190" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Minimize strain amplitude: both structural fatigue (∝ ε<tspan baseline-shift="super">−2</tspan>) and functional decay (∝ ε<tspan baseline-shift="super">1.8</tspan>) scale sharply with strain.</text>

  <!-- Legend -->
  <line x1="450" y1="310" x2="520" y2="310" stroke="#1E40AF" stroke-width="2.5"/>
  <text x="530" y="314" font-family="Arial, sans-serif" font-size="10" fill="#334155">S-N curve</text>
</svg>
