<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="#FFFFFF"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">UTM Stress–Strain Loops of Nitinol</text>

  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="205" y1="52" x2="205" y2="338"/>
    <line x1="340" y1="52" x2="340" y2="338"/>
    <line x1="475" y1="52" x2="475" y2="338"/>
    <line x1="70" y1="280.8" x2="610" y2="280.8"/>
    <line x1="70" y1="223.6" x2="610" y2="223.6"/>
    <line x1="70" y1="166.4" x2="610" y2="166.4"/>
    <line x1="70" y1="109.2" x2="610" y2="109.2"/>
  </g>

  <line x1="70" y1="52" x2="70" y2="338" stroke="#334155" stroke-width="1.5"/>
  <line x1="70" y1="338" x2="610" y2="338" stroke="#334155" stroke-width="1.5"/>

  <g fill="#334155" font-size="11" text-anchor="middle">
    <line x1="70" y1="338" x2="70" y2="343" stroke="#334155"/><text x="70" y="356">0</text>
    <line x1="205" y1="338" x2="205" y2="343" stroke="#334155"/><text x="205" y="356">2</text>
    <line x1="340" y1="338" x2="340" y2="343" stroke="#334155"/><text x="340" y="356">4</text>
    <line x1="475" y1="338" x2="475" y2="343" stroke="#334155"/><text x="475" y="356">6</text>
    <line x1="610" y1="338" x2="610" y2="343" stroke="#334155"/><text x="610" y="356">8</text>
  </g>
  <g fill="#334155" font-size="11" text-anchor="end">
    <text x="62" y="342">0</text>
    <text x="62" y="284.8">100</text>
    <text x="62" y="227.6">200</text>
    <text x="62" y="170.4">300</text>
    <text x="62" y="113.2">400</text>
    <text x="62" y="56">500</text>
  </g>
  <text x="340" y="378" text-anchor="middle" font-size="13" fill="#334155">Strain (%)</text>
  <text x="24" y="195" text-anchor="middle" font-size="13" fill="#334155" transform="rotate(-90 24 195)">Stress (MPa)</text>

  <!-- superelastic enclosed area (Whyst) -->
  <path d="M137.5,252.2 L475,237.9 L529,166.4 L461.5,286.5 L151,303.7 L70,338 L137.5,252.2 Z" fill="#E2570F" opacity="0.12"/>

  <!-- superelastic loop (closed, T >= Af) -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.5"
    points="70,338 137.5,252.2 475,237.9 529,166.4"/>
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.5"
    points="529,166.4 461.5,286.5 151,303.7 70,338"/>

  <!-- shape-memory loop (open, permanent set, T < Af) -->
  <polyline fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6 4"
    points="70,338 137.5,269.4 508.75,257.9 448,338"/>

  <!-- permanent set marker -->
  <circle cx="448" cy="338" r="3" fill="#E2570F"/>
  <line x1="448" y1="338" x2="448" y2="316" stroke="#E2570F" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="448" y="310" text-anchor="middle" font-size="11" fill="#E2570F" font-weight="bold">permanent set</text>

  <!-- Whyst annotation -->
  <text x="300" y="215" text-anchor="middle" font-size="12" fill="#E2570F" font-weight="bold">W_hyst</text>

  <!-- legend -->
  <g font-size="11" fill="#334155">
    <line x1="360" y1="90" x2="388" y2="90" stroke="#1E40AF" stroke-width="2.5"/>
    <text x="393" y="94">Superelastic  (T ≥ Af)</text>
    <line x1="360" y1="109" x2="388" y2="109" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="393" y="113">Shape memory  (T &lt; Af)</text>
  </g>
</svg>
