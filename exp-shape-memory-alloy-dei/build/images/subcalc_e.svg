<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc E: Fatigue Life &amp; Stability</text>

  <!-- LEFT: structural fatigue N vs e -->
  <text x="175" y="74" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Structural fatigue (Coffin-Manson)</text>
  <line x1="60" y1="210" x2="290" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="60" y2="86" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="96" fill="#475569" font-size="10" text-anchor="end">N</text>
  <text x="290" y="226" fill="#475569" font-size="10" text-anchor="end">e_applied</text>
  <path d="M72 96 Q95 175 140 195 Q200 208 285 209" fill="none" stroke="#8A1134" stroke-width="2.5"/>
  <line x1="60" y1="170" x2="290" y2="170" stroke="#16a34a" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="286" y="165" fill="#16a34a" font-size="9" font-weight="700" text-anchor="end">N = 100k target</text>
  <text x="150" y="120" fill="#8A1134" font-size="9" font-weight="700">N = C / e&#178;</text>

  <!-- RIGHT: functional fatigue decay -->
  <text x="480" y="74" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Functional fatigue (strain decay)</text>
  <line x1="380" y1="210" x2="610" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="380" y1="210" x2="380" y2="86" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="372" y="96" fill="#475569" font-size="10" text-anchor="end">e_rec</text>
  <text x="610" y="226" fill="#475569" font-size="10" text-anchor="end">N cycles</text>
  <path d="M380 100 Q460 150 520 175 Q570 195 610 200" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="470" y="135" fill="#dc2626" font-size="9" font-weight="700">e_rec = e_app&#183;exp(&#8722;kN)</text>

  <!-- equation panel -->
  <rect x="20" y="248" width="600" height="172" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="276" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="304" fill="#1e293b" font-size="14" font-weight="700">Coffin-Manson:  N_cycles = C / e_applied&#178;</text>
  <text x="36" y="330" fill="#1e293b" font-size="14" font-weight="700">Functional decay:  e_recoverable(N) = e_applied &#215; exp(&#8722;0.00001&#183;N)</text>
  <text x="36" y="356" fill="#475569" font-size="12">C &#8776; 1000 for standard Nitinol. Lower applied strain &#8594; many more cycles (steep 1/e&#178; law).</text>
  <text x="36" y="380" fill="#475569" font-size="12">Structural fatigue = crack growth to failure; functional fatigue = gradual loss of recoverable strain.</text>
  <text x="36" y="404" fill="#94a3b8" font-size="11">For N &gt; 100,000 cycles the applied strain must be strictly limited (well below e_max).</text>
</svg>
