<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Inter, Arial, sans-serif">
  <rect width="640" height="440" fill="#ffffff"/>
  <rect x="0" y="0" width="640" height="46" fill="#8A1134"/>
  <text x="20" y="29" fill="#ffffff" font-size="18" font-weight="700">Sub-Calc A: Martensite &#8596; Austenite Transformation</text>

  <!-- hysteresis plot: phase fraction vs temperature -->
  <text x="200" y="76" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Phase fraction x_M vs temperature (hysteresis)</text>
  <line x1="60" y1="210" x2="350" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="210" x2="60" y2="92" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="100" fill="#475569" font-size="10" text-anchor="end">1</text>
  <text x="52" y="210" fill="#475569" font-size="10" text-anchor="end">0</text>
  <text x="46" y="150" fill="#475569" font-size="10" text-anchor="end" transform="rotate(-90 46 150)">x_M</text>
  <text x="350" y="226" fill="#475569" font-size="10" text-anchor="end">T &#8594;</text>
  <!-- cooling branch A->M (blue) -->
  <path d="M350 210 L150 210 Q120 210 110 150 Q102 100 90 100 L60 100" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="250" y="204" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">cooling A&#8594;M</text>
  <!-- heating branch M->A (red) -->
  <path d="M60 100 L220 100 Q250 100 260 150 Q268 210 280 210 L350 210" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="160" y="94" fill="#dc2626" font-size="9" font-weight="700" text-anchor="middle">heating M&#8594;A</text>
  <!-- transformation temperature markers -->
  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="105" y1="210" x2="105" y2="100"/><line x1="150" y1="210" x2="150" y2="100"/>
    <line x1="225" y1="210" x2="225" y2="100"/><line x1="278" y1="210" x2="278" y2="100"/>
  </g>
  <text x="105" y="224" fill="#1e293b" font-size="9" text-anchor="middle" font-weight="700">M_f</text>
  <text x="150" y="224" fill="#1e293b" font-size="9" text-anchor="middle" font-weight="700">M_s</text>
  <text x="225" y="224" fill="#1e293b" font-size="9" text-anchor="middle" font-weight="700">A_s</text>
  <text x="278" y="224" fill="#1e293b" font-size="9" text-anchor="middle" font-weight="700">A_f</text>

  <!-- lattice schematic -->
  <text x="490" y="76" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Lattice: twinned martensite &#8594; austenite</text>
  <rect x="400" y="92" width="80" height="118" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <g stroke="#2563eb" stroke-width="1.6" fill="none">
    <path d="M410 104 l18 14 l-18 14 l18 14 l-18 14 l18 14 l-18 14"/>
    <path d="M440 104 l18 14 l-18 14 l18 14 l-18 14 l18 14 l-18 14"/>
  </g>
  <text x="440" y="226" fill="#2563eb" font-size="9" text-anchor="middle" font-weight="700">martensite (twinned)</text>
  <path d="M495 150 L530 150" stroke="#8A1134" stroke-width="3" marker-end="url(#arA3)"/>
  <text x="512" y="142" fill="#8A1134" font-size="9" font-weight="700" text-anchor="middle">heat</text>
  <defs><marker id="arA3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#8A1134"/></marker></defs>
  <rect x="540" y="100" width="74" height="102" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <g stroke="#dc2626" stroke-width="1.6">
    <line x1="552" y1="112" x2="602" y2="112"/><line x1="552" y1="138" x2="602" y2="138"/>
    <line x1="552" y1="164" x2="602" y2="164"/><line x1="552" y1="190" x2="602" y2="190"/>
    <line x1="565" y1="112" x2="565" y2="190"/><line x1="589" y1="112" x2="589" y2="190"/>
  </g>
  <text x="577" y="216" fill="#dc2626" font-size="9" text-anchor="middle" font-weight="700">austenite (cubic)</text>

  <!-- equation panel -->
  <rect x="20" y="248" width="600" height="172" rx="10" fill="#fafbfc" stroke="#e2e8f0"/>
  <text x="36" y="276" fill="#8A1134" font-size="14" font-weight="700">Governing equations</text>
  <text x="36" y="304" fill="#1e293b" font-size="14" font-weight="700">Duerig:  M_s (&#176;C) = 1020 &#8722; 99.3 &#215; (at% Ni &#8722; 40.91)</text>
  <text x="36" y="330" fill="#1e293b" font-size="14" font-weight="700">x_M = 0.5&#183;cos[&#960;(T &#8722; A_s)/(A_f &#8722; A_s)] + 0.5   (A_s &#8804; T &#8804; A_f)</text>
  <text x="36" y="356" fill="#1e293b" font-size="14" font-weight="700">Recoverable strain:  e_SMA = e_max &#215; (1 &#8722; x_M)</text>
  <text x="36" y="382" fill="#475569" font-size="12">Offsets: M_f = M_s &#8722; 20, A_s = M_s + 30, A_f = A_s + 20 (&#176;C). e_max &#8776; 8% for NiTi.</text>
  <text x="36" y="404" fill="#94a3b8" font-size="11">A 0.1 at% change in Ni shifts M_s by ~10 &#176;C; the gap A_s &#8722; M_s is the transformation hysteresis.</text>
</svg>
