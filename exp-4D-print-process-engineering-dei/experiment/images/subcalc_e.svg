<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Dimensional Accuracy &#38; Tolerance Stack-up</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#64748B">Process variation from shrinkage, vibration, &#38; thermal drift; RSS vs. worst-case (Sub-Calc E)</text>

  <!-- specification limits ±USL -->
  <line x1="150" y1="70" x2="150" y2="250" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="5 3"/>
  <text x="135" y="65" font-size="10" fill="#DC2626" font-weight="bold">&#8722;USL</text>

  <line x1="470" y1="70" x2="470" y2="250" stroke="#DC2626" stroke-width="2.2" stroke-dasharray="5 3"/>
  <text x="480" y="65" font-size="10" fill="#DC2626" font-weight="bold">+USL</text>

  <!-- center line (nominal) -->
  <line x1="310" y1="70" x2="310" y2="250" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <text x="310" y="60" font-size="10" fill="#334155" text-anchor="middle" font-weight="bold">nominal</text>

  <!-- normal distribution curve (process) -->
  <path d="M 150,240 Q 230,130 310,80 Q 390,130 470,240" fill="#1E40AF" opacity="0.08" stroke="#1E40AF" stroke-width="2.2"/>

  <!-- 3-sigma bands -->
  <line x1="200" y1="70" x2="200" y2="250" stroke="#94A3B8" stroke-width="0.8" opacity="0.6"/>
  <line x1="420" y1="70" x2="420" y2="250" stroke="#94A3B8" stroke-width="0.8" opacity="0.6"/>
  <text x="310" y="270" font-size="9" fill="#64748B" text-anchor="middle">&#177;3&#963;<sub>proc</sub></text>

  <!-- stack-up comparison: RSS bar vs. Worst-Case bar -->
  <g>
    <!-- RSS stack bar (smaller, red outline) -->
    <rect x="270" y="150" width="20" height="60" fill="#E2570F" opacity="0.3" stroke="#E2570F" stroke-width="2"/>
    <text x="295" y="183" font-size="9.5" fill="#B45309" font-weight="bold">&#948;<sub>RSS</sub></text>
    <text x="295" y="197" font-size="8.5" fill="#B45309">~0.17 mm</text>

    <!-- Worst-Case stack bar (larger, rust) -->
    <rect x="330" y="110" width="20" height="100" fill="#E2570F" opacity="0.5" stroke="#E2570F" stroke-width="2"/>
    <text x="360" y="161" font-size="9.5" fill="#8B3410" font-weight="bold">&#948;<sub>WC</sub></text>
    <text x="360" y="175" font-size="8.5" fill="#8B3410">0.30 mm</text>

    <!-- note -->
    <text x="310" y="290" font-size="9.5" fill="#334155" text-anchor="middle" font-weight="bold">
      RSS assumes independent errors; WC is the honest bound when errors correlate
    </text>
  </g>

  <!-- grid annotation -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.4">
    <line x1="80" y1="240" x2="540" y2="240"/>
  </g>

  <!-- capability index box -->
  <rect x="100" y="310" width="420" height="38" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="2"/>
  <text x="310" y="322" font-size="9.5" text-anchor="middle" fill="#334155" font-weight="bold">
    C<sub>pk</sub> = (USL &#8722; &#956;) / (3&#963;<sub>proc</sub>)  &#160;&#160;  Target: C<sub>pk</sub> &#8805; 1.33  (margin against 1&#963; shift)
  </text>
  <text x="310" y="338" font-size="9" text-anchor="middle" fill="#64748B">
    Shrinkage &#948;<sub>mean</sub> = k<sub>shrink</sub>&#183;L&#183;&#916;T<sub>cool</sub>  &#160;&#160;  &#963;<sub>proc</sub> = k<sub>vib</sub>&#183;v<sub>print</sub> + k<sub>temp</sub>&#183;&#916;T<sub>nozzle</sub>
  </text>

  <!-- legend -->
  <g>
    <line x1="105" y1="95" x2="135" y2="95" stroke="#1E40AF" stroke-width="2.5"/>
    <text x="145" y="100" font-size="9.5" fill="#334155">process distribution</text>

    <line x1="105" y1="115" x2="135" y2="115" stroke="#DC2626" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="145" y="120" font-size="9.5" fill="#334155">&#177;USL spec band</text>

    <rect x="105" y="130" width="25" height="10" fill="#E2570F" opacity="0.4" stroke="#E2570F" stroke-width="1.5"/>
    <text x="145" y="138" font-size="9.5" fill="#334155">stack errors (RSS vs WC)</text>
  </g>

  <!-- axis labels -->
  <text x="310" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Tolerance Band  (relative error)</text>
</svg>
