<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Print Anisotropy &#8212; Tsai-Hill Off-Axis Strength</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#64748B">Raster angle &#952; sets failure envelope; shear minimum dominates near 45&#8211;55&#176; (Sub-Calc D)</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="80" y1="70" x2="580" y2="70"/>
    <line x1="80" y1="127" x2="580" y2="127"/>
    <line x1="80" y1="184" x2="580" y2="184"/>
    <line x1="80" y1="241" x2="580" y2="241"/>
    <line x1="180" y1="70" x2="180" y2="300"/>
    <line x1="280" y1="70" x2="280" y2="300"/>
    <line x1="380" y1="70" x2="380" y2="300"/>
    <line x1="480" y1="70" x2="480" y2="300"/>
    <line x1="580" y1="70" x2="580" y2="300"/>
  </g>

  <!-- axes -->
  <line x1="80" y1="70" x2="80" y2="300" stroke="#334155" stroke-width="1.6"/>
  <line x1="80" y1="300" x2="580" y2="300" stroke="#334155" stroke-width="1.6"/>

  <!-- y-axis ticks (strength) -->
  <g font-size="10" fill="#64748B" text-anchor="end">
    <text x="74" y="304">0</text>
    <text x="74" y="247">15</text>
    <text x="74" y="190">30</text>
    <text x="74" y="133">40</text>
    <text x="74" y="76">50</text>
  </g>

  <!-- x-axis ticks (raster angle) -->
  <g font-size="10" fill="#64748B" text-anchor="middle">
    <text x="80" y="320">0&#176;</text>
    <text x="180" y="320">15&#176;</text>
    <text x="280" y="320">30&#176;</text>
    <text x="380" y="320">45&#176;</text>
    <text x="480" y="320">60&#176;</text>
    <text x="580" y="320">90&#176;</text>
  </g>

  <!-- reference lines for PLA: σ_L=47 MPa, σ_T=24 MPa -->
  <line x1="80" y1="86" x2="580" y2="86" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="590" y="90" font-size="9" fill="#64748B">&#963;<sub>L</sub>=47</text>

  <line x1="80" y1="154" x2="580" y2="154" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6"/>
  <text x="590" y="158" font-size="9" fill="#64748B">&#963;<sub>T</sub>=24</text>

  <!-- shear-minimum window (45–55°) highlighted -->
  <rect x="350" y="70" width="130" height="230" fill="#E2570F" opacity="0.05"/>
  <text x="415" y="150" font-size="10" fill="#B45309" text-anchor="middle" font-weight="bold">shear-driven</text>
  <text x="415" y="165" font-size="10" fill="#B45309" text-anchor="middle" font-weight="bold">weakness</text>

  <!-- Tsai-Hill strength curve for PLA (σ_L=47, σ_T=24, τ_LT≈20) -->
  <!-- curve calculated from Tsai-Hill: σ_θ = [cos^4(θ)/σ_L² + (1/τ_LT² - 1/σ_L²)sin²θ·cos²θ + sin^4(θ)/σ_T²]^(-1/2) -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="3" stroke-linejoin="round"
    points="80,86 130,98 180,113 230,130 280,147 330,162 380,175 430,167 480,155 530,134 580,154"/>

  <!-- mark the minimum point -->
  <circle cx="415" cy="168" r="5.5" fill="#E2570F" stroke="#ffffff" stroke-width="2"/>
  <text x="415" y="135" font-size="11" font-weight="bold" fill="#E2570F" text-anchor="middle">&#952;<sub>min</sub> &#8776; 53&#176;</text>
  <text x="415" y="148" font-size="10" fill="#E2570F" text-anchor="middle">&#963;<sub>&#952;</sub> &#8776; 18 MPa</text>

  <!-- annotations -->
  <text x="110" y="75" font-size="10" fill="#1E40AF" font-weight="bold">along road</text>
  <text x="550" y="145" font-size="10" fill="#1E40AF">cross road</text>

  <!-- legend box -->
  <rect x="85" y="310" width="360" height="38" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="2"/>
  <text x="265" y="322" font-size="9.5" text-anchor="middle" fill="#334155" font-weight="bold">
    Tsai-Hill criterion governs laminate failure; PLA AR = 47/24 = 1.96
  </text>
  <text x="265" y="338" font-size="9" text-anchor="middle" fill="#64748B">
    The weakest plane is NOT at 90&#176; but at the shear minimum ~53&#176;, where inter-road bonds shear apart
  </text>

  <!-- axis labels -->
  <text x="330" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Raster Angle  &#952;  (&#176;)</text>
  <text x="18" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155" transform="rotate(-90 18 185)">Off-Axis Strength  &#963;<sub>&#952;</sub>  (MPa)</text>
</svg>
