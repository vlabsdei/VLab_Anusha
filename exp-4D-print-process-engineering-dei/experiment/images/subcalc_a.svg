<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Inter-Layer Bonding by Reptation</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#64748B">Healing degree D&#8203;&#7488; = min(1, (t&#95;avail / t&#95;rep)&#185;&#8260;&#8308;)  &#183;  PLA, L&#95;h = 0.20 mm, v = 30 mm/s</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="80" y1="70" x2="580" y2="70"/>
    <line x1="80" y1="127" x2="580" y2="127"/>
    <line x1="80" y1="184" x2="580" y2="184"/>
    <line x1="80" y1="241" x2="580" y2="241"/>
    <line x1="180" y1="70" x2="180" y2="300"/>
    <line x1="280" y1="70" x2="280" y2="300"/>
    <line x1="380" y1="70" x2="380" y2="300"/>
    <line x1="480" y1="70" x2="480" y2="300"/>
  </g>

  <!-- isotropic window shading (D_b >= 0.80, y from 40..92) -->
  <rect x="80" y="70" width="500" height="22" fill="#1E40AF" opacity="0.08"/>
  <line x1="80" y1="92" x2="580" y2="92" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="90" y="86" font-size="11" fill="#475569">isotropic window · D&#8203;&#7488; &#8805; 0.80</text>

  <!-- axes -->
  <line x1="80" y1="70" x2="80" y2="300" stroke="#334155" stroke-width="1.6"/>
  <line x1="80" y1="300" x2="580" y2="300" stroke="#334155" stroke-width="1.6"/>

  <!-- y ticks -->
  <g font-size="10" fill="#64748B" text-anchor="end">
    <text x="74" y="304">0</text>
    <text x="74" y="245">0.4</text>
    <text x="74" y="188">0.6</text>
    <text x="74" y="131">0.8</text>
    <text x="74" y="74">1.0</text>
  </g>
  <!-- x ticks -->
  <g font-size="10" fill="#64748B" text-anchor="middle">
    <text x="80" y="316">190</text>
    <text x="180" y="316">200</text>
    <text x="280" y="316">210</text>
    <text x="380" y="316">220</text>
    <text x="480" y="316">230</text>
    <text x="580" y="316">240</text>
  </g>

  <!-- D_b curve (rust) -->
  <polyline fill="none" stroke="#E2570F" stroke-width="2.8" stroke-linejoin="round"
    points="80,144 180,130 280,116 380,102 480,87 580,72"/>

  <!-- current operating point -->
  <circle cx="480" cy="87" r="5" fill="#1E40AF" stroke="#ffffff" stroke-width="2"/>
  <text x="470" y="80" text-anchor="end" font-size="11" font-weight="bold" fill="#1E40AF">D&#8203;&#7488; = 0.82</text>

  <!-- weak-weld annotation -->
  <text x="92" y="164" font-size="10.5" fill="#B45309">weak weld · anisotropic</text>

  <!-- axis labels -->
  <text x="330" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Print temperature  T  (&#176;C)</text>
  <text x="22" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155" transform="rotate(-90 22 185)">Bonding degree  D&#8203;&#7488;  (&#8211;)</text>
</svg>
