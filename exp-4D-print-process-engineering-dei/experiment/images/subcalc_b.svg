<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Crystallisation During Printing</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#64748B">Temperature decay through T<sub>g</sub>&#8211;T<sub>m</sub> window; Avrami kinetics set stiffness (Sub-Calc B)</text>

  <!-- grid -->
  <g stroke="#E2E8F0" stroke-width="1">
    <line x1="80" y1="70" x2="580" y2="70"/>
    <line x1="80" y1="127" x2="580" y2="127"/>
    <line x1="80" y1="184" x2="580" y2="184"/>
    <line x1="80" y1="241" x2="580" y2="241"/>
    <line x1="180" y1="70" x2="180" y2="300"/>
    <line x1="280" y1="70" x2="280" y2="300"/>
    <line x1="380" y1="70" x2="380" y2="300"/>
    <line x1="480" y1="70" x2="480" y2="300"/>
    <line x1="580" y1="70" x2="580" y2="300"/>
  </g>

  <!-- shaded crystallisation window T_g to T_m (60-170 °C) -->
  <rect x="80" y="100" width="500" height="80" fill="#E2570F" opacity="0.06"/>
  <text x="90" y="115" font-size="10" fill="#B45309">T<sub>g</sub>&#8211;T<sub>m</sub> growth window</text>
  <text x="90" y="128" font-size="9" fill="#B45309">(60&#8211;170 &#176;C)</text>

  <!-- axes -->
  <line x1="80" y1="70" x2="80" y2="300" stroke="#334155" stroke-width="1.6"/>
  <line x1="80" y1="300" x2="580" y2="300" stroke="#334155" stroke-width="1.6"/>

  <!-- y ticks and labels (temperature) -->
  <g font-size="10" fill="#64748B" text-anchor="end">
    <text x="74" y="304">20</text>
    <text x="74" y="247">60</text>
    <text x="74" y="190">120</text>
    <text x="74" y="133">170</text>
    <text x="74" y="76">240</text>
  </g>

  <!-- x ticks and labels (time) -->
  <g font-size="10" fill="#64748B" text-anchor="middle">
    <text x="80" y="320">0</text>
    <text x="180" y="320">2</text>
    <text x="280" y="320">4</text>
    <text x="380" y="320">6</text>
    <text x="480" y="320">8</text>
    <text x="580" y="320">10</text>
  </g>

  <!-- exponential cooling curve T(t) = T_amb + (T_print - T_amb)*exp(-t/tau) -->
  <!-- from 240°C at t=0 to 20°C at t=10s, through Tg=60 and Tm=170 window -->
  <polyline fill="none" stroke="#1E40AF" stroke-width="2.8" stroke-linejoin="round"
    points="80,76 140,91 200,108 260,127 320,150 380,175 440,215 500,252 540,277 580,295"/>

  <!-- mark Tg and Tm boundaries -->
  <line x1="80" y1="247" x2="580" y2="247" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="590" y="251" font-size="9" fill="#64748B">T<sub>g</sub>=60&#176;C</text>

  <line x1="80" y1="133" x2="580" y2="133" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="590" y="137" font-size="9" fill="#64748B">T<sub>m</sub>=170&#176;C</text>

  <!-- dwell time annotation and crystallinity rise -->
  <text x="300" y="160" font-size="10" font-weight="bold" fill="#1E40AF">t<sub>x</sub> = &#964;<sub>cool</sub> &#183; ln[(T<sub>m</sub>&#8722;T<sub>amb</sub>)/(T<sub>g</sub>&#8722;T<sub>amb</sub>)]</text>

  <!-- avrami bar: X_c rises during dwell -->
  <g>
    <text x="320" y="65" font-size="10" fill="#334155">X<sub>c</sub> growth</text>
    <rect x="80" y="55" width="25" height="8" fill="#1E40AF" opacity="0.4"/>
    <text x="108" y="60" font-size="9" fill="#475569">low</text>
    <rect x="340" y="55" width="100" height="8" fill="#E2570F" opacity="0.6"/>
    <text x="445" y="60" font-size="9" fill="#334155">high crystallinity &#8594; stiff, poorer 4D actuator</text>
  </g>

  <!-- axis labels -->
  <text x="330" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">Time  t  (s)</text>
  <text x="18" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155" transform="rotate(-90 18 185)">Temperature  T  (&#176;C)</text>
</svg>
