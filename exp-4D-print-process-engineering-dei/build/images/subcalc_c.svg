<svg viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="620" height="360" fill="#ffffff"/>
  <text x="310" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Residual Stress &#38; Warpage</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#64748B">Constrained cooling locks biaxial strain; corner deflection &#948; &#8733; L²/2h &#183; f<sub>relax</sub></text>

  <!-- bed (ground) -->
  <rect x="100" y="260" width="420" height="20" fill="#A0AEC0" opacity="0.3"/>
  <line x1="100" y1="260" x2="520" y2="260" stroke="#64748B" stroke-width="2"/>
  <text x="60" y="275" font-size="10" fill="#64748B">bed (fixed)</text>

  <!-- plate geometry: undeformed -->
  <g opacity="0.3">
    <rect x="120" y="180" width="380" height="70" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 2"/>
    <text x="300" y="165" font-size="9" fill="#94A3B8" text-anchor="middle">undeformed</text>
  </g>

  <!-- plate deformed (warped at corners) -->
  <path d="M 120 260 L 130 240 L 500 240 L 510 260 Z" fill="#1E40AF" opacity="0.12" stroke="#1E40AF" stroke-width="2"/>

  <!-- corner deflection arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#E2570F" />
    </marker>
  </defs>

  <line x1="130" y1="240" x2="130" y2="260" stroke="#E2570F" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="145" y="252" font-size="11" font-weight="bold" fill="#E2570F">&#948;</text>

  <line x1="510" y1="240" x2="510" y2="260" stroke="#E2570F" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- residual stress field (arrows across the plate) -->
  <line x1="200" y1="250" x2="240" y2="250" stroke="#B45309" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="250" x2="380" y2="250" stroke="#B45309" stroke-width="1.5"/>
  <polygon points="380,250 368,245 372,250 368,255" fill="#B45309"/>
  <text x="310" y="230" font-size="10" fill="#B45309" text-anchor="middle">&#963;<sub>res</sub> (biaxial, locked)</text>

  <!-- constraint indicators at corners -->
  <circle cx="120" cy="260" r="4" fill="#334155"/>
  <circle cx="520" cy="260" r="4" fill="#334155"/>
  <text x="130" y="290" font-size="10" fill="#334155">held by</text>
  <text x="130" y="304" font-size="10" fill="#334155">layers below</text>

  <!-- formula and annotation box -->
  <rect x="80" y="320" width="460" height="28" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" rx="3"/>
  <text x="310" y="332" font-size="10" text-anchor="middle" fill="#334155">
    &#949;<sub>mis</sub> = &#945;(&#916;T)  &#160;&#160;  &#963;<sub>res</sub> = E&#945;&#916;T / (1&#8722;&#957;)  &#160;&#160;  &#948; = C &#183; &#949;<sub>mis</sub> &#183; L² / 2h &#183; f<sub>relax</sub>
  </text>
  <text x="310" y="344" font-size="9" text-anchor="middle" fill="#64748B">
    Heated bed raises f<sub>relax</sub> near T<sub>g</sub>: &#948; = 2.8 mm (unheated) &#8594; 0.6 mm (60&#176;C bed)
  </text>

  <!-- delamination risk marker -->
  <text x="310" y="70" font-size="11" fill="#DC2626" font-weight="bold" text-anchor="middle">
    Delamination risk: &#963;<sub>res</sub> &#62; 30 MPa bond strength
  </text>

  <!-- legend -->
  <line x1="100" y1="90" x2="130" y2="90" stroke="#1E40AF" stroke-width="2.5"/>
  <text x="140" y="94" font-size="10" fill="#334155">plate (cooled)</text>

  <line x1="100" y1="110" x2="130" y2="110" stroke="#E2570F" stroke-width="2"/>
  <text x="140" y="114" font-size="10" fill="#334155">corner lift &#948;</text>

  <line x1="100" y1="130" x2="130" y2="130" stroke="#B45309" stroke-width="1.5"/>
  <text x="140" y="134" font-size="10" fill="#334155">residual stress</text>
</svg>
